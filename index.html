<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love the Loveless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Gowun Batang', serif;
      min-height: 100vh;
    }

    .page-shell {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* =========================================
       [상단 헤더] Love the Loveless (Monsieur La Doulaise)
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 50;
    }
    .global-header h1 {
      font-family: 'Monsieur La Doulaise', cursive;
      font-weight: 400;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
      font-family: 'Gowun Batang', serif;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       메인 컨테이너
       ========================================= */
    .main-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .showcase-row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 290px;
      position: relative;
    }

    .player-stage {
      position: relative;
      width: 240px;
      height: 275px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* =========================================
       커버플로우(Cover Flow) 3D 스테이지
       ========================================= */
    .carousel-stage {
      position: absolute;
      top: 10px;
      left: 50%;
      margin-left: -260px;
      width: 520px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 750px;
      touch-action: none;
      z-index: 20;
    }

    .carousel-stage.deck-up,
    .carousel-stage.deck-up .lp-slot {
      pointer-events: none !important;
    }

    .stack-track {
      position: relative;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease, box-shadow 0.4s ease;
    }

    .lp-jacket.has-img {
      border: none;
    }
    .lp-jacket.has-img .lp-card-label,
    .lp-jacket.has-img .lp-card-title,
    .lp-jacket.has-img .lp-card-date {
      display: none;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    .carousel-stage.deck-up .lp-jacket {
      transform: translateY(-190px);
      opacity: 0;
      pointer-events: none;
    }

    .lp-card-label {
      font-size: 0.8rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.78rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .vinyl-disc {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 192px;
      height: 192px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 13px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    .vinyl-disc.has-img {
      border: none;
      background-color: transparent;
    }
    .vinyl-disc.has-img::before,
    .vinyl-disc.has-img::after,
    .vinyl-disc.has-img .sliding-text {
      display: none;
    }

    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.55);
    }

    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange);
    }

    .sliding-text {
      font-size: 0.65rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(40px);
    }

    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(56px);
    }

    .lp-slot.active.on-player .vinyl-disc {
      transform: translateY(21px);
      pointer-events: auto !important;
      cursor: pointer;
    }
    .lp-slot.active.spinning .vinyl-disc {
      animation: spinVinyl 4s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: translateY(21px) rotate(0deg); }
      to   { transform: translateY(21px) rotate(360deg); }
    }

    /* =========================================
       LP 플레이어 본체 및 톤암 레이어
       ========================================= */
    .turntable-box {
      position: absolute;
      top: 20px;
      left: 50%;
      margin-left: -116px;
      width: 232px;
      height: 232px;
      border: 1.5px solid var(--line-blue);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .turntable-box.has-img {
      border: none;
      background-color: transparent;
    }

    .turntable-box.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .tonearm-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      margin-left: -116px;
      width: 232px;
      height: 232px;
      z-index: 35;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .tonearm-overlay.visible {
      opacity: 1;
    }

    .turntable-spindle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }

    .tonearm-base {
      position: absolute;
      bottom: 18px;
      left: 16px;
      width: 14px;
      height: 22px;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }

    .tonearm-stick {
      position: absolute;
      bottom: 34px;
      left: 22px;
      width: 1.5px;
      height: 142px;
      background: var(--line-blue);
      transform-origin: bottom center;
      transform: rotate(8deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tonearm-stick::after {
      content: "";
      position: absolute;
      top: -4px;
      left: -3.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }

    .tonearm-custom-img {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 20px;
      width: 58px;
      height: 138px;
      object-fit: contain;
      transform-origin: 46% 90%;
      transform: rotate(0deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tonearm-overlay.has-img .turntable-spindle,
    .tonearm-overlay.has-img .turntable-base,
    .tonearm-overlay.has-img .tonearm-stick {
      display: none;
    }
    .tonearm-overlay.has-img .tonearm-custom-img {
      display: block;
    }

    .tonearm-overlay.playing .tonearm-stick {
      transform: rotate(38deg);
    }
    .tonearm-overlay.playing .tonearm-custom-img {
      transform: rotate(22deg);
    }

    /* =========================================
       우측 뮤직 컨트롤 카드 드로어
       ========================================= */
    .track-drawer {
      position: relative;
      z-index: 15;
      width: 0;
      opacity: 0;
      overflow: hidden;
      margin-left: 0;
      transform: translateX(-16px);
      pointer-events: none;
      transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  margin-left 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.5s ease 0.1s,
                  transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .showcase-row.is-open .track-drawer {
      width: 290px;
      margin-left: -12px;
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .player-control-card {
      width: 280px;
      height: 145px;
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
      padding: 22px 24px 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      margin-top: 20px;
      transition: height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .player-control-card.expanded {
      height: 232px;
    }

    .ctrl-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .ctrl-meta {
      overflow: hidden;
    }

    .ctrl-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .ctrl-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      letter-spacing: 0.04em;
    }

    .ctrl-list-toggle {
      background: none;
      border: none;
      color: #b0b0b0;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 4px;
      transition: color 0.2s, transform 0.3s ease;
    }
    .ctrl-list-toggle:hover, .ctrl-list-toggle.active {
      color: var(--text-main);
    }
    .ctrl-list-toggle.active {
      transform: rotate(90deg);
    }

    .ctrl-progress-wrap {
      width: 100%;
      height: 4px;
      background: #e6e8ec;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .ctrl-progress-fill {
      width: 32%;
      height: 100%;
      background: #C6D5FF;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .ctrl-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
    }

    .ctrl-btn {
      background: none;
      border: 1.5px solid transparent;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #111111;
      transition: 0.2s;
    }

    .ctrl-btn:hover {
      background: #f5f6f8;
    }

    .ctrl-btn.next-ring {
      border-color: #c8ccd4;
    }

    .ctrl-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .mini-track-popover {
      max-height: 0;
      opacity: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-top: 1px solid transparent;
      padding-top: 0;
      transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.3s ease,
                  padding 0.3s ease,
                  border-color 0.3s ease;
    }
    .mini-track-popover.open {
      max-height: 90px;
      opacity: 1;
      border-top-color: #f0f0f0;
      padding-top: 6px;
    }
    .mini-track-row {
      font-size: 0.82rem;
      color: var(--text-sub);
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-track-row:hover, .mini-track-row.active {
      background: #f4f7ff;
      color: var(--line-blue);
      font-weight: 500;
    }

    /* =========================================
       [하단 영역] IMAGE & COMMENT & THREADS
       ========================================= */
    .detail-drawer {
      width: 100%;
      max-width: 546px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transform: translateY(-14px);
      transition: max-height 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s ease,
                  margin-top 0.55s ease,
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .detail-drawer.open {
      max-height: 5000px;
      opacity: 1;
      margin-top: 24px;
      transform: translateY(0);
    }

    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-top: 4px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .image-frame {
      width: 100%;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    .comment-section {
      width: 100%;
    }
    .comment-label {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-size: 1.02rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    .threads-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
      border-top: 1px dashed #e0e0e0;
      padding-top: 24px;
    }

    .thread-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thread-date {
      font-size: 0.78rem;
      color: var(--text-sub);
      letter-spacing: 0.06em;
    }

    .thread-body {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-main);
      word-break: keep-all;
    }
    .thread-body p { margin-bottom: 1em; }
    .thread-body img { max-width: 100%; margin: 10px 0; }

    /* =========================================
       전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달 UI
       ========================================= */
    .writer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .writer-overlay.open {
      display: flex;
    }
    .writer-box {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1.5px solid var(--line-blue);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .writer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    .writer-header h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .writer-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-sub);
    }

    .admin-tabs {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      gap: 8px;
    }
    .admin-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 4px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .admin-tab.active {
      color: var(--text-main);
      font-weight: 600;
      border-bottom-color: var(--line-blue);
    }

    .writer-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .writer-field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
    }
    .writer-input, .writer-textarea {
      width: 100%;
      border: 1px solid #dcdcdc;
      padding: 10px 12px;
      font-family: 'Gowun Batang', serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .writer-input:focus, .writer-textarea:focus {
      border-color: var(--line-blue);
    }
    .writer-textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }
    .cat-select-row {
      display: flex;
      gap: 8px;
    }
    .cat-option {
      flex: 1;
      padding: 8px;
      text-align: center;
      border: 1px solid #dcdcdc;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-sub);
      font-family: 'Gowun Batang', serif;
    }
    .cat-option.selected {
      border-color: var(--line-orange);
      color: var(--line-orange);
      font-weight: 600;
    }

    .edit-mode-banner {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #f4f7ff;
      border: 1px solid var(--line-blue);
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--line-blue);
    }
    .edit-mode-banner.active {
      display: flex;
    }
    .cancel-edit-btn {
      background: none;
      border: 1px solid var(--line-blue);
      color: var(--line-blue);
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Gowun Batang', serif;
    }

    .existing-asset-note {
      font-size: 0.75rem;
      color: var(--line-blue);
    }

    .manage-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
    }
    .manage-list.active {
      display: flex;
    }
    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e8e8e8;
      padding: 10px 12px;
      gap: 10px;
    }
    .manage-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .manage-item-title {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .manage-item-meta {
      font-size: 0.76rem;
      color: var(--text-sub);
    }
    .manage-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-order {
      padding: 5px 7px;
      font-size: 0.75rem;
      border: 1px solid #dcdcdc;
      background: #fff;
      cursor: pointer;
      color: var(--text-sub);
      font-family: 'Gowun Batang', serif;
    }
    .btn-order:hover:not(:disabled) {

      color: var(--text-main);

    .btn-order:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .btn-edit, .btn-delete {
      padding: 5px 9px;
      font-size: 0.78rem;
      border: 1px solid #dcdcdc;
      background: #fff;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .btn-edit:hover {
      border-color: var(--line-blue);
      color: var(--line-blue);
    }
    .btn-delete:hover {
      border-color: var(--line-orange);

    .writer-form-body {

    @media (max-width: 640px) {

      .turntable-box { transform: scale(0.78); }

      .showcase-row.is-open .track-drawer {
        width: calc(100vw - 195px);
        max-width: 230px;
        margin-left: -10px;
      }

        height: auto;
        padding: 14px 14px 14px 20px;

        margin-top: 15px;

      }

      .ctrl-btn { width: 32px; height: 32px; }
      .detail-drawer { max-width: 100%; }
      .image-frame { min-height: 240px; }
    }
  </style>
</head>
<body>

  <!-- 페이지 전체 우클릭 방지 및 이미지 저장 차단 -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      if (e.target.tagName === 'IMG' || e.target.classList.contains('lp-jacket') || e.target.classList.contains('vinyl-disc')) {
        e.preventDefault();
      }
    });
  </script>

  <div class="page-shell">
    <header class="global-header">
      <h1 id="secretTrigger" title="더블클릭 또는 #write 접속 시 관리창">Love the Loveless</h1>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-label="ALL">ALL</button>
        <button class="filter-btn" data-label="MADE">MADE</button>
        <button class="filter-btn" data-label="LOVE">LOVE</button>
      </div>
    </header>

    <main class="main-container">
      <div class="showcase-row" id="showcaseRow">
        <div class="player-stage">
          <div class="carousel-stage" id="carouselStage" title="스크롤/스와이프로 카드 넘기기 · 클릭하여 재생">
            <div class="stack-track" id="stackTrack"></div>
          </div>

          <div class="turntable-box" id="turntableBox" title="클릭하여 커버 덱으로 돌아가기"></div>

          <div class="tonearm-overlay" id="tonearmOverlay">
            <div class="turntable-spindle"></div>
            <div class="tonearm-base"></div>
            <div class="tonearm-stick"></div>
            <img class="tonearm-custom-img" id="tonearmImg" src="" alt="tonearm" />
          </div>
        </div>

        <aside class="track-drawer" id="trackDrawer">
          <div class="player-control-card" id="playerControlCard">
            <div class="ctrl-top-row">
              <div class="ctrl-meta">
                <div class="ctrl-title" id="ctrlTitle">TRACK TITLE</div>
                <div class="ctrl-sub" id="ctrlSub">MADE · 26.11.18</div>
              </div>
              <button class="ctrl-list-toggle" id="ctrlListToggle" title="전체 트랙 목록">☰</button>
            </div>

            <div class="ctrl-progress-wrap" id="ctrlProgressWrap">
              <div class="ctrl-progress-fill" id="ctrlProgressFill"></div>
            </div>

            <div class="ctrl-buttons">
              <button class="ctrl-btn" id="btnPrevTrack" title="이전 트랙">
                <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnPlayPause" title="재생 / 일시정지">
                <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              <button class="ctrl-btn next-ring" id="btnNextTrack" title="다음 트랙">
                <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
              </button>
            </div>

            <div class="mini-track-popover" id="miniTrackPopover"></div>
          </div>
        </aside>
      </div>

      <section class="detail-drawer" id="detailDrawer">
        <div class="content-stage">
          <div class="fade-section" id="imageSection">
            <div class="image-frame" id="imageFrame">
              <div class="image-placeholder">IMAGE</div>
            </div>
          </div>

          <div class="fade-section comment-section" id="commentSection">
            <div class="comment-label">
              COMMENT <span id="activePostTitle"></span>
            </div>
            <div class="comment-body" id="commentBody"></div>
            <div class="threads-container" id="threadsContainer"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달 -->
  <div class="writer-overlay" id="writerOverlay">
    <div class="writer-box">
      <div class="writer-header">
        <h2>TRACK MANAGER</h2>
        <button class="writer-close" id="closeWriter">✕</button>
      </div>

      <div class="writer-field">
        <label>발행 비밀번호 (GitHub Token)</label>
        <input type="password" class="writer-input" id="ghTokenInput" placeholder="ghp_..." />
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" id="tabWrite">새 트랙 작성</button>
        <button class="admin-tab" id="tabManage">기존 트랙 관리 (순서 / 수정 / 삭제)</button>
      </div>

      <div class="writer-form-body" id="writeFormPanel">
        <div class="edit-mode-banner" id="editModeBanner">
          <span id="editModeText">기존 트랙 수정 중</span>
          <button class="cancel-edit-btn" id="cancelEditBtn">수정 취소</button>
        </div>

        <div class="writer-field">
          <label>카테고리</label>
          <div class="cat-select-row">
            <div class="cat-option selected" data-cat="MADE">MADE</div>
            <div class="cat-option" data-cat="LOVE">LOVE</div>
          </div>
        </div>

        <div class="writer-field">
          <label>트랙 제목 (TITLE)</label>
          <input type="text" class="writer-input" id="postTitleInput" placeholder="제목을 입력하세요" />
        </div>

        <div class="writer-field">
          <label>① LP 커버 이미지 (420×420 권장)</label>
          <span class="existing-asset-note" id="existingCoverNote"></span>
          <input type="file" id="coverFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>② LP 알판 이미지 (384×384 투명 PNG 권장)</label>
          <span class="existing-asset-note" id="existingVinylNote"></span>
          <input type="file" id="vinylFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>③ 본문 IMAGE 첨부</label>
          <span class="existing-asset-note" id="existingBodyImgNote"></span>
          <input type="file" id="bodyImgFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>COMMENT (메인 코멘트 본문)</label>
          <textarea class="writer-textarea" id="postBodyInput" placeholder="첫 번째 코멘트를 작성하세요."></textarea>
        </div>

        <div class="writer-field">
          <label>THREADS (추가 타래글들 - 구분선 `---`로 여러 개 작성 가능)</label>
          <textarea class="writer-textarea" id="postThreadsInput" placeholder="---\n두 번째 타래글 내용...\n---\n세 번째 타래글 내용..."></textarea>
          <div style="display:flex; justify-content:flex-end; margin-top:4px;">
            <label for="threadImgFileInput" style="font-size:0.75rem; color:var(--line-blue); cursor:pointer; text-decoration:underline;">+ 타래글에 이미지 첨부하기</label>
            <input type="file" id="threadImgFileInput" accept="image/*" style="display:none;" />
          </div>
        </div>

        <button class="writer-submit" id="publishBtn">발행하기 (PUBLISH)</button>
      </div>

      <div class="manage-list" id="manageListPanel"></div>

      <div class="writer-status" id="writerStatus"></div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    const CUSTOM_ASSETS = {
      defaultCover: "",
      vinylDisc: "",
      turntable: "./player.png",
      tonearm: "./tonearm.png"
    };

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];
    let selectedCategory = "MADE";

    let isDiscPaused = false;
    let progressTimer = null;
    let progressPercent = 28;

    let editingIssueNumber = null;
    let preservedAssets = { cover: "", vinyl: "", bodyImg: "", order: "", threads: "" };

    function applyCustomPlayerAssets() {
      const turntableBox = document.getElementById('turntableBox');
      const tonearmOverlay = document.getElementById('tonearmOverlay');
      const tonearmImg = document.getElementById('tonearmImg');

      if (CUSTOM_ASSETS.turntable) {
        turntableBox.style.backgroundImage = `url("${CUSTOM_ASSETS.turntable}")`;
        turntableBox.classList.add('has-img');
      }
      if (CUSTOM_ASSETS.tonearm) {
        tonearmImg.src = CUSTOM_ASSETS.tonearm;
        tonearmOverlay.classList.add('has-img');
      }
    }

    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    function extractMetaUrl(bodyText, key, fallback) {
      if (!bodyText) return fallback;
      const regex = new RegExp(`^${key}:\\s*(.+)$`, 'im');
      const match = bodyText.match(regex);
      return match ? match[1].trim() : fallback;
    }

    function matchesCategory(post, label) {
      if (label === 'ALL') return true;
      if (!Array.isArray(post.labels)) return false;
      return post.labels.some(l => {
        const name = l.name.trim().toUpperCase();
        if (label === 'LOVE') return name === 'LOVE' || name === 'AND';
        return name === label;
      });
    }

    async function fetchPosts() {
      applyCustomPlayerAssets();
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100&_t=${Date.now()}`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues.sort((a, b) => {
            const orderA = Number(extractMetaUrl(a.body, 'order', '9999'));
            const orderB = Number(extractMetaUrl(b.body, 'order', '9999'));
            if (orderA !== orderB) return orderA - orderB;
            return new Date(b.created_at) - new Date(a.created_at);
          });
        } else {
          allPosts = [
            { number: 0, title: "SAMPLE 01", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "상단 Love the Loveless 제목을 더블클릭(또는 주소 뒤에 #write 입력)하면 글쓰기·순서변경·수정·삭제 창이 열립니다." }
          ];
        }

        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.label?.trim().toUpperCase() || 'ALL';
        filteredPosts = allPosts.filter(p => matchesCategory(p, activeFilter));

        bindFilterButtons();
        rebuildAll();
        renderManageList();

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            updateCarouselPositions();
          });
        }
        setTimeout(() => { updateCarouselPositions(); }, 50);
        setTimeout(() => { updateCarouselPositions(); }, 300);
      } catch (err) {
        console.error(err);
      }
    }

    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label.trim().toUpperCase();
          filteredPosts = allPosts.filter(p => matchesCategory(p, label));
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      resetPlayerAnimation();
      buildStackDOM();
      renderTrackList();
      updateCarouselPositions();
    }

    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
