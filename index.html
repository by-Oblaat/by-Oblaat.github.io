<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVES</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================
       [상단 헤더] 페이지 전체 너비 기준 정중앙 정렬
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 44px 20px 24px;
      position: relative;
      z-index: 40;
    }
    .global-header h1 {
      font-weight: 300;
      font-size: 2.35rem;
      letter-spacing: 0.2em;
      margin-bottom: 14px;
      color: var(--text-main);
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       전체 2단 분할 본문 레이아웃
       ========================================= */
    .layout-wrapper {
      display: grid;
      grid-template-columns: 460px 1fr;
      max-width: 1320px;
      margin: 0 auto;
      padding-top: 12px;
    }

    /* =========================================
       [왼쪽 패널] 양옆 3D 카드형 LP 커버 + 하단 LP 플레이어
       ========================================= */
    .left-pane {
      position: sticky;
      top: 24px;
      height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 24px 32px;
      user-select: none;
    }

    /* 상단 양옆 카드형 LP 커버 스테이지 */
    .carousel-stage {
      position: relative;
      width: 100%;
      height: 290px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 1100px;
      touch-action: none;
      z-index: 20;
    }

    .stack-track {
      position: relative;
      width: 224px;
      height: 224px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 224px;
      height: 224px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    /* 정사각형 LP 커버 (LP가 플레이어에 올라가면 상단으로 이동) */
    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 26px 18px;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease, box-shadow 0.4s ease;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    /* ★ LP가 플레이어 위에 올라갈 때 모든 커버들이 상단으로 올라가는 애니메이션 ★ */
    .carousel-stage.deck-up .lp-jacket {
      transform: translateY(-210px);
      opacity: 0;
      pointer-events: none;
    }

    .lp-card-label {
      font-size: 0.75rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.06rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.72rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    /* 원형 LP판 */
    .vinyl-disc {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 204px;
      height: 204px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background: #ffffff;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    /* LP 중앙 라벨 원 */
    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.55);
    }

    /* LP 소리골 & 회전 각도 확인 마커 */
    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange);
    }

    .sliding-text {
      font-size: 0.62rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    /* 대기 상태: LP판이 커버 하단으로 42px 돌출 */
    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(42px);
    }

    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(58px);
    }

    /* [1단계 & 3단계] LP가 슬라이딩되어 올라간 플레이어 정중앙 위치(translateY(140px))에 안착 */
    .lp-slot.active.on-player .vinyl-disc {
      transform: translateY(140px);
    }
    .lp-slot.active.spinning .vinyl-disc {
      animation: spinVinyl 4s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: translateY(140px) rotate(0deg); }
      to   { transform: translateY(140px) rotate(360deg); }
    }

    /* =========================================
       [2단계] 하단 LP 플레이어 (커버가 올라가면서 플레이어가 중앙으로 상승)
       ========================================= */
    .turntable-box {
      position: relative;
      width: 244px;
      height: 244px;
      margin-top: 20px;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.65s ease, transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    /* 커버가 위로 올라갈 때 플레이어는 위쪽 중앙(-170px)으로 부드럽게 자리 잡음 */
    .turntable-box.visible {
      opacity: 1;
      transform: translateY(-170px);
      pointer-events: auto;
    }

    /* 턴테이블 중앙 스핀들 축 */
    .turntable-spindle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #fff;
      z-index: 30;
    }

    /* 턴테이블 좌측 하단 톤암 */
    .tonearm-base {
      position: absolute;
      bottom: 20px;
      left: 16px;
      width: 14px;
      height: 22px;
      border: 1.5px solid var(--line-blue);
      background: #fff;
      z-index: 30;
    }

    .tonearm-stick {
      position: absolute;
      bottom: 36px;
      left: 22px;
      width: 1.5px;
      height: 142px;
      background: var(--line-blue);
      transform-origin: bottom center;
      transform: rotate(10deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 30;
    }

    .tonearm-stick::after {
      content: "";
      position: absolute;
      top: -4px;
      left: -3.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #fff;
    }

    .turntable-box.playing .tonearm-stick {
      transform: rotate(31deg);
    }

    /* =========================================
       [오른쪽 패널] TRACK + IMAGE + COMMENT
       ========================================= */
    .right-pane {
      padding: 12px 56px 120px 24px;
      display: flex;
      flex-direction: column;
    }

    .track-section {
      margin-bottom: 36px;
      max-width: 520px;
    }
    .track-box-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    .track-scroll-wrapper {
      position: relative;
      height: 168px;
    }
    .track-list {
      list-style: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 2px;
      padding-bottom: 60px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .track-list::-webkit-scrollbar {
      display: none;
    }

    .track-fade-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.85) 60%,
        #ffffff 100%
      );
      pointer-events: none;
    }

    .track-item {
      font-size: 0.88rem;
      line-height: 1.7;
      padding: 2px 0;
      color: var(--text-sub);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .track-item:hover, .track-item.active {
      color: var(--line-orange);
      font-weight: 500;
      transform: translateX(4px);
    }

    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .image-frame {
      width: 100%;
      max-width: 520px;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    .comment-section {
      max-width: 620px;
    }
    .comment-label {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.98rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    @media (max-width: 920px) {
      .layout-wrapper {
        grid-template-columns: 1fr;
      }
      .left-pane {
        position: relative;
        top: 0;
        height: 420px;
        padding: 16px;
      }
      .right-pane {
        padding: 24px 24px 80px;
      }
    }
  </style>
</head>
<body>

  <header class="global-header">
    <h1>ARCHIVES</h1>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-label="ALL">ALL</button>
      <button class="filter-btn" data-label="MADE">MADE</button>
      <button class="filter-btn" data-label="AND">AND</button>
    </div>
  </header>

  <div class="layout-wrapper">
    <!-- [왼쪽] 양옆 3D 카드형 LP 커버 + 하단 LP 플레이어 -->
    <aside class="left-pane">
      <div class="carousel-stage" id="carouselStage" title="스크롤/스와이프로 카드 넘기기 · 클릭하여 재생">
        <div class="stack-track" id="stackTrack"></div>
      </div>

      <div class="turntable-box" id="turntableBox" title="클릭하여 커버 덱으로 돌아가기">
        <div class="turntable-spindle"></div>
        <div class="tonearm-base"></div>
        <div class="tonearm-stick"></div>
      </div>
    </aside>

    <!-- [오른쪽] TRACK + IMAGE + COMMENT -->
    <main class="right-pane">
      <section class="track-section">
        <div class="track-box-title">TRACK</div>
        <div class="track-scroll-wrapper">
          <ul class="track-list" id="trackList"></ul>
          <div class="track-fade-overlay"></div>
        </div>
      </section>

      <section class="content-stage">
        <div class="fade-section" id="imageSection">
          <div class="image-frame" id="imageFrame">
            <div class="image-placeholder">IMAGE</div>
          </div>
        </div>

        <div class="fade-section comment-section" id="commentSection">
          <div class="comment-label">
            COMMENT <span id="activePostTitle"></span>
          </div>
          <div class="comment-body" id="commentBody"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];

    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    async function fetchPosts() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues;
        } else {
          allPosts = [
            { number: 1, title: "SAMPLE 01", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "중앙 LP 커버나 LP판을 클릭하면 ① LP가 빠져나와 플레이어 위로 올라가고 ② LP 커버들이 상단으로 올라가며 ③ 플레이어 위에서 LP가 회전합니다.\n\n재생 중인 플레이어를 다시 클릭하거나 오른쪽 TRACK에서 다른 글을 고르면 커버가 다시 내려옵니다." },
            { number: 2, title: "SAMPLE 02", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "두 번째 트랙입니다." },
            { number: 3, title: "SAMPLE 03", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "세 번째 트랙 코멘트입니다." },
            { number: 4, title: "SAMPLE 04", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "네 번째 트랙 코멘트입니다." },
            { number: 5, title: "SAMPLE 05", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "다섯 번째 트랙 코멘트입니다." },
            { number: 6, title: "SAMPLE 06", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "여섯 번째 트랙 코멘트입니다." }
          ];
        }
        filteredPosts = [...allPosts];
        bindFilterButtons();
        rebuildAll();
      } catch (err) {
        console.error(err);
      }
    }

    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label;
          if (label === 'ALL') {
            filteredPosts = [...allPosts];
          } else {
            filteredPosts = allPosts.filter(p => p.labels.some(l => l.name.toUpperCase() === label));
          }
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      resetPlayerAnimation();
      buildStackDOM();
      renderTrackList();
      updateActiveState();
    }

    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
        const date = formatYYMMDD(post.created_at);

        slot.innerHTML = `
          <div class="lp-jacket">
            <div class="lp-card-label">${labelName}</div>
            <div class="lp-card-title">${post.title}</div>
            <div class="lp-card-date">${date}</div>
          </div>
          <div class="vinyl-disc">
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (idx === currentIndex) {
            if (isPlaying) {
              resetPlayerAnimation();
            } else {
              startPlayerSequence(slot);
            }
          } else {
            currentIndex = idx;
            updateActiveState();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
    }

    // 3단계 순차 애니메이션 + LP 커버 상단 상승 연출
    function startPlayerSequence(slot) {
      resetPlayerAnimation();
      isPlaying = true;

      const turntable = document.getElementById('turntableBox');
      const stage = document.getElementById('carouselStage');

      // ① LP가 커버에서 슬라이딩되어 나옴
      slot.classList.add('on-player');

      // ② LP 플레이어 Fade-in 등장 & 커버 덱 상단으로 상승
      const t1 = setTimeout(() => {
        turntable.classList.add('visible');
        stage.classList.add('deck-up');
      }, 240);

      // ③ 플레이어 위에 LP 안착 + 톤암 이동 + 회전 시작
      const t2 = setTimeout(() => {
        turntable.classList.add('playing');
        slot.classList.add('spinning');
      }, 820);

      playTimers.push(t1, t2);
    }

    function resetPlayerAnimation() {
      playTimers.forEach(t => clearTimeout(t));
      playTimers = [];
      isPlaying = false;

      const turntable = document.getElementById('turntableBox');
      const stage = document.getElementById('carouselStage');

      turntable.classList.remove('visible', 'playing');
      stage.classList.remove('deck-up');

      slotElements.forEach(s => {
        s.classList.remove('on-player', 'spinning');
      });
    }

    // 재생 중인 턴테이블을 클릭해도 커버 덱이 다시 내려오며 초기화
    document.getElementById('turntableBox').onclick = () => {
      if (isPlaying) resetPlayerAnimation();
    };

    function renderTrackList() {
      const trackList = document.getElementById('trackList');
      if (filteredPosts.length === 0) {
        trackList.innerHTML = `<li class="track-item">등록된 트랙이 없습니다.</li>`;
        return;
      }
      trackList.innerHTML = filteredPosts.map((post, idx) => `
        <li class="track-item ${idx === currentIndex ? 'active' : ''}" data-idx="${idx}">
          - ${idx + 1}. ${post.title}
        </li>
      `).join('');

      trackList.querySelectorAll('.track-item').forEach(item => {
        item.onclick = () => {
          currentIndex = Number(item.dataset.idx);
          updateActiveState();
        };
      });
    }

    function updateActiveState() {
      resetPlayerAnimation();

      const trackItems = document.querySelectorAll('.track-item');
      trackItems.forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
        if (i === currentIndex) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `translateX(0px) translateZ(0px) rotateY(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else {
          slot.classList.remove('active');
          const sign = offset > 0 ? 1 : -1;
          const abs = Math.abs(offset);
          const translateX = sign * (86 + abs * 34);
          const translateZ = -65 - abs * 45;
          const rotateY = -sign * 46;

          slot.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 25 - abs);
          slot.style.opacity = abs > 3 ? 0 : Math.max(0.32, 1 - abs * 0.22);
          slot.style.pointerEvents = abs > 3 ? 'none' : 'auto';
        }
      });

      const post = filteredPosts[currentIndex];
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      if (!post) {
        document.getElementById('imageFrame').innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        document.getElementById('activePostTitle').textContent = '';
        document.getElementById('commentBody').innerHTML = '';
        return;
      }

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');

      setTimeout(() => {
        const rawBody = post.body || '';
        const mdImgMatch = rawBody.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = rawBody.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = rawBody;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        document.getElementById('activePostTitle').textContent = `— ${post.title}`;
        marked.setOptions({ breaks: true });
        document.getElementById('commentBody').innerHTML = marked.parse(textOnlyBody || '(작성된 코멘트가 없습니다.)');

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 140);
    }

    function stepTrack(direction) {
      if (isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        updateActiveState();
        setTimeout(() => { isScrolling = false; }, 320);
      }
    }

    const carouselStage = document.getElementById('carouselStage');

    carouselStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 10) return;
      stepTrack(delta > 0 ? 1 : -1);
    }, { passive: false });

    let touchStartX = 0;
    carouselStage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    carouselStage.addEventListener('touchend', (e) => {
      const diffX = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 30) {
        stepTrack(diffX > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') stepTrack(-1);
      if (e.key === 'ArrowRight') stepTrack(1);
    });

    fetchPosts();
  </script>
</body>
</html>
