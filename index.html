<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ARCHIVES</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
    }

    .page-shell {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* =========================================
       [상단 헤더]
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 50;
    }
    .global-header h1 {
      font-weight: 300;
      font-size: 2.3rem;
      letter-spacing: 0.2em;
      margin-bottom: 14px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       메인 컨테이너
       ========================================= */
    .main-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .showcase-row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 290px;
      position: relative;
    }

    .player-stage {
      position: relative;
      width: 240px;
      height: 275px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* =========================================
       커버플로우(Cover Flow) 3D 스테이지
       ========================================= */
    .carousel-stage {
      position: absolute;
      top: 10px;
      left: 50%;
      margin-left: -260px;
      width: 520px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 750px;
      touch-action: none;
      z-index: 20;
    }

    .carousel-stage.deck-up,
    .carousel-stage.deck-up .lp-slot {
      pointer-events: none !important;
    }

    .stack-track {
      position: relative;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease, box-shadow 0.4s ease;
    }

    .lp-jacket.has-img {
      border: none;
    }
    .lp-jacket.has-img .lp-card-label,
    .lp-jacket.has-img .lp-card-title,
    .lp-jacket.has-img .lp-card-date {
      display: none;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    .carousel-stage.deck-up .lp-jacket {
      transform: translateY(-190px);
      opacity: 0;
      pointer-events: none;
    }

    .lp-card-label {
      font-size: 0.74rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.04rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

      position: absolute;
      top: 9px;
      left: 9px;
      width: 192px;
      height: 192
