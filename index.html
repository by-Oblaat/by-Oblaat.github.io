<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVES</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 전체 2단 분할 레이아웃 (중앙 점선 제거) */
    .layout-wrapper {
      display: grid;
      grid-template-columns: 440px 1fr;
      min-height: 100vh;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* =========================================
       [왼쪽 패널] 위·아래 양방향 3D LP 스택 + 우측 슬라이딩 LP
       ========================================= */
    .left-pane {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      user-select: none;
      touch-action: none; /* 터치 스와이프 전용 */
    }

    .vertical-stage {
      position: relative;
      width: 340px;
      height: 460px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-left: 16px;
      perspective: 1100px;
    }

    .stack-track {
      position: relative;
      width: 240px;
      height: 240px;
      transform-style: preserve-3d;
    }

    /* 개별 LP 슬롯 (커버 + 우측 LP판) */
    .lp-slot {
      position: absolute;
      inset: 0;
      width: 240px;
      height: 240px;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
      cursor: pointer;
    }

    /* 정사각형 LP 커버 */
    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1.5px solid var(--line-blue);
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: box-shadow 0.4s ease;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 12px 30px rgba(107, 158, 255, 0.14);
    }

    /* 정방향 세로쓰기 (VERTICAL) */
    .jacket-vertical-inner {
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      text-align: center;
    }

    .lp-card-label {
      font-size: 0.68rem;
      color: var(--line-blue);
      border: 1px solid var(--line-blue);
      padding: 4px 3px;
      letter-spacing: 0.08em;
    }

    .lp-card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      max-height: 185px;
      overflow: hidden;
      letter-spacing: 0.04em;
    }

    .lp-card-date {
      font-size: 0.68rem;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    /* 커버 안쪽에서 오른쪽으로 슬라이드되는 원형 LP판 (점선 제거) */
    .vinyl-disc {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 216px;
      height: 216px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background: #ffffff;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 16px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    /* LP 중앙 라벨 실선 원 */
    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 64px;
      margin: -32px 0 0 -32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.45);
    }

    /* LP 소리골 보조 원 */
    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.16);
    }

    /* 활성화된 중앙 LP판 우측 슬라이드 */
    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(78px);
    }

    .lp-slot.active:hover .vinyl-disc,
    .lp-slot.active.sliding-out .vinyl-disc {
      transform: translateX(108px);
    }

    /* 세로쓰기 SLIDING 문구 */
    .sliding-text {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 0.66rem;
      color: var(--line-orange);
      letter-spacing: 0.15em;
      font-weight: 500;
    }

    /* =========================================
       [오른쪽 패널] ARCHIVES + TRACK(그라데이션/블러) + IMAGE(NO LINE) + COMMENT
       ========================================= */
    .right-pane {
      padding: 48px 56px 120px;
      display: flex;
      flex-direction: column;
    }

    .right-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .right-header h1 {
      font-weight: 300;
      font-size: 2.3rem;
      letter-spacing: 0.18em;
      margin-bottom: 14px;
    }

    /* 카테고리 버튼 (ALL / MADE / AND) */
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* TRACK 세로 스크롤 + 하단 흰색 그라데이션 & 블러 페이드 */
    .track-section {
      margin-bottom: 36px;
      max-width: 520px;
    }
    .track-box-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    .track-scroll-wrapper {
      position: relative;
      height: 132px;
    }
    .track-list {
      list-style: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden; /* 가로 스크롤 완전 차단 */
      padding-right: 8px;
      padding-bottom: 42px; /* 하단 그라데이션 영역 여백 */
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    /* 깔끔한 얇은 세로 스크롤바 */
    .track-list::-webkit-scrollbar { width: 3px; }
    .track-list::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 99px; }

    /* 하단 흰색 그라데이션 + 블러 오버레이 */
    .track-fade-overlay {
      position: absolute;
      left: 0;
      right: 6px;
      bottom: 0;
      height: 48px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.88) 65%, #ffffff 100%);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      pointer-events: none;
    }

    .track-item {
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s, filter 0.3s;
      padding: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item:hover, .track-item.active {
      color: var(--line-orange);
      font-weight: 500;
      transform: translateX(4px);
    }

    /* 본문 컨테이너 */
    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* IMAGE 프레임 (테두리 선 제거 - NO LINE) */
    .image-frame {
      width: 100%;
      max-width: 520px;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    /* COMMENT (본문) 영역 */
    .comment-section {
      max-width: 620px;
    }
    .comment-label {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.98rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    /* 모바일 및 태블릿 반응형 */
    @media (max-width: 920px) {
      .layout-wrapper {
        grid-template-columns: 1fr;
      }
      .left-pane {
        position: relative;
        height: 460px;
        padding: 24px 16px;
      }
      .right-pane {
        padding: 24px 24px 80px;
      }
    }
  </style>
</head>
<body>

  <div class="layout-wrapper">
    <!-- [왼쪽] 스크롤 & 터치로 위아래 양방향 회전하는 LP 스택 -->
    <aside class="left-pane" id="leftPane" title="마우스 휠 스크롤 또는 터치 스와이프로 LP를 넘길 수 있습니다">
      <div class="vertical-stage">
        <div class="stack-track" id="stackTrack"></div>
      </div>
    </aside>

    <!-- [오른쪽] ARCHIVES + TRACK + IMAGE + COMMENT -->
    <main class="right-pane">
      <header class="right-header">
        <h1>ARCHIVES</h1>
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" data-label="ALL">ALL</button>
          <button class="filter-btn" data-label="MADE">MADE</button>
          <button class="filter-btn" data-label="AND">AND</button>
        </div>
      </header>

      <section class="track-section">
        <div class="track-box-title">TRACK</div>
        <div class="track-scroll-wrapper">
          <ul class="track-list" id="trackList"></ul>
          <div class="track-fade-overlay"></div>
        </div>
      </section>

      <section class="content-stage" id="contentStage">
        <div class="fade-section" id="imageSection">
          <div class="image-frame" id="imageFrame">
            <div class="image-placeholder">IMAGE</div>
          </div>
        </div>

        <div class="fade-section comment-section" id="commentSection">
          <div class="comment-label">
            COMMENT <span id="activePostTitle"></span>
          </div>
          <div class="comment-body" id="commentBody"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;

    // 1. 깃허브 이슈 불러오기
    async function fetchPosts() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues;
        } else {
          // 레이아웃 확인용 샘플 데이터 (MADE / AND 라벨 적용)
          allPosts = [
            { number: 1, title: "LP 커버 01 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "왼쪽 LP 영역에서 마우스 휠을 위아래로 굴리거나 터치로 밀면 위·아래 스택의 LP판이 부드럽게 회전합니다.\n\n깃허브 `Issues`에 `MADE` 또는 `AND` 라벨을 달아 글을 올리면 자동으로 분류됩니다." },
            { number: 2, title: "LP 커버 02 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "두 번째 트랙입니다. LP 커버와 우측 슬라이딩 원판의 텍스트가 세로쓰기(VERTICAL)로 정렬되어 있습니다." },
            { number: 3, title: "LP 커버 03 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "세 번째 트랙의 코멘트입니다. 위로 지나간 LP들도 하단 스택에 겹쳐져 보입니다." },
            { number: 4, title: "LP 커버 04 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "네 번째 트랙입니다." },
            { number: 5, title: "LP 커버 05 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "다섯 번째 트랙입니다." },
            { number: 6, title: "LP 커버 06 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "여섯 번째 트랙입니다." }
          ];
        }
        filteredPosts = [...allPosts];
        bindFilterButtons();
        rebuildAll();
      } catch (err) {
        console.error(err);
      }
    }

    // 2. ALL / MADE / AND 필터 연결
    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label;
          if (label === 'ALL') {
            filteredPosts = [...allPosts];
          } else {
            filteredPosts = allPosts.filter(p => p.labels.some(l => l.name.toUpperCase() === label));
          }
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      buildStackDOM();
      renderTrackList();
      updateActiveState();
    }

    // 3. 왼쪽 LP 스택 DOM 생성
    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name : 'ARCHIVE';
        const date = new Date(post.created_at).toLocaleDateString('ko-KR');

        slot.innerHTML = `
          <div class="lp-jacket">
            <div class="jacket-vertical-inner">
              <span class="lp-card-label">${labelName}</span>
              <div class="lp-card-title">${post.title}</div>
              <div class="lp-card-date">${date}</div>
            </div>
          </div>
          <div class="vinyl-disc">
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (idx === currentIndex) {
            slot.classList.toggle('sliding-out');
          } else {
            currentIndex = idx;
            updateActiveState();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
    }

    // 4. 오른쪽 TRACK 목록 렌더링
    function renderTrackList() {
      const trackList = document.getElementById('trackList');
      if (filteredPosts.length === 0) {
        trackList.innerHTML = `<li class="track-item">등록된 트랙이 없습니다.</li>`;
        return;
      }
      trackList.innerHTML = filteredPosts.map((post, idx) => `
        <li class="track-item ${idx === currentIndex ? 'active' : ''}" data-idx="${idx}">
          - ${idx + 1}. ${post.title}
        </li>
      `).join('');

      trackList.querySelectorAll('.track-item').forEach(item => {
        item.onclick = () => {
          currentIndex = Number(item.dataset.idx);
          updateActiveState();
        };
      });
    }

    // 5. 위·아래 양방향 LP 스택 애니메이션 갱신 + 본문 업데이트
    function updateActiveState() {
      // 트랙 활성 강조 및 부드러운 스크롤 추적
      const trackItems = document.querySelectorAll('.track-item');
      trackItems.forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
        if (i === currentIndex) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      // 왼쪽 LP 위·아래 양방향 3D 배치
      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;
        slot.classList.remove('sliding-out');

        if (offset === 0) {
          // 현재 중앙 활성 LP
          slot.classList.add('active');
          slot.style.transform = `translateY(0px) translateZ(0px) rotateX(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else if (offset > 0) {
          // 다음 트랙들 (위쪽으로 겹쳐서 쌓임)
          slot.classList.remove('active');
          const translateY = -offset * 42;
          const translateZ = -offset * 55;
          const rotateX = Math.min(40, offset * 13);
          slot.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${rotateX}deg)`;
          slot.style.zIndex = Math.max(1, 25 - offset);
          slot.style.opacity = offset > 3 ? 0 : Math.max(0.28, 1 - offset * 0.24);
          slot.style.pointerEvents = offset > 3 ? 'none' : 'auto';
        } else {
          // 이전 트랙들 (아래쪽으로 겹쳐서 쌓임 - 스케치 하단 블루 박스 구현)
          slot.classList.remove('active');
          const abs = Math.abs(offset);
          const translateY = abs * 42;
          const translateZ = -abs * 55;
          const rotateX = -Math.min(40, abs * 13);
          slot.style.transform = `translateY(${translateY}px) translateZ(${translateZ}px) rotateX(${rotateX}deg)`;
          slot.style.zIndex = Math.max(1, 25 - abs);
          slot.style.opacity = abs > 2 ? 0 : Math.max(0.28, 1 - abs * 0.3);
          slot.style.pointerEvents = abs > 2 ? 'none' : 'auto';
        }
      });

      // 오른쪽 IMAGE + COMMENT 업데이트
      const post = filteredPosts[currentIndex];
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      if (!post) {
        document.getElementById('imageFrame').innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        document.getElementById('activePostTitle').textContent = '';
        document.getElementById('commentBody').innerHTML = '';
        return;
      }

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');

      setTimeout(() => {
        const rawBody = post.body || '';
        const mdImgMatch = rawBody.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = rawBody.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = rawBody;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        document.getElementById('activePostTitle').textContent = `— ${post.title}`;
        marked.setOptions({ breaks: true });
        document.getElementById('commentBody').innerHTML = marked.parse(textOnlyBody || '(작성된 코멘트가 없습니다.)');

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 150);
    }

    // 6. 왼쪽 LP 영역 전용: 마우스 휠 스크롤 + 터치 스와이프 넘김
    function stepTrack(direction) {
      if (isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        updateActiveState();
        setTimeout(() => { isScrolling = false; }, 320); // 연속 스크롤 튐 방지
      }
    }

    const leftPane = document.getElementById('leftPane');

    // 마우스 휠 이벤트
    leftPane.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (Math.abs(e.deltaY) < 10) return;
      stepTrack(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    // 모바일/태블릿 터치 스와이프 이벤트
    let touchStartY = 0;
    leftPane.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    leftPane.addEventListener('touchend', (e) => {
      const diffY = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(diffY) > 30) {
        stepTrack(diffY > 0 ? 1 : -1);
      }
    }, { passive: true });

    // 키보드 위/아래 화살표 보조
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') stepTrack(-1);
      if (e.key === 'ArrowDown') stepTrack(1);
    });

    fetchPosts();
  </script>
</body>
</html>
