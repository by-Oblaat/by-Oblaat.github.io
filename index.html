        { label: '10pt', value: '10pt' },
        { label: '11pt', value: '11pt' },
        { label: '12pt', value: '12pt' },
        { label: '13pt', value: '13pt' },
        { label: '14pt', value: '14pt' },
        { label: '15pt', value: '15pt' },
        { label: '16pt', value: '16pt' },
        { label: '17pt', value: '17pt' },
        { label: '18pt', value: '18pt' }
      ];

      function serializeSurfaceToMarkdown(surfaceEl) {
        if (!surfaceEl) return '';
        let out = '';
        surfaceEl.childNodes.forEach((node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            out += node.textContent;
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            const tag = node.tagName.toLowerCase();
            if (tag === 'br') {
              out += '\n';
              return;
            }
            const inner = serializeSurfaceToMarkdown(node);
            if (tag === 'b' || tag === 'strong') {
              out += `**${inner}**`;
            } else if (tag === 'i' || tag === 'em') {
              out += `*${inner}*`;
            } else if (tag === 'a') {
              const href = node.getAttribute('href') || '';
              out += href ? `[${inner || href}](${href})` : inner;
            } else if (tag === 'span') {
              const styleAttr = node.getAttribute('style') || '';
              out += styleAttr ? `<span style="${styleAttr}">${inner}</span>` : inner;
            } else if (tag === 'div' || tag === 'p') {
              const prefix = out && !out.endsWith('\n') ? '\n' : '';
              out += `${prefix}${inner}\n`;
            } else {
              out += inner;
            }
          }
        });
        return out.replace(/\n{3,}/g, '\n\n').trim();
      }

      function renderMarkdownIntoSurface(surfaceEl, rawVal) {
        if (!surfaceEl) return;
        const clean = (rawVal || '').trim();
        if (!clean) {
          surfaceEl.innerHTML = '';
          return;
        }
        if (window.marked && typeof window.marked.parse === 'function') {
          surfaceEl.innerHTML = window.marked.parse(clean);
        } else {
          surfaceEl.textContent = clean;
        }
      }

      function applyStyleToSurfaceSelection(surfaceEl, ta, styleProp, styleVal, fallbackText = '선택 텍스트') {
        if (!surfaceEl || !ta) return;
        surfaceEl.focus();
        const sel = window.getSelection();
        let range = null;
        if (sel && sel.rangeCount > 0 && surfaceEl.contains(sel.getRangeAt(0).commonAncestorContainer)) {
          range = sel.getRangeAt(0);
        } else {
          range = document.createRange();
          range.selectNodeContents(surfaceEl);
          range.collapse(false);
        }

        const span = document.createElement('span');
        span.style[styleProp] = styleVal;
        if (styleProp === 'backgroundColor') {
          span.style.padding = '0 3px';
          span.style.borderRadius = '3px';
        }

        if (range.collapsed) {
          span.textContent = fallbackText;
          range.insertNode(span);
          const nextRange = document.createRange();
          nextRange.selectNodeContents(span);
          if (sel) {
            sel.removeAllRanges();
            sel.addRange(nextRange);
          }
        } else {
          const extracted = range.extractContents();
          span.appendChild(extracted);
          range.insertNode(span);
          const nextRange = document.createRange();
          nextRange.selectNodeContents(span);
          if (sel) {
            sel.removeAllRanges();
            sel.addRange(nextRange);
          }
        }
        ta.value = serializeSurfaceToMarkdown(surfaceEl);
      }

      function applySimpleCommandToSurface(surfaceEl, ta, cmdName, fallbackText = '텍스트') {
        if (!surfaceEl || !ta) return;
        surfaceEl.focus();
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && surfaceEl.contains(sel.getRangeAt(0).commonAncestorContainer) && sel.getRangeAt(0).collapsed) {
          const r = sel.getRangeAt(0);
          const el = document.createElement(cmdName === 'bold' ? 'strong' : 'em');
          el.textContent = fallbackText;
          r.insertNode(el);
          const nr = document.createRange();
          nr.selectNodeContents(el);
          sel.removeAllRanges();
          sel.addRange(nr);
        } else {
          document.execCommand(cmdName, false, null);
        }
        ta.value = serializeSurfaceToMarkdown(surfaceEl);
      }

      document.querySelectorAll('.rich-mini-toolbar').forEach((bar) => {
        if (bar.dataset.initialized === '1') return;
        bar.dataset.initialized = '1';
        const targetId = bar.dataset.target;
        const ta = document.getElementById(targetId);
        if (!ta) return;

        // Live styled editor surface right below toolbar so font/color changes show immediately
        let wrapEl = bar.nextElementSibling;
        if (!wrapEl || !wrapEl.classList.contains('rich-editor-wrap')) {
          wrapEl = document.createElement('div');
          wrapEl.className = 'rich-editor-wrap';
          bar.parentNode.insertBefore(wrapEl, bar.nextSibling);
        }

        const surfaceEl = document.createElement('div');
        surfaceEl.className = 'rich-live-surface';
        surfaceEl.contentEditable = 'true';
        surfaceEl.dataset.forTextarea = targetId;
        surfaceEl.dataset.placeholder = ta.getAttribute('placeholder') || '';

        const sourceToggleBtn = document.createElement('button');
        sourceToggleBtn.type = 'button';
        sourceToggleBtn.className = 'rich-source-toggle';
        sourceToggleBtn.textContent = '태그/코드 직접 보기';

        ta.style.display = 'none';
        wrapEl.appendChild(surfaceEl);
        wrapEl.appendChild(sourceToggleBtn);
        wrapEl.appendChild(ta);

        renderMarkdownIntoSurface(surfaceEl, ta.value);

        surfaceEl.addEventListener('input', () => {
          ta.value = serializeSurfaceToMarkdown(surfaceEl);
        });

        ta.addEventListener('input', () => {
          if (ta.style.display !== 'none') {
            renderMarkdownIntoSurface(surfaceEl, ta.value);
          }
        });

        sourceToggleBtn.onclick = (e) => {
          e.stopPropagation();
          const showingSource = ta.style.display !== 'none';
          if (!showingSource) {
            ta.value = serializeSurfaceToMarkdown(surfaceEl);
            ta.style.display = 'block';
            surfaceEl.style.display = 'none';
            sourceToggleBtn.textContent = '서식 화면으로 보기';
            ta.focus();
          } else {
            renderMarkdownIntoSurface(surfaceEl, ta.value);
            ta.style.display = 'none';
            surfaceEl.style.display = 'block';
            sourceToggleBtn.textContent = '태그/코드 직접 보기';
            surfaceEl.focus();
          }
        };

        // Keep surface synced whenever track edit or thread modal opens
        const syncObserver = new MutationObserver(() => {
          if (ta.style.display === 'none') {
            const currentSerialized = serializeSurfaceToMarkdown(surfaceEl);
            if ((ta.value || '').trim() !== currentSerialized) {
              renderMarkdownIntoSurface(surfaceEl, ta.value);
            }
          }
        });
        syncObserver.observe(ta, { attributes: true, attributeFilter: ['value'] });

        // 1. 굵게
        const boldBtn = document.createElement('button');
        boldBtn.type = 'button';
        boldBtn.className = 'rich-tool-btn';
        boldBtn.style.fontWeight = '700';
        boldBtn.textContent = 'B';
        boldBtn.title = '굵게';
        boldBtn.onclick = (e) => {
          e.stopPropagation();
          applySimpleCommandToSurface(surfaceEl, ta, 'bold', '굵은 글씨');
        };

        // 2. 기울임
        const italicBtn = document.createElement('button');
        italicBtn.type = 'button';
        italicBtn.className = 'rich-tool-btn';
        italicBtn.style.fontStyle = 'italic';
        italicBtn.textContent = 'I';
        italicBtn.title = '기울임';
        italicBtn.onclick = (e) => {
          e.stopPropagation();
          applySimpleCommandToSurface(surfaceEl, ta, 'italic', '기울임 글씨');
        };

        // 3. 폰트 선택 (즉시 반영)
        const fontSel = document.createElement('select');
        fontSel.className = 'rich-tool-select';
        fontSel.title = '폰트 선택';
        fontOptions.forEach((opt) => {
          const o = document.createElement('option');
          o.value = opt.value;
          o.textContent = opt.label;
          fontSel.appendChild(o);
        });
        fontSel.onchange = (e) => {
          e.stopPropagation();
          if (!fontSel.value) return;
          applyStyleToSurfaceSelection(surfaceEl, ta, 'fontFamily', fontSel.value, '선택 텍스트');
          fontSel.value = '';
        };

        // 4. 폰트 크기 선택 (즉시 반영)
        const sizeSel = document.createElement('select');
        sizeSel.className = 'rich-tool-select';
        sizeSel.title = '폰트 크기 선택';
        sizeOptions.forEach((opt) => {
          const o = document.createElement('option');
          o.value = opt.value;
          o.textContent = opt.label;
          sizeSel.appendChild(o);
        });
        sizeSel.onchange = (e) => {
          e.stopPropagation();
          if (!sizeSel.value) return;
          applyStyleToSurfaceSelection(surfaceEl, ta, 'fontSize', sizeSel.value, '선택 텍스트');
          sizeSel.value = '';
        };

        // 5. 하이퍼링크
        const linkBtn = document.createElement('button');
        linkBtn.type = 'button';
        linkBtn.className = 'rich-tool-btn';
        linkBtn.textContent = 'LINK';
        linkBtn.title = '하이퍼링크 삽입';
        linkBtn.onclick = (e) => {
          e.stopPropagation();
          const url = prompt('연결할 URL을 입력하세요 (https://...)');
          if (!url || !url.trim()) return;
          const cleanUrl = url.trim();
          surfaceEl.focus();
          const sel = window.getSelection();
          let labelText = '링크 텍스트';
          let range = null;
          if (sel && sel.rangeCount > 0 && surfaceEl.contains(sel.getRangeAt(0).commonAncestorContainer)) {
            range = sel.getRangeAt(0);
            if (!range.collapsed) labelText = range.toString();
          } else {
            range = document.createRange();
            range.selectNodeContents(surfaceEl);
            range.collapse(false);
          }
          const aEl = document.createElement('a');
          aEl.href = cleanUrl;
          aEl.target = '_blank';
          aEl.rel = 'noopener noreferrer';
          aEl.textContent = labelText;
          if (!range.collapsed) range.deleteContents();
          range.insertNode(aEl);
          ta.value = serializeSurfaceToMarkdown(surfaceEl);
        };

        // 6. 폰트 컬러 + 배경 컬러 (즉시 반영)
        const colorGroup = document.createElement('div');
        colorGroup.className = 'rich-color-group';

        const fgPicker = document.createElement('input');
        fgPicker.type = 'color';
        fgPicker.className = 'rich-color-input';
        fgPicker.value = '#1a1a1a';
        fgPicker.title = '글자색 선택';

        const fgBtn = document.createElement('button');
        fgBtn.type = 'button';
        fgBtn.className = 'rich-tool-btn';
        fgBtn.style.padding = '1px 5px';
        fgBtn.style.fontSize = '0.7rem';
        fgBtn.textContent = '글자색';
        fgBtn.onclick = (e) => {
          e.stopPropagation();
          applyStyleToSurfaceSelection(surfaceEl, ta, 'color', fgPicker.value, '색상 글씨');
        };

        const bgPicker = document.createElement('input');
        bgPicker.type = 'color';
        bgPicker.className = 'rich-color-input';
        bgPicker.value = '#eef3ff';
        bgPicker.title = '배경색 선택';

        const bgBtn = document.createElement('button');
        bgBtn.type = 'button';
        bgBtn.className = 'rich-tool-btn';
        bgBtn.style.padding = '1px 5px';
        bgBtn.style.fontSize = '0.7rem';
        bgBtn.textContent = '배경색';
        bgBtn.onclick = (e) => {
          e.stopPropagation();
          applyStyleToSurfaceSelection(surfaceEl, ta, 'backgroundColor', bgPicker.value, '배경 글씨');
        };

        colorGroup.appendChild(fgPicker);
        colorGroup.appendChild(fgBtn);
        colorGroup.appendChild(bgPicker);
        colorGroup.appendChild(bgBtn);

        bar.appendChild(boldBtn);
        bar.appendChild(italicBtn);
        bar.appendChild(fontSel);
        bar.appendChild(sizeSel);
        bar.appendChild(linkBtn);
        bar.appendChild(colorGroup);
      });

      // Sync any programmatic textarea value updates (e.g. startEditTrack, cancelEditMode, submitThreadBtn)
      document.querySelectorAll('.rich-live-surface').forEach((surf) => {
        const tId = surf.dataset.forTextarea;
        const ta = document.getElementById(tId);
        if (ta) renderMarkdownIntoSurface(surf, ta.value);
      });
    }



const plusAudioInput = document.getElementById('plusTrackAudioInput');
    const plusSelectedAudioName = document.getElementById('plusSelectedAudioName');
    const plusAddTrackBtn = document.getElementById('plusAddTrackBtn');

    if (plusAudioInput && plusSelectedAudioName) {
      plusAudioInput.addEventListener('change', () => {
        const f = plusAudioInput.files && plusAudioInput.files[0];
        plusSelectedAudioName.textContent = f ? f.name : '';
      });
    }

    let editingPlusIndex = null;
    const plusCancelEditBtn = document.getElementById('plusCancelEditBtn');
    const plusMoveUpBtn = document.getElementById('plusMoveUpBtn');
    const plusMoveDownBtn = document.getElementById('plusMoveDownBtn');
    const plusDeleteTrackBtn = document.getElementById('plusDeleteTrackBtn');

    function syncPlusEditActionButtons() {
      const hasTarget = editingPlusIndex !== null && plusPlaylistTracks[editingPlusIndex];
      [plusCancelEditBtn, plusMoveUpBtn, plusMoveDownBtn, plusDeleteTrackBtn].forEach(b => {
        if (!b) return;
        b.classList.toggle('active', Boolean(hasTarget));
      });
      if (plusMoveUpBtn) plusMoveUpBtn.disabled = !hasTarget || editingPlusIndex <= 0;
      if (plusMoveDownBtn) plusMoveDownBtn.disabled = !hasTarget || editingPlusIndex >= plusPlaylistTracks.length - 1;
    }

    function resetPlusQuickForm() {
      editingPlusIndex = null;
      const titleInp = document.getElementById('plusTrackTitleInput');
      const ytInp = document.getElementById('plusTrackYtInput');
      if (titleInp) titleInp.value = '';
      if (ytInp) ytInp.value = '';
      if (plusAudioInput) plusAudioInput.value = '';
      if (plusSelectedAudioName) plusSelectedAudioName.textContent = '';
      if (plusAddTrackBtn) plusAddTrackBtn.textContent = '플레이리스트에 추가';
      syncPlusEditActionButtons();
    }

    function startEditPlusTrack(targetIdx) {
      const item = plusPlaylistTracks[targetIdx];
      if (!item) return;
      editingPlusIndex = targetIdx;
      const titleInp = document.getElementById('plusTrackTitleInput');
      const ytInp = document.getElementById('plusTrackYtInput');
      const statusEl = document.getElementById('plusQuickStatus');
      if (titleInp) titleInp.value = item.title || '';
      if (ytInp) ytInp.value = item.yt || '';
      if (plusAudioInput) plusAudioInput.value = '';
      if (plusSelectedAudioName) plusSelectedAudioName.textContent = item.bgm ? '기존 오디오 유지됨' : '';
      if (plusAddTrackBtn) plusAddTrackBtn.textContent = '수정 저장';
      syncPlusEditActionButtons();
      if (statusEl) statusEl.textContent = `수정 중: ${item.title}`;
      if (titleInp) titleInp.focus();
    }

    async function applyPlusOrderChange(delta) {
      if (editingPlusIndex === null || !plusPlaylistTracks[editingPlusIndex]) return;
      const nextIdx = editingPlusIndex + delta;
      if (nextIdx < 0 || nextIdx >= plusPlaylistTracks.length) return;

      const statusEl = document.getElementById('plusQuickStatus');
      const token = (ghTokenInput && ghTokenInput.value.trim()) || localStorage.getItem('oblaat_gh_token') || '';

      const rawExisting = plusPlaylistTracks.map(t => ({
        title: t.title,
        bgm: t.bgm || '',
        yt: t.yt || '',
        created_at: t.created_at || new Date().toISOString()
      }));

      const tmp = rawExisting[editingPlusIndex];
      rawExisting[editingPlusIndex] = rawExisting[nextIdx];
      rawExisting[nextIdx] = tmp;

      localStorage.setItem('oblaat_plus_playlist_cache', JSON.stringify(rawExisting));
      plusPlaylistTracks = rawExisting.map((t, i) => ({
        number: -(i + 1),
        isPlusPlaylist: true,
        title: t.title || `Track ${i + 1}`,
        created_at: t.created_at || new Date().toISOString(),
        labels: [{ name: 'PLUS' }],
        bgm: t.bgm || '',
        yt: t.yt || '',
        body: buildBodyFromPlusTrack(t)
      }));

      editingPlusIndex = nextIdx;
      currentIndex = nextIdx;
      filteredPosts = [...plusPlaylistTracks];
      renderTrackList();
      syncPlusEditActionButtons();

      if (token) {
        try { await savePlusPlaylistToGitHub(rawExisting, token); } catch (e) {}
      }
      if (statusEl) {
        statusEl.textContent = '트랙 순서가 변경되었습니다.';
        setTimeout(() => { if (statusEl) statusEl.textContent = `수정 중: ${plusPlaylistTracks[editingPlusIndex]?.title || ''}`; }, 1200);
      }
    }

    if (plusMoveUpBtn) {
      plusMoveUpBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        applyPlusOrderChange(-1);
      });
    }

    if (plusMoveDownBtn) {
      plusMoveDownBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        applyPlusOrderChange(1);
      });
    }

    if (plusDeleteTrackBtn) {
      plusDeleteTrackBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (editingPlusIndex === null || !plusPlaylistTracks[editingPlusIndex]) return;
        const target = plusPlaylistTracks[editingPlusIndex];
        if (!confirm(`"${target.title}" 트랙을 삭제할까요?`)) return;

        const statusEl = document.getElementById('plusQuickStatus');
        const token = (ghTokenInput && ghTokenInput.value.trim()) || localStorage.getItem('oblaat_gh_token') || '';

        const rawExisting = plusPlaylistTracks
          .filter((_, idx) => idx !== editingPlusIndex)
          .map(t => ({
            title: t.title,
            bgm: t.bgm || '',
            yt: t.yt || '',
            created_at: t.created_at || new Date().toISOString()
          }));

        localStorage.setItem('oblaat_plus_playlist_cache', JSON.stringify(rawExisting));
        plusPlaylistTracks = rawExisting.map((t, i) => ({
          number: -(i + 1),
          isPlusPlaylist: true,
          title: t.title || `Track ${i + 1}`,
          created_at: t.created_at || new Date().toISOString(),
          labels: [{ name: 'PLUS' }],
          bgm: t.bgm || '',
          yt: t.yt || '',
          body: buildBodyFromPlusTrack(t)
        }));

        filteredPosts = [...plusPlaylistTracks];
        currentIndex = Math.max(0, Math.min(currentIndex, filteredPosts.length - 1));
        resetPlusQuickForm();
        renderTrackList();

        const nextPost = filteredPosts[currentIndex];
        if (nextPost) {
          document.getElementById('ctrlTitle').textContent = nextPost.title;
          loadAndPlayTrackAudio(nextPost, true);
        } else {
          document.getElementById('ctrlTitle').textContent = '음악 트랙을 추가해 주세요';
          stopAllAudioPlayback(true);
        }

        if (token) {
          try { await savePlusPlaylistToGitHub(rawExisting, token); } catch (err) {}
        }
        if (statusEl) {
          statusEl.textContent = '트랙이 삭제되었습니다.';
          setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 1600);
        }
      });
    }

    if (plusCancelEditBtn) {
      plusCancelEditBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const statusEl = document.getElementById('plusQuickStatus');
        resetPlusQuickForm();
        if (statusEl) statusEl.textContent = '';
      });
    }

    if (plusAddTrackBtn) {
      plusAddTrackBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const statusEl = document.getElementById('plusQuickStatus');
        const titleInp = document.getElementById('plusTrackTitleInput');
        const ytInp = document.getElementById('plusTrackYtInput');
        const token = (ghTokenInput && ghTokenInput.value.trim()) || localStorage.getItem('oblaat_gh_token') || '';

        const trackTitle = (titleInp && titleInp.value.trim()) || '';
        const ytVal = (ytInp && ytInp.value.trim()) || '';
        const audioFile = (plusAudioInput && plusAudioInput.files && plusAudioInput.files[0]) || null;
        const isEditingPlus = editingPlusIndex !== null && plusPlaylistTracks[editingPlusIndex];
        const existingItem = isEditingPlus ? plusPlaylistTracks[editingPlusIndex] : null;

        if (!trackTitle) {
          if (statusEl) statusEl.textContent = '음악 제목을 입력해 주세요.';
          return;
        }
        if (!audioFile && !ytVal && !(existingItem && existingItem.bgm)) {
          if (statusEl) statusEl.textContent = 'MP3 파일을 선택하거나 유튜브 링크를 입력해 주세요.';
          return;
        }
        plusAddTrackBtn.disabled = true;
        if (statusEl) statusEl.textContent = audioFile ? '오디오 처리 중...' : (isEditingPlus ? '트랙 수정 저장 중...' : '플레이리스트에 추가 중...');

        try {
          let bgmUrl = existingItem ? (existingItem.bgm || '') : '';
          if (audioFile) {
            if (token) {
              try {
                bgmUrl = await uploadImageToGitHub(audioFile, token);
              } catch (upErr) {
                bgmUrl = URL.createObjectURL(audioFile);
              }
            } else {
              bgmUrl = URL.createObjectURL(audioFile);
            }
          }

          const rawExisting = plusPlaylistTracks.map(t => ({
            title: t.title,
            bgm: t.bgm || '',
            yt: t.yt || '',
            created_at: t.created_at || new Date().toISOString()
          }));

          const entryData = {
            title: trackTitle,
            bgm: bgmUrl,
            yt: ytVal,
            created_at: existingItem && existingItem.created_at ? existingItem.created_at : new Date().toISOString()
          };

          if (isEditingPlus) {
            rawExisting[editingPlusIndex] = entryData;
          } else {
            rawExisting.push(entryData);
          }

          localStorage.setItem('oblaat_plus_playlist_cache', JSON.stringify(rawExisting));
          plusPlaylistTracks = rawExisting.map((t, i) => ({
            number: -(i + 1),
            isPlusPlaylist: true,
            title: t.title || `Track ${i + 1}`,
            created_at: t.created_at || new Date().toISOString(),
            labels: [{ name: 'PLUS' }],
            bgm: t.bgm || '',
            yt: t.yt || '',
            body: buildBodyFromPlusTrack(t)
          }));

          let syncedToGitHub = false;
          if (token) {
            try {
              await savePlusPlaylistToGitHub(rawExisting, token);
              syncedToGitHub = true;
            } catch (ghErr) {
              syncedToGitHub = false;
            }
          }

          const targetIdx = isEditingPlus ? editingPlusIndex : Math.max(0, plusPlaylistTracks.length - 1);
          filteredPosts = [...plusPlaylistTracks];
          currentIndex = Math.min(targetIdx, Math.max(0, filteredPosts.length - 1));
          renderTrackList();
          const activeItem = filteredPosts[currentIndex];
          if (activeItem) {
            document.getElementById('ctrlTitle').textContent = activeItem.title;
            loadAndPlayTrackAudio(activeItem, true);
            setDiscPlayState(true);
            startProgressSimulation();
          }

          resetPlusQuickForm();
          if (statusEl) {
            if (isEditingPlus) {
              statusEl.textContent = syncedToGitHub ? '트랙이 수정되었습니다!' : '로컬에서 트랙이 수정되었습니다!';
            } else {
              statusEl.textContent = syncedToGitHub
                ? '플레이리스트에 추가되었습니다!'
                : '로컬 플레이리스트에 추가되었습니다! (GitHub 저장은 토큰 연결 시 동기화됩니다)';
            }
          }
          setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 2200);
        } catch (err) {
          if (statusEl) statusEl.textContent = err.message || '저장 실패';
        } finally {
          plusAddTrackBtn.disabled = false;
        }
      });
    }

    initRichToolbars();
    fetchPosts();
  </script>
</body>
</html>
