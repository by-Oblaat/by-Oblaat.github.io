<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love the Loveless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Gowun Batang', serif;
      min-height: 100vh;
    }

    .page-shell {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* =========================================
       [상단 헤더] Love the Loveless (Monsieur La Doulaise)
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 50;
    }
    .global-header h1 {
      font-family: 'Monsieur La Doulaise', cursive;
      font-weight: 400;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
      font-family: 'Gowun Batang', serif;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       메인 스테이지 및 플레이어 카드 컨테이너
       ========================================= */
    .main-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .showcase-row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 320px;
      position: relative;
    }

    .player-card-box {
      position: relative;
      width: 230px;
      height: 230px;
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      padding: 0;
      overflow: hidden;
      transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  padding 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.5s ease;
    }

    .player-card-box.playing-mode {
      width: 680px;
      padding: 0 40px 0 25px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }

    .player-stage {
      position: relative;
      width: 180px;
      height: 180px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      transition: margin 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .player-card-box.playing-mode .player-stage {
      margin: 0;
    }

    .carousel-stage {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 750px;
      touch-action: none;
      z-index: 25;
      transition: transform 0.6s ease;
    }

    .carousel-stage.deck-up {
      transform: translateY(-8px);
    }

    .stack-track {
      position: relative;
      width: 165px;
      height: 165px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 165px;
      height: 165px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 18px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }

    .lp-jacket.has-img {
      border: none;
    }
    .lp-jacket.has-img .lp-card-label,
    .lp-jacket.has-img .lp-card-title,
    .lp-jacket.has-img .lp-card-date {
      display: none;
    }

    .lp-card-label {
      font-size: 0.7rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.35;
    }

    .lp-card-date {
      font-size: 0.65rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .vinyl-disc {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 153px;
      height: 153px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(0px);
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
    }

    .vinyl-disc.has-img {
      border: none;
      background-color: transparent;
    }
    .vinyl-disc.has-img::before,
    .vinyl-disc.has-img::after,
    .vinyl-disc.has-img .sliding-text {
      display: none;
    }

    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.55);
    }

    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange);
    }

    .sliding-text {
      font-size: 0.55rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    .lp-slot.active.on-player .vinyl-disc {
      opacity: 1;
      transform: translateY(58px);
      pointer-events: auto;
      cursor: pointer;
    }
    .lp-slot.active.spinning .vinyl-disc {
      animation: spinVinyl 4s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: translateY(58px) rotate(0deg); }
      to   { transform: translateY(58px) rotate(360deg); }
    }

    .player-control-right {
      width: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
      transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.5s ease 0.15s,
                  margin-left 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      margin-left: 0;
    }

    .player-card-box.playing-mode .player-control-right {
      width: 380px;
      opacity: 1;
      margin-left: 36px;
    }

    .ctrl-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .ctrl-meta {
      overflow: hidden;
    }

    .ctrl-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .ctrl-sub {
      font-size: 0.82rem;
      color: var(--text-sub);
      letter-spacing: 0.06em;
    }

    .ctrl-list-toggle {
      background: none;
      border: none;
      color: #b0b0b0;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s, transform 0.3s ease;
    }
    .ctrl-list-toggle:hover, .ctrl-list-toggle.active {
      color: var(--text-main);
    }
    .ctrl-list-toggle.active {
      transform: rotate(90deg);
    }

    .ctrl-progress-wrap {
      width: 100%;
      height: 4px;
      background: #e6e8ec;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .ctrl-progress-fill {
      width: 32%;
      height: 100%;
      background: #C6D5FF;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .ctrl-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .ctrl-btn {
      background: none;
      border: 1.5px solid transparent;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #111111;
      transition: 0.2s;
    }

    .ctrl-btn:hover {
      background: #f5f6f8;
    }

    .ctrl-btn.next-ring {
      border-color: #c8ccd4;
    }

    .ctrl-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .mini-track-popover {
      max-height: 0;
      opacity: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: absolute;
      top: 60px;
      left: 215px;
      right: 40px;
      background: #ffffff;
      border-top: 1px solid transparent;
      padding-top: 0;
      z-index: 30;
      transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.3s ease,
                  padding 0.3s ease;
    }
    .mini-track-popover.open {
      max-height: 110px;
      opacity: 1;
      border-top-color: #f0f0f0;
      padding-top: 8px;
    }
    .mini-track-row {
      font-size: 0.85rem;
      color: var(--text-sub);
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-track-row:hover, .mini-track-row.active {
      background: #f4f7ff;
      color: var(--line-blue);
      font-weight: 500;
    }

    /* =========================================
       [하단 영역] IMAGE & COMMENT & THREADS
       ========================================= */
    .detail-drawer {
      width: 100%;
      max-width: 546px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transform: translateY(-14px);
      transition: max-height 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s ease,
                  margin-top 0.55s ease,
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .detail-drawer.open {
      max-height: 5000px;
      opacity: 1;
      margin-top: 40px;
      transform: translateY(0);
    }

    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-top: 4px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .image-frame {
      width: 100%;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    .comment-section {
      width: 100%;
    }
    .comment-label {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-size: 1.02rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    /* 타래(Thread) 스레드 스타일 */
    .threads-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
      border-top: 1px dashed #e0e0e0;
      padding-top: 24px;
    }

    .thread-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thread-date {
      font-size: 0.78rem;
      color: var(--text-sub);
      letter-spacing: 0.06em;
    }

    .thread-body {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-main);
      word-break: keep-all;
    }
    .thread-body p { margin-bottom: 1em; }
    .thread-body img { max-width: 100%; margin: 10px 0; }

    /* =========================================
       전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달 UI
       ========================================= */
    .writer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .writer-overlay.open {
      display: flex;
    }
    .writer-box {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1.5px solid var(--line-blue);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .writer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    .writer-header h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .writer-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-sub);
    }

    .admin-tabs {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      gap: 8px;
    }
    .admin-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 4px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .admin-tab.active {
      color: var(--text-main);
      font-weight: 600;
      border-bottom-color: var(--line-blue);
    }

    .writer-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .writer-field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
    }
    .writer-input, .writer-textarea {
      width: 100%;
      border: 1px solid #dcdcdc;
      padding: 10px 12px;
      font-family: 'Gowun Batang', serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .writer-input:focus, .writer-textarea:focus {
      border-color: var(--line-blue);
    }
    .writer-textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }
    .cat-select-row {
      display: flex;
      gap: 8px;
    }
    .cat-option {
      flex: 1;
      padding: 8px;
      text-align: center;
      border: 1px solid #dcdcdc;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-sub);
      font-family: 'Gowun Batang', serif;
    }
    .cat-option.selected {
      border-color: var(--line-orange);
      color: var(--line-orange);
      font-weight: 600;
    }

    .edit-mode-banner {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #f4f7ff;
      border: 1px solid var(--line-blue);
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--line-blue);
    }
    .edit-mode-banner.active {
      display: flex;
    }
    .cancel-edit-btn {
      background: none;
      border: 1px solid var(--line-blue);
      color: var(--line-blue);
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Gowun Batang', serif;
    }

    .existing-asset-note {
      font-size: 0.75rem;
      color: var(--line-blue);
    }

    .manage-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
    }
    .manage-list.active {
      display: flex;
    }
    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e8e8e8;
      padding: 10px 12px;
      gap: 10px;
    }
    .manage-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .manage-item-title {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .manage-item-meta {
      font-size: 0.76rem;
      color: var(--text-sub);
    }
    .manage-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-order {
      padding: 5px 7px;
      font-size: 0.75rem;
      border: 1px solid #dcdcdc;
      background: #fff;
      cursor: pointer;
      color: var(--text-sub);
      font-family: 'Gowun Batang', serif;
    }
    .btn-order:hover:not(:disabled) {
      border-color: var(--text-main);
      color: var(--text-main);
    }
    .btn-order:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .btn-edit, .btn-delete {
      padding: 5px 9px;
      font-size: 0.78rem;
      border: 1px solid #dcdcdc;
      background: #fff;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .btn-edit:hover {
      border-color: var(--line-blue);
      color: var(--line-blue);
    }
    .btn-delete:hover {
      border-color: var(--line-orange);
      color: var(--line-orange);
    }

    .writer-form-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .writer-form-body.hidden {
      display: none;
    }

    .writer-submit {
      background: var(--text-main);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .writer-submit:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .writer-status {
      font-size: 0.85rem;
      color: var(--line-orange);
      text-align: center;
      min-height: 18px;
    }

    @media (max-width: 720px) {
      .global-header { padding: 32px 16px 16px; }
      .global-header h1 { font-size: 2.15rem; }
      .main-container { padding: 12px 16px 80px; }
      .showcase-row { min-height: auto; }

      .player-card-box {
        width: 230px !important;
        height: 230px !important;
        padding: 0 !important;
        flex-direction: column !important;
      }
      .player-card-box.playing-mode {
        width: 100% !important;
        max-width: 340px !important;
        height: auto !important;
        padding: 24px 20px !important;
        gap: 20px !important;
      }
      .player-control-right {
        width: 100% !important;
        margin-left: 0 !important;
      }
      .mini-track-popover {
        left: 20px !important;
        right: 20px !important;
        top: auto !important;
        bottom: 100% !important;
      }
      .detail-drawer { max-width: 100%; }
      .image-frame { min-height: 240px; }
    }
  </style>
</head>
<body>

  <!-- 페이지 전체 우클릭 방지 -->
  <script>
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>

  <div class="page-shell">
    <header class="global-header">
      <h1 id="secretTrigger" title="더블클릭 또는 #write 접속 시 관리창">Love the Loveless</h1>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-label="ALL">ALL</button>
        <button class="filter-btn" data-label="MADE">MADE</button>
        <button class="filter-btn" data-label="LOVE">LOVE</button>
      </div>
    </header>

    <main class="main-container">
      <div class="showcase-row" id="showcaseRow">
        <div class="player-card-box" id="playerCardBox">
          <!-- 좌측: 3D 커버플로우 및 LP 스테이지 -->
          <div class="player-stage">
            <div class="carousel-stage" id="carouselStage" title="스크롤/스와이프로 카드 넘기기 · 클릭하여 재생">
              <div class="stack-track" id="stackTrack"></div>
            </div>
          </div>

          <!-- 우측: 음악 플레이어 컨트롤 패널 (클릭 시 확장) -->
          <div class="player-control-right">
            <div class="ctrl-top-row">
              <div class="ctrl-meta">
                <div class="ctrl-title" id="ctrlTitle">TRACK TITLE</div>
                <div class="ctrl-sub" id="ctrlSub">MADE · 26.11.18</div>
              </div>
              <button class="ctrl-list-toggle" id="ctrlListToggle" title="전체 트랙 목록">☰</button>
            </div>

            <div class="ctrl-progress-wrap" id="ctrlProgressWrap">
              <div class="ctrl-progress-fill" id="ctrlProgressFill"></div>
            </div>

            <div class="ctrl-buttons">
              <button class="ctrl-btn" id="btnPrevTrack" title="이전 트랙">
                <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
              </button>
              <button class="ctrl-btn" id="btnPlayPause" title="재생 / 일시정지">
                <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              <button class="ctrl-btn next-ring" id="btnNextTrack" title="다음 트랙">
                <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
              </button>
            </div>

            <div class="mini-track-popover" id="miniTrackPopover"></div>

      <section class="detail-drawer" id="detailDrawer">
        <div class="content-stage">
          <div class="fade-section" id="imageSection">
            <div class="image-frame" id="imageFrame">
              <div class="image-placeholder">IMAGE</div>
            </div>
          </div>

          <div class="fade-section comment-section" id="commentSection">
            <div class="comment-label">
              COMMENT <span id="activePostTitle"></span>
            </div>
            <div class="comment-body" id="commentBody"></div>
            <!-- 스레드(타래) 글들이 추가되는 영역 -->
            <div class="threads-container" id="threadsContainer"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달 -->
  <div class="writer-overlay" id="writerOverlay">
    <div class="writer-box">
      <div class="writer-header">
        <h2>TRACK MANAGER</h2>
        <button class="writer-close" id="closeWriter">✕</button>
      </div>

      <div class="writer-field">
        <label>발행 비밀번호 (GitHub Token)</label>
        <input type="password" class="writer-input" id="ghTokenInput" placeholder="ghp_..." />
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" id="tabWrite">새 트랙 작성</button>
        <button class="admin-tab" id="tabManage">기존 트랙 관리 (순서 / 수정 / 삭제)</button>
      </div>

      <div class="writer-form-body" id="writeFormPanel">
        <div class="edit-mode-banner" id="editModeBanner">
          <span id="editModeText">기존 트랙 수정 중</span>
          <button class="cancel-edit-btn" id="cancelEditBtn">수정 취소</button>
        </div>

        <div class="writer-field">
          <label>카테고리</label>
          <div class="cat-select-row">
            <div class="cat-option selected" data-cat="MADE">MADE</div>
            <div class="cat-option" data-cat="LOVE">LOVE</div>
          </div>
        </div>

        <div class="writer-field">
          <label>트랙 제목 (TITLE)</label>
          <input type="text" class="writer-input" id="postTitleInput" placeholder="제목을 입력하세요" />
        </div>

        <div class="writer-field">
          <label>① LP 커버 이미지 (420×420 권장)</label>
          <span class="existing-asset-note" id="existingCoverNote"></span>
          <input type="file" id="coverFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>② LP 알판 이미지 (384×384 투명 PNG 권장)</label>
          <span class="existing-asset-note" id="existingVinylNote"></span>
          <input type="file" id="vinylFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>③ 본문 IMAGE 첨부</label>
          <span class="existing-asset-note" id="existingBodyImgNote"></span>
          <input type="file" id="bodyImgFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>COMMENT (메인 코멘트 본문)</label>
          <textarea class="writer-textarea" id="postBodyInput" placeholder="첫 번째 코멘트를 작성하세요."></textarea>
        </div>

        <div class="writer-field">
          <label>THREADS (추가 타래글들 - 구분선 `---`로 여러 개 작성 가능)</label>
          <textarea class="writer-textarea" id="postThreadsInput" placeholder="---\n두 번째 타래글 내용...\n---\n세 번째 타래글 내용..."></textarea>
        </div>

        <button class="writer-submit" id="publishBtn">발행하기 (PUBLISH)</button>
      </div>

      <div class="manage-list" id="manageListPanel"></div>

      <div class="writer-status" id="writerStatus"></div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];
    let selectedCategory = "MADE";

    let isDiscPaused = false;
    let progressTimer = null;
    let progressPercent = 28;

    let editingIssueNumber = null;
    let preservedAssets = { cover: "", vinyl: "", bodyImg: "", order: "", threads: "" };

    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    function extractMetaUrl(bodyText, key, fallback) {
      if (!bodyText) return fallback;
      const regex = new RegExp(`^${key}:\\s*(.+)$`, 'im');
      const match = bodyText.match(regex);
      return match ? match[1].trim() : fallback;
    }

    function matchesCategory(post, label) {
      if (label === 'ALL') return true;
      if (!Array.isArray(post.labels)) return false;
      return post.labels.some(l => {
        const name = l.name.trim().toUpperCase();
        if (label === 'LOVE') return name === 'LOVE' || name === 'AND';
        return name === label;
      });
    }

    async function fetchPosts() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100&_t=${Date.now()}`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues.sort((a, b) => {
            const orderA = Number(extractMetaUrl(a.body, 'order', '9999'));
            const orderB = Number(extractMetaUrl(b.body, 'order', '9999'));
            if (orderA !== orderB) return orderA - orderB;
            return new Date(b.created_at) - new Date(a.created_at);
          });
        } else {
          allPosts = [
            { number: 0, title: "SAMPLE 01", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "상단 Love the Loveless 제목을 더블클릭(또는 주소 뒤에 #write 입력)하면 글쓰기·순서변경·수정·삭제 창이 열립니다." }
          ];
        }

        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.label?.trim().toUpperCase() || 'ALL';
        filteredPosts = allPosts.filter(p => matchesCategory(p, activeFilter));

        bindFilterButtons();
        rebuildAll();
        renderManageList();

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => {
            updateCarouselPositions();
          });
        }
        setTimeout(() => { updateCarouselPositions(); }, 50);
        setTimeout(() => { updateCarouselPositions(); }, 300);
      } catch (err) {
        console.error(err);
      }
    }

    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label.trim().toUpperCase();
          filteredPosts = allPosts.filter(p => matchesCategory(p, label));
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      resetPlayerAnimation();
      buildStackDOM();
      renderTrackList();
      updateCarouselPositions();
    }

    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
        const date = formatYYMMDD(post.created_at);
        const coverImgUrl = extractMetaUrl(post.body, 'cover', '');
        const vinylImgUrl = extractMetaUrl(post.body, 'vinyl', '');

        const jacketClass = coverImgUrl ? 'lp-jacket has-img' : 'lp-jacket';
        const jacketStyle = coverImgUrl ? `style="background-image: url('${coverImgUrl}')"` : '';

        const vinylClass = vinylImgUrl ? 'vinyl-disc has-img' : 'vinyl-disc';
        const vinylStyle = vinylImgUrl ? `style="background-image: url('${vinylImgUrl}')"` : '';

        slot.innerHTML = `
          <div class="${jacketClass}" ${jacketStyle}>
            <div class="lp-card-label">${labelName}</div>
            <div class="lp-card-title">${post.title}</div>
            <div class="lp-card-date">${date}</div>
          </div>
          <div class="${vinylClass}" ${vinylStyle}>
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (isPlaying) {
            if (idx === currentIndex) resetPlayerAnimation();
            return;
          }

          if (idx === currentIndex) {
            startPlayerSequence(slot, idx);
          } else {
            currentIndex = idx;
            updateCarouselPositions();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
    }

    function startPlayerSequence(slot, idx = currentIndex) {
      resetPlayerAnimation();
      isPlaying = true;

      const cardBox = document.getElementById('playerCardBox');

      slot.classList.add('on-player');

      const t1 = setTimeout(() => {
        cardBox.classList.add('playing-mode');
        openTrackDetail(idx);
      }, 200);

      const t2 = setTimeout(() => {
        slot.classList.add('spinning');
      }, 650);

      playTimers.push(t1, t2);
    }

    function resetPlayerAnimation() {
      playTimers.forEach(t => clearTimeout(t));
      playTimers = [];
      clearInterval(progressTimer);
      isPlaying = false;
      isDiscPaused = false;

      document.getElementById('playerCardBox').classList.remove('playing-mode');
      document.getElementById('detailDrawer').classList.remove('open');
      document.getElementById('imageSection').classList.remove('visible');
      document.getElementById('commentSection').classList.remove('visible');
      document.getElementById('miniTrackPopover').classList.remove('open');
      document.getElementById('ctrlListToggle').classList.remove('active');

      slotElements.forEach(s => {
        s.classList.remove('on-player', 'spinning');
      });
    }

    function startProgressSimulation() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (isDiscPaused || !isPlaying) return;
        progressPercent = progressPercent >= 100 ? 0 : progressPercent + 0.5;
        const fill = document.getElementById('ctrlProgressFill');
        if (fill) fill.style.width = `${progressPercent}%`;
      }, 300);
    }

    function setDiscPlayState(playingState) {
      isDiscPaused = !playingState;
      const activeSlot = slotElements[currentIndex];
      const icon = document.getElementById('playPauseIcon');

      if (playingState) {
        if (activeSlot) activeSlot.classList.add('spinning');
        if (icon) icon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      } else {
        if (activeSlot) activeSlot.classList.remove('spinning');
        if (icon) icon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    document.getElementById('btnPrevTrack').onclick = (e) => {
      e.stopPropagation();
      if (filteredPosts.length === 0) return;
      const prevIdx = (currentIndex - 1 + filteredPosts.length) % filteredPosts.length;
      switchTrackWhilePlaying(prevIdx);
    };

    document.getElementById('btnNextTrack').onclick = (e) => {
      e.stopPropagation();
      if (filteredPosts.length === 0) return;
      const nextIdx = (currentIndex + 1) % filteredPosts.length;
      switchTrackWhilePlaying(nextIdx);
    };

    document.getElementById('btnPlayPause').onclick = (e) => {
      e.stopPropagation();
      setDiscPlayState(isDiscPaused);
    };

    document.getElementById('ctrlProgressWrap').onclick = (e) => {
      e.stopPropagation();
      const rect = e.currentTarget.getBoundingClientRect();
      progressPercent = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      document.getElementById('ctrlProgressFill').style.width = `${progressPercent}%`;
    };

    document.getElementById('ctrlListToggle').onclick = (e) => {
      e.stopPropagation();
      const toggleBtn = e.currentTarget;
      const popover = document.getElementById('miniTrackPopover');

      toggleBtn.classList.toggle('active');
      popover.classList.toggle('open');
    };

    function renderTrackList() {
      const popover = document.getElementById('miniTrackPopover');
      if (!popover) return;
      if (filteredPosts.length === 0) {
        popover.innerHTML = `<div class="mini-track-row">등록된 트랙이 없습니다.</div>`;
        return;
      }
      popover.innerHTML = filteredPosts.map((post, idx) => `
        <div class="mini-track-row" data-idx="${idx}">
          ${idx + 1}. ${post.title}
        </div>
      `).join('');

      popover.querySelectorAll('.mini-track-row').forEach(item => {
        item.onclick = (e) => {
          e.stopPropagation();
          switchTrackWhilePlaying(Number(item.dataset.idx));
        };
      });
    }

    function switchTrackWhilePlaying(idx) {
      if (currentIndex !== idx) {
        currentIndex = idx;
        updateCarouselPositions();
        if (slotElements[currentIndex]) {
          slotElements[currentIndex].classList.add('on-player', 'spinning');
        }
      }
      openTrackDetail(idx);
    }

    function openTrackDetail(idx) {
      document.querySelectorAll('.mini-track-row').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      const post = filteredPosts[idx];
      if (!post) return;

      const cat = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
      document.getElementById('ctrlTitle').textContent = post.title;
      document.getElementById('ctrlSub').textContent = `${cat} · ${formatYYMMDD(post.created_at)}`;
      progressPercent = 18;
      document.getElementById('ctrlProgressFill').style.width = `${progressPercent}%`;
      setDiscPlayState(true);
      startProgressSimulation();

      const detailDrawer = document.getElementById('detailDrawer');
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');
      detailDrawer.classList.add('open');

      setTimeout(() => {
        const rawBody = (post.body || '')
          .replace(/^cover:\s*.+$/gim, '')
          .replace(/^vinyl:\s*.+$/gim, '')
          .replace(/^order:\s*.+$/gim, '')
          .replace(/^threads:[\s\S]*?(?=^#|\Z)/gim, '')
          .trim();

        const mdImgMatch = rawBody.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = rawBody.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = rawBody;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        document.getElementById('activePostTitle').textContent = `— ${post.title}`;
        marked.setOptions({ breaks: true });
        document.getElementById('commentBody').innerHTML = marked.parse(textOnlyBody || '(작성된 코멘트가 없습니다.)');

        // 타래(Threads) 파싱 및 렌더링
        const threadsContainer = document.getElementById('threadsContainer');
        threadsContainer.innerHTML = '';

        const threadMatch = (post.body || '').match(/^threads:\s*\n([\s\S]*)$/im);
        if (threadMatch && threadMatch[1]) {
          const rawThreads = threadMatch[1].trim();
          const threadBlocks = rawThreads.split(/^---\s*$/gm).map(b => b.trim()).filter(Boolean);

          threadBlocks.forEach(block => {
            const itemEl = document.createElement('div');
            itemEl.className = 'thread-item';
            const dateStr = formatYYMMDD(post.created_at);

            itemEl.innerHTML = `
              <div class="thread-date">${dateStr}</div>
              <div class="thread-body">${marked.parse(block)}</div>
            `;
            threadsContainer.appendChild(itemEl);
          });
        }

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 160);
    }

    function updateCarouselPositions() {
      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `translateX(0px) translateZ(0px) rotateY(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else {
          slot.classList.remove('active', 'on-player', 'spinning');
          const sign = offset > 0 ? 1 : -1;
          const abs = Math.abs(offset);
          const translateX = sign * (80 + abs * 26);
          const translateZ = -40 - abs * 28;
          const rotateY = -sign * 50;

          slot.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 25 - abs);
          slot.style.opacity = abs > 2 ? 0 : Math.max(0.45, 1 - abs * 0.25);
          slot.style.pointerEvents = abs > 2 ? 'none' : 'auto';
        }
      });
    }

    function stepTrack(direction) {
      if (isPlaying || isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        updateCarouselPositions();
        setTimeout(() => { isScrolling = false; }, 320);
      }
    }

    const carouselStage = document.getElementById('carouselStage');

    carouselStage.addEventListener('wheel', (e) => {
      if (isPlaying) return;
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 10) return;
      stepTrack(delta > 0 ? 1 : -1);
    }, { passive: false });

    let touchStartX = 0;
    carouselStage.addEventListener('touchstart', (e) => {
      if (isPlaying) return;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    carouselStage.addEventListener('touchend', (e) => {
      if (isPlaying) return;
      const diffX = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 30) {
        stepTrack(diffX > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (isPlaying || document.getElementById('writerOverlay').classList.contains('open')) return;
      if (e.key === 'ArrowLeft') stepTrack(-1);
      if (e.key === 'ArrowRight') stepTrack(1);
    });

    /* =========================================================================
       전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달
       ========================================= */
    const writerOverlay = document.getElementById('writerOverlay');
    const ghTokenInput = document.getElementById('ghTokenInput');

    const savedToken = localStorage.getItem('oblaat_gh_token');
    if (savedToken) ghTokenInput.value = savedToken;

    function openWriterModal() {
      renderManageList();
      writerOverlay.classList.add('open');
    }
    function closeWriterModal() {
      cancelEditMode();
      writerOverlay.classList.remove('open');
      if (window.location.hash === '#write') {
        history.replaceState(null, null, ' ');
      }
    }

    if (window.location.hash === '#write') {
      openWriterModal();
    }
    window.addEventListener('hashchange', () => {
      if (window.location.hash === '#write') openWriterModal();
    });

    const secretTrigger = document.getElementById('secretTrigger');
    secretTrigger.ondblclick = openWriterModal;
    let pressTimer = null;
    secretTrigger.addEventListener('touchstart', () => {
      pressTimer = setTimeout(openWriterModal, 1200);
    }, { passive: true });
    secretTrigger.addEventListener('touchend', () => clearTimeout(pressTimer));

    document.getElementById('closeWriter').onclick = closeWriterModal;

    const tabWrite = document.getElementById('tabWrite');
    const tabManage = document.getElementById('tabManage');
    const writeFormPanel = document.getElementById('writeFormPanel');
    const manageListPanel = document.getElementById('manageListPanel');

    function switchAdminTab(mode) {
      document.getElementById('writerStatus').textContent = '';
      if (mode === 'write') {
        tabWrite.classList.add('active');
        tabManage.classList.remove('active');
        writeFormPanel.classList.remove('hidden');
        manageListPanel.classList.remove('active');
      } else {
        tabManage.classList.add('active');
        tabWrite.classList.remove('active');
        writeFormPanel.classList.add('hidden');
        manageListPanel.classList.add('active');
        renderManageList();
      }
    }

    tabWrite.onclick = () => switchAdminTab('write');
    tabManage.onclick = () => switchAdminTab('manage');

    function setCategorySelection(catName) {
      selectedCategory = catName;
      document.querySelectorAll('.cat-option').forEach(o => {
        o.classList.toggle('selected', o.dataset.cat === catName);
      });
    }

    document.querySelectorAll('.cat-option').forEach(opt => {
      opt.onclick = () => setCategorySelection(opt.dataset.cat);
    });

    function renderManageList() {
      const realPosts = allPosts.filter(p => p.number > 0);
      if (realPosts.length === 0) {
        manageListPanel.innerHTML = `<p style="font-size:0.84rem; color:#888; text-align:center; padding:24px 0;">등록된 트랙이 없습니다.</p>`;
        return;
      }

      manageListPanel.innerHTML = realPosts.map((post, idx) => {
        const cat = post.labels[0] ? post.labels[0].name : 'NONE';
        const date = formatYYMMDD(post.created_at);
        return `
          <div class="manage-item">
            <div class="manage-item-info">
              <div class="manage-item-title">${idx + 1}. ${post.title}</div>
              <div class="manage-item-meta">[${cat}] · ${date}</div>
            </div>
            <div class="manage-actions">
              <button class="btn-order" onclick="moveTrackOrder(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
              <button class="btn-order" onclick="moveTrackOrder(${idx}, 1)" ${idx === realPosts.length - 1 ? 'disabled' : ''}>▼</button>
              <button class="btn-edit" onclick="startEditTrack(${post.number})">수정</button>
              <button class="btn-delete" onclick="deleteTrack(${post.number}, '${post.title.replace(/'/g, "\\'")}')">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.moveTrackOrder = async function(index, direction) {
      const token = ghTokenInput.value.trim();
      const statusEl = document.getElementById('writerStatus');
      if (!token) {
        statusEl.textContent = '상단 발행 비밀번호(GitHub Token)를 먼저 입력해 주세요.';
        return;
      }

      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= allPosts.length) return;

      const temp = allPosts[index];
      allPosts[index] = allPosts[targetIndex];
      allPosts[targetIndex] = temp;

      renderManageList();
      statusEl.textContent = '순서 저장 중...';

      try {
        for (let i = 0; i < allPosts.length; i++) {
          const post = allPosts[i];
          if (post.number <= 0) continue;
          const newOrder = i + 1;
          const currentOrder = Number(extractMetaUrl(post.body, 'order', '-1'));
          if (currentOrder === newOrder) continue;

          const cleanBody = (post.body || '').replace(/^order:\s*.+$/gim, '').trim();
          const updatedBody = `order: ${newOrder}\n\n${cleanBody}`;
          post.body = updatedBody;

          await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${post.number}`, {
            method: 'PATCH',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ body: updatedBody })
          });
        }

        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.label?.trim().toUpperCase() || 'ALL';
        filteredPosts = allPosts.filter(p => matchesCategory(p, activeFilter));
        rebuildAll();

        statusEl.textContent = '순서가 변경되었습니다.';
        setTimeout(() => { statusEl.textContent = ''; }, 1000);
      } catch (err) {
        statusEl.textContent = '순서 저장 실패: 토큰을 확인해 주세요.';
      }
    };

    window.startEditTrack = function(issueNumber) {
      const post = allPosts.find(p => p.number === issueNumber);
      if (!post) return;

      editingIssueNumber = issueNumber;
      const raw = post.body || '';

      const coverUrl = extractMetaUrl(raw, 'cover', '');
      const vinylUrl = extractMetaUrl(raw, 'vinyl', '');
      const orderVal = extractMetaUrl(raw, 'order', '');

      const cleanWithoutMeta = raw
        .replace(/^cover:\s*.+$/gim, '')
        .replace(/^vinyl:\s*.+$/gim, '')
        .replace(/^order:\s*.+$/gim, '')
        .replace(/^threads:[\s\S]*?(?=^#|\Z)/gim, '')
        .trim();

      const threadMatch = raw.match(/^threads:\s*\n([\s\S]*)$/im);
      const threadsVal = threadMatch ? threadMatch[1].trim() : '';

      const mdImgMatch = cleanWithoutMeta.match(/!\[.*?\]\((.*?)\)/);
      const bodyImgUrl = mdImgMatch ? mdImgMatch[1] : '';
      const pureText = mdImgMatch ? cleanWithoutMeta.replace(mdImgMatch[0], '').trim() : cleanWithoutMeta;

      preservedAssets = { cover: coverUrl, vinyl: vinylUrl, bodyImg: bodyImgUrl, order: orderVal, threads: threadsVal };

      document.getElementById('existingCoverNote').textContent = coverUrl ? '※ 기존 커버 이미지 유지됨 (새 파일 선택 시 교체)' : '';
      document.getElementById('existingVinylNote').textContent = vinylUrl ? '※ 기존 LP 알판 이미지 유지됨 (새 파일 선택 시 교체)' : '';
      document.getElementById('existingBodyImgNote').textContent = bodyImgUrl ? '※ 기존 본문 이미지 유지됨 (새 파일 선택 시 교체)' : '';

      document.getElementById('postTitleInput').value = post.title;
      document.getElementById('postBodyInput').value = pureText;
      document.getElementById('postThreadsInput').value = threadsVal;
      const cat = post.labels[0] ? post.labels[0].name.trim().toUpperCase() : 'MADE';
      setCategorySelection(cat === 'LOVE' || cat === 'AND' ? 'LOVE' : 'MADE');

      document.getElementById('editModeBanner').classList.add('active');
      document.getElementById('editModeText').textContent = `수정 중: ${post.title}`;
      document.getElementById('publishBtn').textContent = '수정 완료 (UPDATE)';

      switchAdminTab('write');
    };

    function cancelEditMode() {
      editingIssueNumber = null;
      preservedAssets = { cover: "", vinyl: "", bodyImg: "", order: "", threads: "" };
      document.getElementById('existingCoverNote').textContent = '';
      document.getElementById('existingVinylNote').textContent = '';
      document.getElementById('existingBodyImgNote').textContent = '';
      document.getElementById('postTitleInput').value = '';
      document.getElementById('postBodyInput').value = '';
      document.getElementById('postThreadsInput').value = '';
      document.getElementById('coverFileInput').value = '';
      document.getElementById('vinylFileInput').value = '';
      document.getElementById('bodyImgFileInput').value = '';
      document.getElementById('editModeBanner').classList.remove('active');
      document.getElementById('publishBtn').textContent = '발행하기 (PUBLISH)';
    }

    document.getElementById('cancelEditBtn').onclick = cancelEditMode;

    window.deleteTrack = async function(issueNumber, title) {
      const token = ghTokenInput.value.trim();
      const statusEl = document.getElementById('writerStatus');

      if (!token) {
        statusEl.textContent = '상단 발행 비밀번호(GitHub Token)를 먼저 입력해 주세요.';
        return;
      }
      if (!confirm(`"${title}" 트랙을 정말 삭제할까요?`)) return;

      localStorage.setItem('oblaat_gh_token', token);
      statusEl.textContent = '트랙 삭제 중...';

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${issueNumber}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ state: 'closed' })
        });

        if (!res.ok) throw new Error('삭제 실패: 토큰 권한을 확인해 주세요.');

        statusEl.textContent = '삭제되었습니다.';
        await fetchPosts();
        setTimeout(() => { statusEl.textContent = ''; }, 1200);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    };

    async function uploadImageToGitHub(file, token) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const base64Content = reader.result.split(',')[1];
            const ext = file.name.split('.').pop() || 'png';
            const fileName = `uploads/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;

            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
              method: 'PUT',
              headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: `upload image: ${fileName}`,
                content: base64Content
              })
            });

            if (!res.ok) throw new Error('이미지 업로드 실패 (토큰 권한 확인)');
            const data = await res.json();
            resolve(data.content.download_url);
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('publishBtn').onclick = async () => {
      const token = ghTokenInput.value.trim();
      const title = document.getElementById('postTitleInput').value.trim();
      const rawBody = document.getElementById('postBodyInput').value.trim();
      const rawThreads = document.getElementById('postThreadsInput').value.trim();
      const coverFile = document.getElementById('coverFileInput').files[0];
      const vinylFile = document.getElementById('vinylFileInput').files[0];
      const bodyImgFile = document.getElementById('bodyImgFileInput').files[0];
      const statusEl = document.getElementById('writerStatus');
      const btn = document.getElementById('publishBtn');

      if (!token) {
        statusEl.textContent = '발행 비밀번호(GitHub Token)를 입력해 주세요.';
        return;
      }
      if (!title) {
        statusEl.textContent = '트랙 제목을 입력해 주세요.';
        return;
      }

      localStorage.setItem('oblaat_gh_token', token);
      btn.disabled = true;

      try {
        let finalBodyParts = [];

        if (preservedAssets.order) {
          finalBodyParts.push(`order: ${preservedAssets.order}`);
        }

        if (coverFile) {
          statusEl.textContent = 'LP 커버 이미지 업로드 중...';
          const coverUrl = await uploadImageToGitHub(coverFile, token);
          finalBodyParts.push(`cover: ${coverUrl}`);
        } else if (preservedAssets.cover) {
          finalBodyParts.push(`cover: ${preservedAssets.cover}`);
        }

        if (vinylFile) {
          statusEl.textContent = 'LP 알판 이미지 업로드 중...';
          const vinylUrl = await uploadImageToGitHub(vinylFile, token);
          finalBodyParts.push(`vinyl: ${vinylUrl}`);
        } else if (preservedAssets.vinyl) {
          finalBodyParts.push(`vinyl: ${preservedAssets.vinyl}`);
        }

        if (bodyImgFile) {
          statusEl.textContent = '본문 이미지 업로드 중...';
          const bodyImgUrl = await uploadImageToGitHub(bodyImgFile, token);
          finalBodyParts.push(`![image](${bodyImgUrl})`);
        } else if (preservedAssets.bodyImg) {
          finalBodyParts.push(`![image](${preservedAssets.bodyImg})`);
        }

        if (rawBody) {
          finalBodyParts.push(rawBody);
        }

        const threadsVal = rawThreads || preservedAssets.threads;
        if (threadsVal) {
          finalBodyParts.push(`threads:\n${threadsVal}`);
        }

        const isEditing = editingIssueNumber !== null;
        statusEl.textContent = isEditing ? '트랙 수정 저장 중...' : '트랙 발행 중...';

        const endpoint = isEditing
          ? `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${editingIssueNumber}`
          : `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues`;

        const res = await fetch(endpoint, {
          method: isEditing ? 'PATCH' : 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title: title,
            body: finalBodyParts.join('\n\n'),
            labels: [selectedCategory]
          })
        });

        if (!res.ok) throw new Error('저장 실패: 토큰이 올바른지 확인해 주세요.');

        statusEl.textContent = isEditing ? '수정 완료!' : '발행 완료!';

        setTimeout(() => {
          closeWriterModal();
          statusEl.textContent = '';
          btn.disabled = false;
          fetchPosts();
        }, 700);

      } catch (err) {
        statusEl.textContent = err.message;
        btn.disabled = false;
      }
    };

    fetchPosts();
  </script>
</body>
