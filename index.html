<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love the Loveless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #555555;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Gowun Batang', serif;
      min-height: 100vh;
    }

    .page-shell {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* 이미지 및 커버 우클릭/드래그 차단 */
    img, .lp-jacket, .vinyl-disc, .turntable-box, .tonearm-overlay {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    .lp-slot, .carousel-stage, .global-header, .writer-overlay,
    .player-control-card, .ctrl-buttons, .ctrl-btn, .ctrl-progress-wrap,
    .mini-track-popover, .mini-track-row, .active-turntable-stage {
      pointer-events: auto;
    }

    /* =========================================
       [상단 헤더] Love the Loveless (Monsieur La Doulaise)
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 50;
    }
    .global-header h1 {
      font-family: 'Monsieur La Doulaise', cursive;
      font-weight: 400;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
      font-family: 'Gowun Batang', serif;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       메인 컨테이너 및 다단계 시퀀스 스테이지
       ========================================= */
    .main-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .showcase-row {
      width: 100%;
      min-height: 290px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .player-stage {
      position: absolute;
      width: 100%;
      height: 275px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.52s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 15;
    }

    .showcase-row.stage-covers-exit .player-stage {
      opacity: 0;
      transform: translateY(-48px);
      pointer-events: none;
    }

    .player-active-row {
      position: relative;
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0 10px;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 25;
    }

    .showcase-row.is-open .player-stage {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    .showcase-row.is-open .player-active-row {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    .active-turntable-stage {
      position: relative;
      width: 220px;
      height: 220px;
      flex-shrink: 0;
      z-index: 6;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .showcase-row.stage-turntable-in .active-turntable-stage {
      opacity: 1;
      transform: translateY(0);
    }

    .track-drawer {
      position: relative;
      z-index: 3;
      margin-left: -18px;
      opacity: 0;
      transform: translateX(-28px);
      pointer-events: none;
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .showcase-row.stage-card-in .track-drawer {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    /* =========================================
       커버플로우(Cover Flow) 3D 스테이지
       ========================================= */
    .carousel-stage {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 750px;
      perspective-origin: 50% 45%;
      touch-action: none;
      z-index: 20;
    }

    .stack-track {
      position: relative;
      width: 210px;
      height: 210px;
      margin-top: 10px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    .lp-jacket.has-img {
      border: none;
    }
    .lp-jacket.has-img .lp-card-label,
    .lp-jacket.has-img .lp-card-title,
    .lp-jacket.has-img .lp-card-date {
      display: none;
    }

    .lp-card-label {
      font-size: 0.8rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.78rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .vinyl-disc {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 192px;
      height: 192px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 13px;
      opacity: 0;
      pointer-events: none;
      transition: transform 1.25s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.75s ease;
    }

    .vinyl-disc.has-img {
      border: none;
      background-color: transparent;
    }
    .vinyl-disc.has-img::before,
    .vinyl-disc.has-img::after,
    .vinyl-disc.has-img .sliding-text {
      display: none;
    }

    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.55);
    }

    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange);
    }

    .sliding-text {
      font-size: 0.65rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    .lp-slot.active .vinyl-disc,
    .lp-slot.active.lp-sliding-out .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(44px);
    }

    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(108px);
      transition: transform 1.05s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.7s ease;
    }

    /* =========================================
       재생 모드 턴테이블 본체 및 톤암 (빨간 원 축 정렬 + 시계바늘 회전)
       ========================================= */
    .turntable-box {
      position: absolute;
      inset: 0;
      width: 220px;
      height: 220px;
      border: 1.5px solid var(--line-blue);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 10;
      cursor: pointer;
      pointer-events: auto;
    }
    .turntable-box.has-img {
      border: none;
      background-color: transparent;
    }

    .active-vinyl-disc {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 184px;
      height: 184px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-48px);
      transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.55s ease;
    }
    .showcase-row.stage-lp-in .active-vinyl-disc {
      opacity: 1;
      transform: translateY(0px);
    }
    .active-vinyl-disc.has-img {
      border: none;
      background-color: transparent;
    }
    .active-vinyl-disc.spinning {
      animation: spinActiveVinyl 4s linear infinite;
    }
    @keyframes spinActiveVinyl {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .tonearm-overlay {
      position: absolute;
      inset: 0;
      width: 220px;
      height: 220px;
      z-index: 35;
      pointer-events: none;
    }
    .turntable-spindle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }
    .tonearm-custom-img {
      display: none;
      position: absolute;
      bottom: 13px;
      left: 4px;
      width: auto;
      height: 138px;
      /* 아랫부분 둥근 축 고정 + 위쪽 핀 부분만 시계바늘 회전 */
      transform-origin: 50% 91%;
      transform: rotate(0deg);
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tonearm-overlay.has-img .turntable-spindle {
      display: none;
    }
    .tonearm-overlay.has-img .tonearm-custom-img {
      display: block;
    }
    .tonearm-overlay.playing .tonearm-custom-img {
      transform: rotate(14deg);
    }

    /* =========================================
       우측 뮤직 컨트롤 카드
       ========================================= */
    .player-control-card {
      width: 310px;
      min-height: 166px;
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
      padding: 12px 16px 12px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      position: relative;
      flex-shrink: 0;
      pointer-events: auto;
      transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  min-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.35s ease;
    }

.ctrl-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .ctrl-meta {
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .ctrl-volume-wrap {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: 66px;
      height: 16px;
      cursor: pointer;
    }

    .ctrl-volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3.5px;
      background: linear-gradient(to right, #C6D5FF 0%, #C6D5FF 50%, #e6e8ec 50%, #e6e8ec 100%);
      border-radius: 99px;
      outline: none;
      cursor: pointer;
    }
    .ctrl-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #C6D5FF;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .ctrl-volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .ctrl-volume-slider::-moz-range-thumb {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #C6D5FF;
      border: none;
      cursor: pointer;
    }

    .ctrl-btn.loop-active {
      color: var(--line-blue);
      background: #f4f7ff;
    }

    .ctrl-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ctrl-progress-wrap {
      width: 100%;
      height: 4px;
      background: #e6e8ec;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .ctrl-progress-fill {
      width: 0%;
      height: 100%;
      background: #C6D5FF;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .ctrl-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      position: relative;
      pointer-events: auto;
    }

    .ctrl-btn {
      background: none;
      border: 1.5px solid transparent;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #111111;
      transition: 0.2s;
      position: relative;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .ctrl-btn:hover {
      background: #f5f6f8;
    }

    .ctrl-btn.next-ring {
      border-color: #c8ccd4;
    }

    .ctrl-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      pointer-events: none;
    }

    .mini-track-popover {
      box-sizing: border-box;
      height: 44px !important;
      max-height: 44px !important;
      min-height: 44px !important;
      flex: 0 0 44px !important;
      opacity: 1 !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      display: block !important;
      border-top: 1px solid #eeeeee;
      padding: 3px 7px 0 0;
      scrollbar-width: thin;
      scrollbar-color: #bfc5d0 #f3f5f9;
      overscroll-behavior: contain;
      position: relative;
      pointer-events: auto;
    }
    .mini-track-popover::-webkit-scrollbar { width: 6px; }
    .mini-track-popover::-webkit-scrollbar-track {
      background: #f3f5f9;
      border-radius: 99px;
    }
    .mini-track-popover::-webkit-scrollbar-thumb {
      background: #bfc5d0;
      border-radius: 99px;
      border: 1px solid #f3f5f9;
    }
    .mini-track-row {
      box-sizing: border-box;
      display: block;
      height: 20px;
      min-height: 20px;
      font-size: 0.78rem;
      line-height: 18px;
      color: #222222 !important;
      padding: 1px 6px;
      margin: 0;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 1 !important;
      pointer-events: auto;
    }
    .mini-track-row:hover, .mini-track-row.active {
      background: #f4f7ff;
      color: var(--line-blue) !important;
      font-weight: 600;
    }

    /* =========================================
       [하단 영역] IMAGE & COMMENT & THREADS
       ========================================= */
    .detail-drawer {
      width: 100%;
      max-width: 546px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transform: translateY(-14px);
      transition: max-height 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s ease,
                  margin-top 0.55s ease,
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .detail-drawer.open {
      max-height: 5000px;
      opacity: 1;
      margin-top: 24px;
      transform: translateY(0);
    }

    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-top: 4px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .image-frame {
      width: 100%;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    .comment-section {
      width: 100%;
    }
    .comment-label {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-size: 1.02rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    .threads-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
      padding-top: 0;
    }

    .thread-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
.thread-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 2px;
      border-bottom: 1px solid #eeeeee;
    }
    .thread-title-toggle {
      background: none;
      border: none;
      text-align: left;
      font-family: 'Gowun Batang', serif;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      transition: color 0.2s ease;
    }
    .thread-title-toggle:hover {
      color: var(--line-blue);
    }
    .thread-expand-arrow {
      font-size: 0.72rem;
      color: var(--text-sub);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .thread-item.expanded .thread-expand-arrow {
      transform: rotate(90deg);
      color: var(--line-blue);
    }
    .thread-collapsible-body {
      display: none;
      padding-top: 6px;
    }
    .thread-item.expanded .thread-collapsible-body {
      display: block;
    }
    .thread-edit-title-input,
    .thread-new-title-input {
      width: 100%;
      border: 1px solid #dcdcdc;
      background: #ffffff;
      padding: 7px 10px;
      font-family: 'Gowun Batang', serif;
      font-size: 0.88rem;
      color: var(--text-main);
      outline: none;
    }
    .thread-edit-title-input:focus,
    .thread-new-title-input:focus {
      border-color: var(--line-blue);
    }

    .thread-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    /* 스레드 + 클릭 시 인라인 수정 UI */
    .thread-date {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: color 0.2s ease;
    }
    .thread-date:hover {
      color: var(--line-blue);
      font-weight: 600;
    }
    .thread-edit-box {
      margin-top: 8px;
      border: 1px solid var(--line-blue);
      background: #f8faff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .thread-edit-textarea {
      width: 100%;
      min-height: 85px;
      border: 1px solid #dcdcdc;
      background: #ffffff;

    /* 스레드 다중 이미지 수평 슬라이드 */
    .thread-slide-wrap {
      position: relative;
      width: 100%;
      margin: 10px 0;
      border: 1px solid #ececec;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }
    .thread-slide-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .thread-slide-track::-webkit-scrollbar {
      display: none;
    }
    .thread-slide-item {
      flex: 0 0 100%;
      width: 100%;
      scroll-snap-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }
    .thread-slide-item img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
    }
    .thread-slide-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #dcdcdc;
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 4;
      transition: 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .thread-slide-nav:hover {
      border-color: var(--text-main);
      background: #ffffff;
    }
    .thread-slide-prev { left: 8px; }
    .thread-slide-next { right: 8px; }
    .thread-slide-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      background: #ffffff;
    }
    .thread-slide-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d5d9e2;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: 0.2s;
    }
    .thread-slide-dot.active {
      background: var(--line-blue);
      width: 14px;
      border-radius: 99px;
    }

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    const CUSTOM_ASSETS = {
      defaultCover: "",
      vinylDisc: "",
      turntable: "./player.png",
      tonearm: "./tonearm.png"
    };

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];
    let selectedCategory = "MADE";

    let isDiscPaused = false;
    let progressTimer = null;
    let progressPercent = 0;

    let editingIssueNumber = null;
    let preservedAssets = { cover: "", vinyl: "", bodyImg: "", bgm: "", yt: "", order: "" };

    const bgmAudio = document.getElementById('bgmAudioPlayer');
    const volSlider = document.getElementById('ctrlVolumeSlider');
    const btnLoopTrack = document.getElementById('btnLoopTrack');
    let isLooping = false;
    let isTrackEnded = false;
    let currentBgmUrl = "";
    let currentMediaType = "none"; // "mp3" | "youtube" | "none"

    let ytPlayer = null;
    let ytApiReady = false;
    let ytPlayerReady = false;
    let pendingYtVideoId = null;
    let pendingYtAutoplay = false;
    let ytProgressTimer = null;

    function extractYouTubeId(rawUrl) {
      if (!rawUrl) return "";
      const trimmed = rawUrl.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/|music\.youtube\.com\/watch\?v=)([a-zA-Z0-9_-]{11})/i,
        /[?&]v=([a-zA-Z0-9_-]{11})/i
      ];
      for (const re of patterns) {
        const m = trimmed.match(re);
        if (m && m[1]) return m[1];
      }
      return "";
    }

    function initOrLoadYtPlayer(videoId, autoplay) {
      pendingYtVideoId = videoId;
      pendingYtAutoplay = autoplay;
      if (!ytApiReady) return;

      const targetVol = volSlider ? Number(volSlider.value) : 50;

      if (!ytPlayer) {
        ytPlayer = new YT.Player('ytBgmPlayerHost', {
          height: '200',
          width: '200',
          videoId: videoId,
          playerVars: {
            autoplay: autoplay ? 1 : 0,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            playsinline: 1,
            rel: 0
          },
          events: {
            onReady: (ev) => {
              ytPlayerReady = true;
              ev.target.setVolume(targetVol);
              if (pendingYtAutoplay && currentMediaType === 'youtube') {
                ev.target.playVideo();
              }
            },
            onStateChange: (ev) => {
              if (currentMediaType !== 'youtube') return;
              if (ev.data === YT.PlayerState.PLAYING) {
                isTrackEnded = false;
              } else if (ev.data === YT.PlayerState.ENDED) {
                if (isLooping) {
                  isTrackEnded = false;
                  progressPercent = 0;
                  const fill = document.getElementById('ctrlProgressFill');
                  if (fill) fill.style.width = '0%';
                  try {
                    ev.target.seekTo(0, true);
                    ev.target.playVideo();
                  } catch (err) {}
                } else {
                  isTrackEnded = true;
                  setDiscPlayState(false);
                  progressPercent = 0;
                  const fill = document.getElementById('ctrlProgressFill');
                  if (fill) fill.style.width = '0%';
                }
              }
            }
          }
        });
      } else if (ytPlayerReady) {
        ytPlayer.setVolume(targetVol);
        if (autoplay) {
          ytPlayer.loadVideoById(videoId);
        } else {
          ytPlayer.cueVideoById(videoId);
        }
      }
    }

    window.onYouTubeIframeAPIReady = function() {
      ytApiReady = true;
      if (pendingYtVideoId && currentMediaType === 'youtube') {
        initOrLoadYtPlayer(pendingYtVideoId, pendingYtAutoplay);
      }
    };

    function stopAllAudioPlayback(clearSource = false) {
      if (bgmAudio) {
        bgmAudio.pause();
        if (clearSource) {
          bgmAudio.removeAttribute('src');
          bgmAudio.load();
          currentBgmUrl = "";
        } else {
          bgmAudio.currentTime = 0;
        }
      }
      if (ytPlayer && ytPlayerReady) {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
      if (clearSource) {
        pendingYtVideoId = null;
        pendingYtAutoplay = false;
        currentMediaType = "none";
      }
    }

    function updateVolumeSliderFill(val) {
      if (!volSlider) return;
      const pct = Math.max(0, Math.min(100, Number(val)));
      volSlider.style.background = `linear-gradient(to right, #C6D5FF 0%, #C6D5FF ${pct}%, #e6e8ec ${pct}%, #e6e8ec 100%)`;
    }

    if (volSlider) {
      const savedVol = localStorage.getItem('oblaat_bgm_volume');
      const initVol = savedVol !== null ? Number(savedVol) : 50;
      volSlider.value = initVol;
      if (bgmAudio) bgmAudio.volume = initVol / 100;
      updateVolumeSliderFill(initVol);

      volSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        const v = Number(e.target.value);
        if (bgmAudio) bgmAudio.volume = v / 100;
        if (ytPlayer && ytPlayerReady) {
          try { ytPlayer.setVolume(v); } catch (err) {}
        }
        localStorage.setItem('oblaat_bgm_volume', String(v));
        updateVolumeSliderFill(v);
      });
      volSlider.addEventListener('click', (e) => e.stopPropagation());
    }

    if (btnLoopTrack) {
      btnLoopTrack.addEventListener('click', (e) => {
        e.stopPropagation();
        isLooping = !isLooping;
        if (bgmAudio) bgmAudio.loop = isLooping;
        btnLoopTrack.classList.toggle('loop-active', isLooping);
      });
    }

    if (bgmAudio) {
      bgmAudio.addEventListener('play', () => {
        if (currentMediaType === 'mp3') isTrackEnded = false;
      });

      bgmAudio.addEventListener('timeupdate', () => {
        if (currentMediaType !== 'mp3') return;
        if (!bgmAudio.duration || !isFinite(bgmAudio.duration)) return;
        progressPercent = (bgmAudio.currentTime / bgmAudio.duration) * 100;
        const fill = document.getElementById('ctrlProgressFill');
        if (fill) fill.style.width = `${progressPercent}%`;
      });

      bgmAudio.addEventListener('ended', () => {
        if (currentMediaType !== 'mp3') return;
        if (isLooping) {
          isTrackEnded = false;
          bgmAudio.currentTime = 0;
          bgmAudio.play().catch(() => {});
        } else {
          isTrackEnded = true;
          setDiscPlayState(false);
          progressPercent = 0;
          const fill = document.getElementById('ctrlProgressFill');
          if (fill) fill.style.width = '0%';
        }
      });
    }

    function loadAndPlayTrackAudio(post, shouldPlay = true) {
      isTrackEnded = false;
      if (!post) {
        stopAllAudioPlayback(true);
        return;
      }
      const ytRaw = extractMetaUrl(post.body, 'yt', '');
      const bgmUrl = extractMetaUrl(post.body, 'bgm', '');
      const ytId = extractYouTubeId(ytRaw || (bgmUrl && /(?:youtu\.be|youtube\.com)/i.test(bgmUrl) ? bgmUrl : ''));

      if (ytId) {
        if (bgmAudio) {
          bgmAudio.pause();
          bgmAudio.removeAttribute('src');
          bgmAudio.load();
          currentBgmUrl = "";
        }
        currentMediaType = "youtube";
        initOrLoadYtPlayer(ytId, shouldPlay);
      } else if (bgmUrl) {
        if (ytPlayer && ytPlayerReady) {
          try { ytPlayer.stopVideo(); } catch (e) {}
        }
        pendingYtVideoId = null;
        currentMediaType = "mp3";
        if (bgmAudio) {
          if (currentBgmUrl !== bgmUrl) {
            currentBgmUrl = bgmUrl;
            bgmAudio.src = bgmUrl;
            bgmAudio.load();
          }
          bgmAudio.loop = isLooping;
          if (shouldPlay) {
            bgmAudio.play().catch(() => {});
          }
        }
      } else {
        stopAllAudioPlayback(true);
      }
    }


    function applyCustomPlayerAssets() {
      const turntableBox = document.getElementById('turntableBox');
      const tonearmImg = document.getElementById('tonearmImg');

      if (CUSTOM_ASSETS.turntable) {
        turntableBox.style.backgroundImage = `url("${CUSTOM_ASSETS.turntable}")`;
        turntableBox.classList.add('has-img');
      }
      if (CUSTOM_ASSETS.tonearm) {
        tonearmImg.src = CUSTOM_ASSETS.tonearm;
        document.getElementById('tonearmOverlay').classList.add('has-img');
      }
    }

    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    function extractMetaUrl(bodyText, key, fallback) {
      if (!bodyText) return fallback;
      const regex = new RegExp(`^${key}:\s*(.+)$`, 'im');
      const match = bodyText.match(regex);
      return match ? match[1].trim() : fallback;
    }

    function isPlusPlaylistItem(post) {
      if (!post || !Array.isArray(post.labels)) return false;
      return post.labels.some(l => {
        const name = l.name.trim().toUpperCase();
        return name === 'PLUS' || name === 'MUSIC' || name === '+';
      });
    }

    function matchesCategory(post, label) {
      if (isPlusPlaylistItem(post)) return false;
      if (label === 'ALL') return true;
      if (!Array.isArray(post.labels)) return false;
      return post.labels.some(l => {
        const name = l.name.trim().toUpperCase();
        if (label === 'LOVE') return name === 'LOVE' || name === 'AND';
        return name === label;
      });
    }

const PLUS_PLAYLIST_PATH = "playlist/plus_tracks.json";
    let plusPlaylistTracks = [];
    let plusFileSha = null;

    function buildBodyFromPlusTrack(item) {
      const parts = [];
      if (item.yt) parts.push(`yt: ${item.yt}`);
      if (item.bgm) parts.push(`bgm: ${item.bgm}`);
      return parts.join('\n\n');
    }

    async function fetchPlusPlaylist() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${PLUS_PLAYLIST_PATH}?_t=${Date.now()}`);
        if (res.ok) {
          const fileData = await res.json();
          plusFileSha = fileData.sha || null;
          const decoded = decodeURIComponent(escape(atob((fileData.content || '').replace(/\n/g, ''))));
          const parsed = JSON.parse(decoded);
          if (Array.isArray(parsed)) {
            plusPlaylistTracks = parsed.map((t, i) => ({
              number: -(i + 1),
              isPlusPlaylist: true,
              title: t.title || `Track ${i + 1}`,
              created_at: t.created_at || new Date().toISOString(),
              labels: [{ name: 'PLUS' }],
              bgm: t.bgm || '',
              yt: t.yt || '',
              body: buildBodyFromPlusTrack(t)
            }));
            localStorage.setItem('oblaat_plus_playlist_cache', JSON.stringify(parsed));
            return;
          }
        }
      } catch (e) {}

      const cached = localStorage.getItem('oblaat_plus_playlist_cache');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed)) {
            plusPlaylistTracks = parsed.map((t, i) => ({
              number: -(i + 1),
              isPlusPlaylist: true,
              title: t.title || `Track ${i + 1}`,
              created_at: t.created_at || new Date().toISOString(),
              labels: [{ name: 'PLUS' }],
              bgm: t.bgm || '',
              yt: t.yt || '',
              body: buildBodyFromPlusTrack(t)
            }));
          }
        } catch (err) {}
      }
    }

    async function savePlusPlaylistToGitHub(tracksList, token) {
      const cleanPayload = tracksList.map(t => ({
        title: t.title,
        bgm: t.bgm || '',
        yt: t.yt || '',
        created_at: t.created_at || new Date().toISOString()
      }));
      localStorage.setItem('oblaat_plus_playlist_cache', JSON.stringify(cleanPayload));

      const jsonStr = JSON.stringify(cleanPayload, null, 2);
      const base64Utf8 = btoa(unescape(encodeURIComponent(jsonStr)));

      try {
        const headRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${PLUS_PLAYLIST_PATH}?_t=${Date.now()}`);
        if (headRes.ok) {
          const headJson = await headRes.json();
          plusFileSha = headJson.sha || plusFileSha;
        }
      } catch (e) {}

      const bodyObj = {
        message: 'update plus music playlist',
        content: base64Utf8
      };
      if (plusFileSha) bodyObj.sha = plusFileSha;

      const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${PLUS_PLAYLIST_PATH}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyObj)
      });
      if (!putRes.ok) {
        throw new Error('플레이리스트 저장 실패 (GitHub 토큰 권한을 확인해 주세요)');
      }
      const putJson = await putRes.json();
      if (putJson && putJson.content && putJson.content.sha) {
        plusFileSha = putJson.content.sha;
      }
    }

    async function fetchPosts(opts = {}) {
      const preservePlayer = Boolean(opts && opts.preservePlayer);

        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues.sort((a, b) => {
            const orderA = Number(extractMetaUrl(a.body, 'order', '9999'));

            return new Date(b.created_at) - new Date(a.created_at);
          });

    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {

          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

            document.body.classList.remove('plus-music-mode');

    function buildStackDOM() {
      const track = document.getElementById('stackTrack');

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
        const date = formatYYMMDD(post.created_at);
        const coverImgUrl = extractMetaUrl(post.body, 'cover', CUSTOM_ASSETS.defaultCover);
        const plusFallbackVinyl = document.body.classList.contains('plus-music-mode') ? encodeURI("./track 000.png") : CUSTOM_ASSETS.vinylDisc;
      const vinylImgUrl = extractMetaUrl(post.body, 'vinyl', plusFallbackVinyl);

        const jacketClass = coverImgUrl ? 'lp-jacket has-img' : 'lp-jacket';
        const jacketStyle = coverImgUrl ? `style="background-image: url('${coverImgUrl}')"` : '';

        const vinylClass = vinylImgUrl ? 'vinyl-disc has-img' : 'vinyl-disc';
        const vinylStyle = vinylImgUrl ? `style="background-image: url('${vinylImgUrl}')"` : '';

        slot.innerHTML = `
          <div class="${jacketClass}" ${jacketStyle}>

            <div class="lp-card-title">${post.title}</div>

          </div>
          <div class="${vinylClass}" ${vinylStyle}>
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.addEventListener('mouseenter', () => {
          if (!isPlaying && idx === currentIndex) {
            document.body.classList.add('lp-disc-extended');
          }
        });
        slot.addEventListener('mouseleave', () => {
          if (!isPlaying && idx === currentIndex) {
            document.body.classList.remove('lp-disc-extended');
          }
        });

        slot.onclick = () => {
          if (isPlaying) {
            if (idx === currentIndex) resetPlayerAnimation();
            return;
          }
          if (idx === currentIndex) {
            document.body.classList.add('lp-disc-extended');
            startPlayerSequence(slot, idx);
          } else {
            document.body.classList.remove('lp-disc-extended');
            currentIndex = idx;
            updateCarouselPositions();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });

      updateCarouselPositions();
      renderTrackList();

    function startPlayerSequence(slot, idx = currentIndex) {

      if (window._threadGifTimers) { window._threadGifTimers.forEach(t => clearInterval(t)); window._threadGifTimers = []; }

    function startProgressSimulation() {
      clearInterval(progressTimer);
      if (window._threadGifTimers) { window._threadGifTimers.forEach(t => clearInterval(t)); window._threadGifTimers = []; }
      progressTimer = setInterval(() => {
        if (isDiscPaused || !isPlaying) return;
        if (currentMediaType === 'mp3') return;
        if (currentMediaType === 'youtube') {
          if (ytPlayer && ytPlayerReady && typeof ytPlayer.getDuration === 'function') {
            const dur = ytPlayer.getDuration();
            const cur = ytPlayer.getCurrentTime();
            if (dur > 0) {
              progressPercent = Math.min(100, (cur / dur) * 100);
              const fill = document.getElementById('ctrlProgressFill');
              if (fill) fill.style.width = `${progressPercent}%`;
            }
          }
          return;
        }
        progressPercent = progressPercent >= 100 ? 0 : progressPercent + 0.5;
        const fill = document.getElementById('ctrlProgressFill');
        if (fill) fill.style.width = `${progressPercent}%`;
      }, 300);
    }

    function setDiscPlayState(playingState) {
      isDiscPaused = !playingState;
      const tonearm = document.getElementById('tonearmOverlay');
      const activeVinyl = document.getElementById('activeVinylDisc');
      const icon = document.getElementById('playPauseIcon');

      if (playingState) {
        tonearm.classList.add('playing');
        activeVinyl.classList.add('spinning');
        if (currentMediaType === 'mp3' && bgmAudio && currentBgmUrl) {
          if (isTrackEnded || bgmAudio.ended) {
            bgmAudio.currentTime = 0;
            isTrackEnded = false;
          }
          if (bgmAudio.paused) {
            bgmAudio.play().catch(() => {});
          }
        } else if (currentMediaType === 'youtube' && ytPlayer && ytPlayerReady) {
          try {
            if (isTrackEnded) {
              ytPlayer.seekTo(0, true);
              isTrackEnded = false;
            }
            ytPlayer.playVideo();
          } catch (e) {}
        }
        if (icon) icon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      } else {
        tonearm.classList.remove('playing');
        activeVinyl.classList.remove('spinning');
        if (currentMediaType === 'mp3' && bgmAudio && !bgmAudio.paused) {
          bgmAudio.pause();
        } else if (currentMediaType === 'youtube' && ytPlayer && ytPlayerReady) {
          try { ytPlayer.pauseVideo(); } catch (e) {}
        }
        if (icon) icon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    const handlePrevTrack = (e) => {
      if (e) e.stopPropagation();
      if (filteredPosts.length === 0) return;
      const prevIdx = (currentIndex - 1 + filteredPosts.length) % filteredPosts.length;
      switchTrackWhilePlaying(prevIdx);
    };

    const handleNextTrack = (e) => {
      if (e) e.stopPropagation();
      if (filteredPosts.length === 0) return;
      const nextIdx = (currentIndex + 1) % filteredPosts.length;
      switchTrackWhilePlaying(nextIdx);
    };

    const handlePlayPause = (e) => {
      if (e) e.stopPropagation();
      setDiscPlayState(isDiscPaused);
    };

    document.getElementById('btnPrevTrack').addEventListener('click', handlePrevTrack);
    document.getElementById('btnNextTrack').addEventListener('click', handleNextTrack);
    document.getElementById('btnPlayPause').addEventListener('click', handlePlayPause);

    document.getElementById('ctrlProgressWrap').addEventListener('click', (e) => {
      e.stopPropagation();
      const rect = e.currentTarget.getBoundingClientRect();
      progressPercent = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      document.getElementById('ctrlProgressFill').style.width = `${progressPercent}%`;
      if (currentMediaType === 'mp3' && bgmAudio && currentBgmUrl && bgmAudio.duration && isFinite(bgmAudio.duration)) {
        bgmAudio.currentTime = (progressPercent / 100) * bgmAudio.duration;
      } else if (currentMediaType === 'youtube' && ytPlayer && ytPlayerReady && typeof ytPlayer.getDuration === 'function') {
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          ytPlayer.seekTo((progressPercent / 100) * dur, true);

      }

    function syncPlusDynamicHeight() {

      if (!document.body.classList.contains('plus-music-mode')) {

        popover.style.setProperty('min-height', '', 'important');
        popover.style.setProperty('flex', '', 'important');

      const listHeight = Math.min(440, Math.max(44, count * 20 + 10));

      card.style.height = `${cardTotalHeight}px`;

    function switchTrackWhilePlaying(idx) {
      if (currentIndex !== idx) {
        currentIndex = idx;
        updateCarouselPositions();
      }
      openTrackDetail(idx);
    }

    function openTrackDetail(idx, opts = {}) {
      document.querySelectorAll('.mini-track-row').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      const post = filteredPosts[idx];
      if (!post) return;

      document.getElementById('ctrlTitle').textContent = post.title;
      progressPercent = 0;
      document.getElementById('ctrlProgressFill').style.width = `${progressPercent}%`;

      if (!opts.skipDiscReset) {
        loadAndPlayTrackAudio(post, true);
        setDiscPlayState(true);
        startProgressSimulation();
      }

      const vinylImgUrl = extractMetaUrl(post.body, 'vinyl', CUSTOM_ASSETS.vinylDisc);
      const activeVinyl = document.getElementById('activeVinylDisc');
      if (vinylImgUrl) {
        activeVinyl.style.backgroundImage = `url("${vinylImgUrl}")`;
        activeVinyl.classList.add('has-img');
      } else {
        activeVinyl.style.backgroundImage = '';
        activeVinyl.classList.remove('has-img');
      }

      const detailDrawer = document.getElementById('detailDrawer');
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      if (document.body.classList.contains('plus-music-mode')) {
        detailDrawer.classList.remove('open');
        return;
      }

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');
      detailDrawer.classList.add('open');

      setTimeout(() => {
        const fullBody = post.body || '';
        const parts = fullBody.split('---threads---');
        let commentPart = parts[0] || '';
        let threadPart = parts[1] || '';

        const cleanComment = commentPart
          .replace(/^cover:\s*.+$/gim, '')
          .replace(/^vinyl:\s*.+$/gim, '')
          .replace(/^bgm:\s*.+$/gim, '')
          .replace(/^yt:\s*.+$/gim, '')
          .replace(/^order:\s*.+$/gim, '')
          .trim();

        const mdImgMatch = cleanComment.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = cleanComment.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = cleanComment;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = cleanComment.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = cleanComment.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        const commentLabelBox = document.getElementById('commentLabelBox');
        const commentBody = document.getElementById('commentBody');

        if (textOnlyBody.length > 0) {
          document.getElementById('activePostTitle').textContent = `— ${post.title}`;
          commentLabelBox.style.display = 'flex';
          marked.setOptions({ breaks: true, headerIds: false, mangle: false });
          commentBody.innerHTML = marked.parse(textOnlyBody);
        } else {
          commentLabelBox.style.display = 'none';
          commentBody.innerHTML = '';
        }

        const threadsContainer = document.getElementById('threadsContainer');
        threadsContainer.innerHTML = '';

        if (window._threadGifTimers) {
          window._threadGifTimers.forEach(timerId => clearInterval(timerId));
        }
        window._threadGifTimers = [];

        if (threadPart.trim()) {
          const rawBlocks = threadPart.trim().split(/^---\s*$/gm);
          const parsedBlocks = [];
          rawBlocks.forEach((rawBlk, rawIdx) => {
            const trimmedBlk = rawBlk.trim();
            if (!trimmedBlk) return;
            const cleanBlock = trimmedBlk.replace(/^(?:threads:)?\s*/gi, '').replace(/threads:/gi, '').trim();
            if (!cleanBlock) return;
            parsedBlocks.push({ cleanBlock, rawIdx, trimmedBlk });
          });

          parsedBlocks.forEach(({ cleanBlock, rawIdx }) => {
            let extractedTitle = '';
            let bodyAfterTitle = cleanBlock;
            const titleMatch = cleanBlock.match(/^title:\s*(.+)$/im);
            if (titleMatch) {
              extractedTitle = titleMatch[1].trim();
              bodyAfterTitle = cleanBlock.replace(/^title:\s*.+$/im, '').trim();
            }

            const imgUrls = [];
            const mdRegex = /!\[.*?\]\((.*?)\)/g;
            let m;
            while ((m = mdRegex.exec(bodyAfterTitle)) !== null) {
              if (m[1]) imgUrls.push(m[1].trim());
            }
            const htmlImgRegex = /<img[^>]+src=["']([^"']+)["'][^>]*>/gi;
            let hm;
            while ((hm = htmlImgRegex.exec(bodyAfterTitle)) !== null) {
              if (hm[1]) imgUrls.push(hm[1].trim());
            }

            const textWithoutImgs = bodyAfterTitle
              .replace(/!\[.*?\]\(.*?\)/g, '')
              .replace(/<img[^>]+>/gi, '')
              .trim();

            if (!extractedTitle) {
              const firstPlainLine = textWithoutImgs.split(/\r?\n/).map(l => l.replace(/<[^>]+>/g, '').trim()).find(Boolean);
              extractedTitle = firstPlainLine ? firstPlainLine.slice(0, 40) : `Thread ${rawIdx + 1}`;
            }

            const itemEl = document.createElement('div');
            itemEl.className = 'thread-item';

            const headerRow = document.createElement('div');
            headerRow.className = 'thread-header-row';

            const titleBtn = document.createElement('button');
            titleBtn.type = 'button';
            titleBtn.className = 'thread-title-toggle';
            titleBtn.title = '클릭하여 스레드 펼치기/접기';

            const arrowSpan = document.createElement('span');
            arrowSpan.className = 'thread-expand-arrow';
            arrowSpan.textContent = '▸';

            const titleTextSpan = document.createElement('span');
            titleTextSpan.textContent = extractedTitle;

            titleBtn.appendChild(arrowSpan);
            titleBtn.appendChild(titleTextSpan);

            const dateEl = document.createElement('div');
            dateEl.className = 'thread-date';
            dateEl.title = '클릭하여 이 스레드 수정';
            dateEl.textContent = '+';

            headerRow.appendChild(titleBtn);
            headerRow.appendChild(dateEl);
            itemEl.appendChild(headerRow);

            const collapsibleBody = document.createElement('div');
            collapsibleBody.className = 'thread-collapsible-body';

            titleBtn.onclick = (ev) => {
              ev.stopPropagation();
              itemEl.classList.toggle('expanded');
            };

            const editBox = document.createElement('div');
            editBox.className = 'thread-edit-box';
            editBox.style.display = 'none';

            let editableImgs = [...imgUrls];

            const editTitleInput = document.createElement('input');
            editTitleInput.type = 'text';
            editTitleInput.className = 'thread-edit-title-input';
            editTitleInput.placeholder = '스레드 제목을 입력하세요';
            editTitleInput.value = extractedTitle;

            const editTextarea = document.createElement('textarea');
            editTextarea.className = 'thread-edit-textarea';
            editTextarea.value = textWithoutImgs;

            const imgPanel = document.createElement('div');
            imgPanel.className = 'thread-edit-img-panel';

            const imgPanelHeader = document.createElement('div');
            imgPanelHeader.className = 'thread-edit-img-header';

            const imgPanelTitle = document.createElement('span');
            imgPanelTitle.textContent = '첨부 이미지 관리';

            const uniqueInputId = `threadEditImgInput_${currentIndex}_${rawIdx}`;
            const addImgLabel = document.createElement('label');
            addImgLabel.className = 'thread-edit-add-label';
            addImgLabel.htmlFor = uniqueInputId;
            addImgLabel.textContent = '+ 이미지 추가';

            const addImgInput = document.createElement('input');
            addImgInput.type = 'file';
            addImgInput.id = uniqueInputId;
            addImgInput.accept = 'image/*';
            addImgInput.multiple = true;
            addImgInput.style.display = 'none';

            imgPanelHeader.appendChild(imgPanelTitle);
            imgPanelHeader.appendChild(addImgLabel);
            imgPanelHeader.appendChild(addImgInput);

            const imgListEl = document.createElement('div');
            imgListEl.className = 'thread-edit-img-list';

            const editStatus = document.createElement('div');
            editStatus.className = 'thread-edit-status';

            const renderEditableImgList = () => {
              imgListEl.innerHTML = '';
              if (editableImgs.length === 0) {
                const emptyNote = document.createElement('div');
                emptyNote.className = 'thread-edit-img-url';
                emptyNote.textContent = '첨부된 이미지가 없습니다.';
                imgListEl.appendChild(emptyNote);
                return;
              }
              editableImgs.forEach((imgUrl, iIdx) => {
                const row = document.createElement('div');
                row.className = 'thread-edit-img-row';

                const thumbWrap = document.createElement('div');
                thumbWrap.className = 'thread-edit-img-thumb-wrap';

                const thumb = document.createElement('img');
                thumb.className = 'thread-edit-img-thumb';
                thumb.src = imgUrl;
                thumb.alt = `첨부 이미지 ${iIdx + 1}`;

                const urlText = document.createElement('span');
                urlText.className = 'thread-edit-img-url';
                urlText.textContent = `${iIdx + 1}. ${imgUrl}`;

                thumbWrap.appendChild(thumb);
                thumbWrap.appendChild(urlText);

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'thread-edit-img-del';
                delBtn.textContent = '삭제';
                delBtn.onclick = (ev) => {
                  ev.stopPropagation();
                  editableImgs.splice(iIdx, 1);
                  renderEditableImgList();
                };

                row.appendChild(thumbWrap);
                row.appendChild(delBtn);
                imgListEl.appendChild(row);
              });
            };

            renderEditableImgList();

            addImgInput.onchange = async (ev) => {
              const files = Array.from(ev.target.files || []);
              if (files.length === 0) return;
              const token = ghTokenInput.value.trim();
              if (!token) {
                editStatus.textContent = '이미지를 업로드하려면 GitHub Token을 먼저 입력해 주세요.';
                ev.target.value = '';
                return;
              }
              addImgInput.disabled = true;
              try {
                for (let i = 0; i < files.length; i++) {
                  editStatus.textContent = `이미지 업로드 중 (${i + 1}/${files.length})...`;
                  const uploadedUrl = await uploadImageToGitHub(files[i], token);
                  editableImgs.push(uploadedUrl);
                }
                renderEditableImgList();
                editStatus.textContent = `이미지 ${files.length}장 추가됨 (저장 버튼을 누르면 반영됩니다)`;
                setTimeout(() => { editStatus.textContent = ''; }, 1800);
              } catch (err) {
                editStatus.textContent = err.message || '이미지 업로드 실패';
              } finally {
                addImgInput.disabled = false;
                ev.target.value = '';
              }

            imgPanel.appendChild(imgPanelHeader);
            imgPanel.appendChild(imgListEl);

            const editActions = document.createElement('div');
            editActions.className = 'thread-edit-actions';

            const deleteThreadBtn = document.createElement('button');
            deleteThreadBtn.type = 'button';
            deleteThreadBtn.className = 'thread-edit-delete';
            deleteThreadBtn.textContent = '스레드 삭제';

            const cancelEditBtn = document.createElement('button');
            cancelEditBtn.type = 'button';
            cancelEditBtn.className = 'thread-edit-cancel';
            cancelEditBtn.textContent = '취소';

            const saveEditBtn = document.createElement('button');
            saveEditBtn.type = 'button';
            saveEditBtn.className = 'thread-edit-save';
            saveEditBtn.textContent = '저장';

              const currentPost = filteredPosts[currentIndex];

                editStatus.textContent = '샘플 게시글은 삭제할 수 없습니다.';
                return;
              }
              if (!confirm('이 스레드를 삭제하시겠습니까?')) return;

              deleteThreadBtn.disabled = true;
              saveEditBtn.disabled = true;
              cancelEditBtn.disabled = true;
              editStatus.textContent = '스레드 삭제 중...';

              try {
                const latestBody = currentPost.body || '';
                const splitMarker = '---threads---';
                const markerIdx = latestBody.indexOf(splitMarker);
                if (markerIdx === -1) throw new Error('스레드 영역을 찾을 수 없습니다.');

                const headPart = latestBody.slice(0, markerIdx);
                const tailPart = latestBody.slice(markerIdx + splitMarker.length);
                const splitRegex = /^---\s*$/gm;
                const segments = tailPart.split(splitRegex);

                if (rawIdx < 0 || rawIdx >= segments.length) {
                  throw new Error('삭제할 스레드를 찾지 못했습니다.');
                }

                segments.splice(rawIdx, 1);
                const remainingSegments = segments.map(s => s.trim()).filter(Boolean);

                let updatedFullBody = headPart.trim();
                if (remainingSegments.length > 0) {
                  updatedFullBody += `\n\n${splitMarker}\n` + remainingSegments.join('\n---\n');
                }

                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${currentPost.number}`, {
                  method: 'PATCH',
                  headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ body: updatedFullBody })
                });

                if (!res.ok) throw new Error('스레드 삭제 저장 실패');

                editStatus.textContent = '삭제 완료!';
                isPlaying = true;
                await fetchPosts({ preservePlayer: true });
                openTrackDetail(currentIndex, { skipDiscReset: true });
              } catch (err) {
                editStatus.textContent = err.message;
                deleteThreadBtn.disabled = false;
                saveEditBtn.disabled = false;
                cancelEditBtn.disabled = false;
              }
            };

            editActions.appendChild(deleteThreadBtn);
            editActions.appendChild(cancelEditBtn);
            editActions.appendChild(saveEditBtn);
            editBox.appendChild(editTitleInput);
            editBox.appendChild(editTextarea);
            editBox.appendChild(imgPanel);
            editBox.appendChild(editActions);
            editBox.appendChild(editStatus);

            dateEl.onclick = (ev) => {
              ev.stopPropagation();
              const isHidden = editBox.style.display === 'none';
              document.querySelectorAll('.thread-edit-box').forEach(box => {
                box.style.display = 'none';
              });
              editBox.style.display = isHidden ? 'flex' : 'none';
              if (isHidden) {
                editTitleInput.value = extractedTitle;
                editTextarea.value = textWithoutImgs;
                editableImgs = [...imgUrls];
                renderEditableImgList();
                editStatus.textContent = '';
                editTextarea.focus();
              }
            };

            cancelEditBtn.onclick = (ev) => {
              ev.stopPropagation();
              editBox.style.display = 'none';
              editStatus.textContent = '';
            };

            saveEditBtn.onclick = async (ev) => {
              ev.stopPropagation();
              const token = ghTokenInput.value.trim();
              const nextText = editTextarea.value.trim();
              if (!token) {
                editStatus.textContent = '관리창 또는 하단에서 GitHub Token을 먼저 입력해 주세요.';
                return;
              }
              if (!nextText && editableImgs.length === 0) {
                editStatus.textContent = '내용이나 이미지를 하나 이상 남겨 주세요.';
                return;
              }
              const currentPost = filteredPosts[currentIndex];
              if (!currentPost || currentPost.number <= 0) {
                editStatus.textContent = '샘플 게시글은 수정할 수 없습니다.';
                return;
              }

              saveEditBtn.disabled = true;
              cancelEditBtn.disabled = true;
              editStatus.textContent = '저장 중...';

              try {
                const latestBody = currentPost.body || '';
                const splitMarker = '---threads---';
                const markerIdx = latestBody.indexOf(splitMarker);
                if (markerIdx === -1) throw new Error('스레드 영역을 찾을 수 없습니다.');

                const headPart = latestBody.slice(0, markerIdx + splitMarker.length);
                const tailPart = latestBody.slice(markerIdx + splitMarker.length);
                const splitRegex = /^---\s*$/gm;
                const segments = tailPart.split(splitRegex);

                if (rawIdx < 0 || rawIdx >= segments.length) {
                  throw new Error('수정할 스레드를 찾지 못했습니다.');
                }

                const nextTitle = (editTitleInput.value || '').trim() || `Thread ${rawIdx + 1}`;
                const mergedParts = [`title: ${nextTitle}`];
                if (nextText) mergedParts.push(nextText);
                editableImgs.forEach((u) => {
                  if (u) mergedParts.push(`![image](${u})`);
                });
                const combinedBlockText = mergedParts.join('\n\n');

                const prevSeg = segments[rawIdx];
                const leadingMatch = prevSeg.match(/^(\s*(?:threads:\s*)?)/i);
                const prefix = leadingMatch ? leadingMatch[1] : '\n';
                segments[rawIdx] = `${prefix}${combinedBlockText}`;

                const updatedFullBody = `${headPart}${segments.join('\n---\n')}`;

                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${currentPost.number}`, {
                  method: 'PATCH',
                  headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ body: updatedFullBody })
                });

                if (!res.ok) throw new Error('스레드 수정 저장 실패');

                editStatus.textContent = '수정 완료!';
                isPlaying = true;
                await fetchPosts({ preservePlayer: true });
                openTrackDetail(currentIndex, { skipDiscReset: true });
              } catch (err) {
                editStatus.textContent = err.message;
                saveEditBtn.disabled = false;
                cancelEditBtn.disabled = false;
              }
            };

            const bodyEl = document.createElement('div');
            bodyEl.className = 'thread-body';

            if (textWithoutImgs) {
              bodyEl.innerHTML = marked.parse(textWithoutImgs);
            }

            if (imgUrls.length >= 2) {
              const slideWrap = document.createElement('div');
              slideWrap.className = 'thread-slide-wrap';

              const slideTrack = document.createElement('div');
              slideTrack.className = 'thread-slide-track';

              imgUrls.forEach((u, i) => {
                const slideItem = document.createElement('div');
                slideItem.className = 'thread-slide-item';
                const slideImg = document.createElement('img');
                slideImg.src = u;
                slideImg.alt = `thread slide ${i + 1}`;
                slideItem.appendChild(slideImg);
                slideTrack.appendChild(slideItem);
              });

              const prevBtn = document.createElement('button');
              prevBtn.type = 'button';
              prevBtn.className = 'thread-slide-nav thread-slide-prev';
              prevBtn.innerHTML = '&lsaquo;';
              prevBtn.title = '이전 이미지';

              const nextBtn = document.createElement('button');
              nextBtn.type = 'button';
              nextBtn.className = 'thread-slide-nav thread-slide-next';
              nextBtn.innerHTML = '&rsaquo;';
              nextBtn.title = '다음 이미지';

              const dotsWrap = document.createElement('div');
              dotsWrap.className = 'thread-slide-dots';
              const dots = imgUrls.map((_, i) => {
                const dot = document.createElement('button');
                dot.type = 'button';
                dot.className = `thread-slide-dot ${i === 0 ? 'active' : ''}`;
                dot.title = `${i + 1}번째 이미지`;
                dotsWrap.appendChild(dot);
                return dot;
              });

              let currentSlide = 0;
              const goToSlide = (targetIdx) => {
                currentSlide = (targetIdx + imgUrls.length) % imgUrls.length;
                slideTrack.scrollTo({
                  left: currentSlide * slideTrack.clientWidth,
                  behavior: 'smooth'
                });
                dots.forEach((d, idx) => d.classList.toggle('active', idx === currentSlide));
              };

              prevBtn.onclick = (ev) => {
                ev.stopPropagation();
                goToSlide(currentSlide - 1);
              };
              nextBtn.onclick = (ev) => {
                ev.stopPropagation();
                goToSlide(currentSlide + 1);
              };
              dots.forEach((dot, i) => {
                dot.onclick = (ev) => {
                  ev.stopPropagation();
                  goToSlide(i);
                };
              });

              slideTrack.addEventListener('scroll', () => {
                if (!slideTrack.clientWidth) return;
                const idx = Math.round(slideTrack.scrollLeft / slideTrack.clientWidth);
                if (idx !== currentSlide && idx >= 0 && idx < imgUrls.length) {
                  currentSlide = idx;
                  dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
                }
              }, { passive: true });

              slideWrap.appendChild(slideTrack);
              slideWrap.appendChild(prevBtn);
              slideWrap.appendChild(nextBtn);
              slideWrap.appendChild(dotsWrap);
              bodyEl.appendChild(slideWrap);
            } else if (imgUrls.length === 1) {
              const singleImg = document.createElement('img');
              singleImg.src = imgUrls[0];
              singleImg.alt = 'thread image';
              bodyEl.appendChild(singleImg);
            }

            collapsibleBody.appendChild(bodyEl);
            itemEl.appendChild(collapsibleBody);
            itemEl.appendChild(editBox);
            threadsContainer.appendChild(itemEl);
          });
        }

                initRichToolbars();
        const plusBtn = document.getElementById('threadOpenPlusBtn');
        const writeBox = document.getElementById('threadWriteBox');
        if (plusBtn && writeBox) {
          writeBox.style.display = 'none';
          plusBtn.classList.remove('active');
          plusBtn.style.display = 'inline-flex';
          plusBtn.onclick = (ev) => {
            ev.stopPropagation();
            const isOpen = writeBox.style.display === 'flex';
            writeBox.style.display = isOpen ? 'none' : 'flex';
            plusBtn.classList.toggle('active', !isOpen);
            if (!isOpen) {
              const ta = document.getElementById('newThreadInput');
              if (ta) ta.focus();
            }
          };
        }

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 160);
    }

      const statusEl = document.getElementById('threadStatus');
      const threadTitleInput = document.getElementById('newThreadTitleInput');
      const threadInput = document.getElementById('newThreadInput');
      const threadTitle = threadTitleInput ? threadTitleInput.value.trim() : '';
      const threadText = threadInput.value.trim();

      if (!token) {
        statusEl.textContent = '타래를 작성하려면 GitHub Token을 입력해 주세요.';

      }

        statusEl.textContent = '타래 내용을 입력해 주세요.';
        return;
      }

      if (!currentPost || currentPost.number <= 0) {
        statusEl.textContent = '샘플 게시글에는 타래를 추가할 수 없습니다.';
        return;
      }

      statusEl.textContent = '타래 추가 중...';
      document.getElementById('submitThreadBtn').disabled = true;

      try {

        if (!existingBody.includes('---threads---')) {
          existingBody += '\n\n---threads---\n';
        } else {
          existingBody += '\n---\n';
        }
        const cleanThreadBody = threadText.replace(/^(?:threads:)?\s*/gi, '');
        const finalThreadTitle = threadTitle || cleanThreadBody.replace(/<[^>]+>/g, '').trim().slice(0, 40) || '새 스레드';
        existingBody += `title: ${finalThreadTitle}\n${cleanThreadBody}`;

        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${currentPost.number}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ body: existingBody })
        });

        if (!res.ok) throw new Error('타래 추가 실패');

      document.querySelectorAll('.rich-live-surface').forEach(s => { if (s.dataset.forTextarea === 'postBodyInput' || s.dataset.forTextarea === 'newThreadInput') { const srcTa = document.getElementById(s.dataset.forTextarea); if (srcTa && window.marked) s.innerHTML = srcTa.value.trim() ? window.marked.parse(srcTa.value.trim()) : ''; } });
        document.getElementById('submitThreadBtn').disabled = false;
        isPlaying = true;
        await fetchPosts({ preservePlayer: true });
        openTrackDetail(currentIndex, { skipDiscReset: true });
        setTimeout(() => { statusEl.textContent = ''; }, 1200);
      } catch (err) {
        statusEl.textContent = err.message;
        document.getElementById('submitThreadBtn').disabled = false;
      }

        }
        statusEl.textContent = `이미지 ${files.length}장 첨부 완료!`;

        setTimeout(() => { statusEl.textContent = ''; }, 1200);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    };

    function updateCarouselPositions() {
      const isMobile = window.innerWidth <= 680;
      const persp = isMobile ? 620 : 750;
      const baseShift = isMobile ? 92 : 112;
      const stepShift = isMobile ? 26 : 34;
      const baseDepth = isMobile ? -48 : -55;
      const stepDepth = isMobile ? -32 : -38;
      const sideAngle = isMobile ? 54 : 58;

      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `perspective(${persp}px) translate3d(0px, 0px, 0px) rotateY(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else {
          slot.classList.remove('active', 'on-player', 'spinning');
          const sign = offset > 0 ? 1 : -1;
          const abs = Math.abs(offset);
          const translateX = sign * (baseShift + abs * stepShift);
          const translateZ = baseDepth + abs * stepDepth;
          const rotateY = -sign * sideAngle;

          slot.style.transform = `perspective(${persp}px) translate3d(${translateX}px, 0px, ${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 25 - abs);
          slot.style.opacity = abs > 2 ? 0 : Math.max(0.45, 1 - abs * 0.25);
          slot.style.pointerEvents = abs > 2 ? 'none' : 'auto';
        }
      });
    }

    function stepTrack(direction) {
      if (isPlaying || isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        updateCarouselPositions();
        setTimeout(() => { isScrolling = false; }, 320);
      }
    }

    carouselStage.addEventListener('wheel', (e) => {
      if (isPlaying) return;
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 10) return;
      stepTrack(delta > 0 ? 1 : -1);
    }, { passive: false });

    let touchStartX = 0;
    carouselStage.addEventListener('touchstart', (e) => {
      if (isPlaying) return;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    carouselStage.addEventListener('touchend', (e) => {
      if (isPlaying) return;
      const diffX = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 30) {
        stepTrack(diffX > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (isPlaying || document.getElementById('writerOverlay').classList.contains('open')) return;
      if (e.key === 'ArrowLeft') stepTrack(-1);

          const cleanBody = (post.body || '').replace(/^order:\s*.+$/gim, '').trim();

${cleanBody}`;
          post.body = updatedBody;

    async function uploadImageToGitHub(file, token) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const base64Content = reader.result.split(',')[1];
            const ext = file.name.split('.').pop() || 'png';
            const fileName = `uploads/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;

            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
              method: 'PUT',
              headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: `upload image`, content: base64Content })
            });

            if (!res.ok) throw new Error('업로드 실패');
            const data = await res.json();
            resolve(data.content.download_url);
          } catch (err) { reject(err); }
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      ];
      const sizeOptions = [
        { label: '크기', value: '' },
        { label: '6pt', value: '6pt' },
        { label: '7pt', value: '7pt' },
        { label: '8pt', value: '8pt' },
