<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVES</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================
       [상단 헤더] 페이지 전체 정중앙 정렬
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 50;
    }
    .global-header h1 {
      font-weight: 300;
      font-size: 2.3rem;
      letter-spacing: 0.2em;
      margin-bottom: 14px;
      color: var(--text-main);
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       메인 컨테이너
       ========================================= */
    .main-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================================
       [상단 스테이지] 중앙 대기 -> LP 선택 시 왼쪽 슬라이딩 + 우측 TRACK 등장
       ========================================= */
    .showcase-row {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      position: relative;
    }

    /* 플레이어 + 커버 스테이지 (초기엔 정중앙, 선택 시 왼쪽으로 부드럽게 이동) */
    .player-stage {
      position: relative;
      width: 260px;
      height: 290px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 카드형 LP 커버 덱 */
    .carousel-stage {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 900px;
      touch-action: none;
      z-index: 20;
    }

    .stack-track {
      position: relative;
      width: 224px;
      height: 224px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 224px;
      height: 224px;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 26px 18px;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease, box-shadow 0.4s ease;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    .lp-slot.flip-next .lp-jacket {
      animation: flipCardNext 0.62s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .lp-slot.flip-prev .lp-jacket {
      animation: flipCardPrev 0.62s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes flipCardNext {
      0%   { transform: rotateY(0deg) scale(1); }
      38%  { transform: rotateY(-34deg) rotateZ(-2.5deg) translateZ(24px) scale(1.03); }
      100% { transform: rotateY(0deg) scale(1); }
    }

    @keyframes flipCardPrev {
      0%   { transform: rotateY(0deg) scale(1); }
      38%  { transform: rotateY(34deg) rotateZ(2.5deg) translateZ(24px) scale(1.03); }
      100% { transform: rotateY(0deg) scale(1); }
    }

    .carousel-stage.deck-up .lp-jacket {
      transform: translateY(-190px);
      opacity: 0;
      pointer-events: none;
    }

    .lp-card-label {
      font-size: 0.75rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.06rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.72rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .vinyl-disc {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 204px;
      height: 204px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background: #ffffff;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.55);
    }

    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange);
    }

    .sliding-text {
      font-size: 0.62rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(42px);
    }

    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(58px);
    }

    .lp-slot.active.on-player .vinyl-disc {
      transform: translateY(20px);
    }
    .lp-slot.active.spinning .vinyl-disc {
      animation: spinVinyl 4s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: translateY(20px) rotate(0deg); }
      to   { transform: translateY(20px) rotate(360deg); }
    }

    /* LP 플레이어 본체 및 톤암 레이어 */
    .turntable-box {
      position: absolute;
      top: 20px;
      left: 50%;
      margin-left: -122px;
      width: 244px;
      height: 244px;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }

    .turntable-box.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .tonearm-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      margin-left: -122px;
      width: 244px;
      height: 244px;
      z-index: 35;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .tonearm-overlay.visible {
      opacity: 1;
    }

    .turntable-spindle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }

    .tonearm-base {
      position: absolute;
      bottom: 20px;
      left: 18px;
      width: 14px;
      height: 22px;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }

    .tonearm-stick {
      position: absolute;
      bottom: 36px;
      left: 24px;
      width: 1.5px;
      height: 148px;
      background: var(--line-blue);
      transform-origin: bottom center;
      transform: rotate(8deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tonearm-stick::after {
      content: "";
      position: absolute;
      top: -4px;
      left: -3.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }

    .tonearm-overlay.playing .tonearm-stick {
      transform: rotate(38deg);
    }

    /* =========================================
       ★ 우측 TRACK 드로어 (플레이어가 왼쪽으로 밀리면서 우측에서 슬라이딩 오픈) ★
       ========================================= */
    .track-drawer {
      width: 0;
      opacity: 0;
      overflow: hidden;
      margin-left: 0;
      transform: translateX(-18px);
      transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  margin-left 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.55s ease 0.15s,
                  transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
    }

    .showcase-row.is-open .track-drawer {
      width: 280px;
      margin-left: 44px;
      opacity: 1;
      transform: translateX(0);
    }

    .track-inner {
      width: 280px; /* 슬라이딩 시 텍스트가 찌그러지지 않도록 내부 폭 고정 */
      padding-top: 22px;
    }

    .track-box-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
      color: var(--text-main);
    }
    .track-scroll-wrapper {
      position: relative;
      height: 210px;
    }
    .track-list {
      list-style: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 2px;
      padding-bottom: 64px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .track-list::-webkit-scrollbar {
      display: none;
    }

    .track-fade-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.88) 60%,
        #ffffff 100%
      );
      pointer-events: none;
    }

    .track-item {
      font-size: 0.88rem;
      line-height: 1.7;
      padding: 2px 0;
      color: var(--text-sub);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .track-item:hover, .track-item.active {
      color: var(--line-orange);
      font-weight: 500;
      transform: translateX(4px);
    }

    /* =========================================
       [하단 영역] TRACK 선택 시 슬라이딩 오픈되는 IMAGE & COMMENT
       ========================================= */
    .detail-drawer {
      width: 100%;
      max-width: 584px; /* 상단 플레이어(260) + 간격(44) + 트랙(280) 전체 너비와 정밀 정렬 */
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transform: translateY(-14px);
      transition: max-height 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.6s ease,
                  margin-top 0.5s ease,
                  transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .detail-drawer.open {
      max-height: 5000px;
      opacity: 1;
      margin-top: 28px;
      transform: translateY(0);
    }

    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-top: 4px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .image-frame {
      width: 100%;
      min-height: 320px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    .comment-section {
      width: 100%;
    }
    .comment-label {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.98rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    /* 모바일 소형 화면에서도 플레이어 좌측 + TRACK 우측 구도가 깨지지 않도록 비율 최적화 */
    @media (max-width: 640px) {
      .main-container { padding: 12px 14px 80px; }
      .showcase-row { min-height: 250px; }
      .player-stage {
        width: 200px;
        height: 240px;
        transform-origin: top center;
      }
      .showcase-row.is-open .player-stage {
        transform: scale(0.82);
        margin-right: -18px;
      }
      .showcase-row.is-open .track-drawer {
        width: 165px;
        margin-left: 14px;
      }
      .track-inner { width: 165px; padding-top: 12px; }
      .track-scroll-wrapper { height: 175px; }
      .detail-drawer { max-width: 100%; }
    }
  </style>
</head>
<body>

  <header class="global-header">
    <h1>ARCHIVES</h1>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-label="ALL">ALL</button>
      <button class="filter-btn" data-label="MADE">MADE</button>
      <button class="filter-btn" data-label="AND">AND</button>
    </div>
  </header>

  <main class="main-container">
    <!-- 상단 행: 중앙 LP 커버 -> 클릭 시 플레이어 왼쪽 이동 + 우측 TRACK 슬라이딩 오픈 -->
    <div class="showcase-row" id="showcaseRow">
      <div class="player-stage">
        <div class="carousel-stage" id="carouselStage" title="스크롤/스와이프로 카드 넘기기 · 클릭하여 재생">
          <div class="stack-track" id="stackTrack"></div>
        </div>

        <div class="turntable-box" id="turntableBox" title="클릭하여 커버 덱으로 돌아가기"></div>

        <div class="tonearm-overlay" id="tonearmOverlay">
          <div class="turntable-spindle"></div>
          <div class="tonearm-base"></div>
          <div class="tonearm-stick"></div>
        </div>
      </div>

      <!-- 우측에서 슬라이딩되어 나오는 TRACK 메뉴 -->
      <aside class="track-drawer" id="trackDrawer">
        <div class="track-inner">
          <div class="track-box-title">TRACK</div>
          <div class="track-scroll-wrapper">
            <ul class="track-list" id="trackList"></ul>
            <div class="track-fade-overlay"></div>
          </div>
        </div>
      </aside>
    </div>

    <!-- 하단 영역: TRACK 선택 시 슬라이딩 오픈되는 IMAGE & COMMENT -->
    <section class="detail-drawer" id="detailDrawer">
      <div class="content-stage">
        <div class="fade-section" id="imageSection">
          <div class="image-frame" id="imageFrame">
            <div class="image-placeholder">IMAGE</div>
          </div>
        </div>

        <div class="fade-section comment-section" id="commentSection">
          <div class="comment-label">
            COMMENT <span id="activePostTitle"></span>
          </div>
          <div class="comment-body" id="commentBody"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];

    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    async function fetchPosts() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues;
        } else {
          allPosts = [
            { number: 1, title: "SAMPLE 01", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "1단계: 중앙 LP 커버를 클릭하면 플레이어가 왼쪽으로 슬라이딩되고 우측에서 TRACK 메뉴가 열립니다.\n2단계: TRACK 목록에서 곡을 선택하면 하단 IMAGE와 COMMENT가 펼쳐집니다.\n\n깃허브 `Issues`에 `MADE` 또는 `AND` 라벨을 달아 글을 올리면 자동으로 반영됩니다." },
            { number: 2, title: "SAMPLE 02", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "두 번째 트랙입니다." },
            { number: 3, title: "SAMPLE 03", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "세 번째 트랙 코멘트입니다." },
            { number: 4, title: "SAMPLE 04", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "네 번째 트랙 코멘트입니다." },
            { number: 5, title: "SAMPLE 05", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "다섯 번째 트랙 코멘트입니다." },
            { number: 6, title: "SAMPLE 06", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "여섯 번째 트랙 코멘트입니다." }
          ];
        }
        filteredPosts = [...allPosts];
        bindFilterButtons();
        rebuildAll();
      } catch (err) {
        console.error(err);
      }
    }

    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label;
          if (label === 'ALL') {
            filteredPosts = [...allPosts];
          } else {
            filteredPosts = allPosts.filter(p => p.labels.some(l => l.name.toUpperCase() === label));
          }
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      resetPlayerAnimation();
      buildStackDOM();
      renderTrackList();
      updateCarouselPositions(0);
    }

    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
        const date = formatYYMMDD(post.created_at);

        slot.innerHTML = `
          <div class="lp-jacket">
            <div class="lp-card-label">${labelName}</div>
            <div class="lp-card-title">${post.title}</div>
            <div class="lp-card-date">${date}</div>
          </div>
          <div class="vinyl-disc">
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (idx === currentIndex) {
            if (isPlaying) {
              resetPlayerAnimation();
            } else {
              startPlayerSequence(slot);
            }
          } else {
            const dir = idx > currentIndex ? 1 : -1;
            currentIndex = idx;
            resetPlayerAnimation();
            updateCarouselPositions(dir);
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
    }

    // 1단계: LP 선택 -> 플레이어가 왼쪽으로 이동하면서 우측에서 TRACK 메뉴 슬라이딩 등장
    function startPlayerSequence(slot) {
      resetPlayerAnimation();
      isPlaying = true;

      const showcaseRow = document.getElementById('showcaseRow');
      const turntable = document.getElementById('turntableBox');
      const tonearm = document.getElementById('tonearmOverlay');
      const stage = document.getElementById('carouselStage');

      slot.classList.add('on-player');

      const t1 = setTimeout(() => {
        turntable.classList.add('visible');
        tonearm.classList.add('visible');
        stage.classList.add('deck-up');
        showcaseRow.classList.add('is-open'); // 플레이어 좌측 이동 + 우측 TRACK 오픈 동시 실행
      }, 220);

      const t2 = setTimeout(() => {
        tonearm.classList.add('playing');
        slot.classList.add('spinning');
      }, 760);

      playTimers.push(t1, t2);
    }

    function resetPlayerAnimation() {
      playTimers.forEach(t => clearTimeout(t));
      playTimers = [];
      isPlaying = false;

      document.getElementById('showcaseRow').classList.remove('is-open');
      document.getElementById('turntableBox').classList.remove('visible');
      document.getElementById('tonearmOverlay').classList.remove('visible', 'playing');
      document.getElementById('carouselStage').classList.remove('deck-up');
      document.getElementById('detailDrawer').classList.remove('open');
      document.getElementById('imageSection').classList.remove('visible');
      document.getElementById('commentSection').classList.remove('visible');

      document.querySelectorAll('.track-item').forEach(el => el.classList.remove('active'));
      slotElements.forEach(s => {
        s.classList.remove('on-player', 'spinning');
      });
    }

    document.getElementById('turntableBox').onclick = () => {
      if (isPlaying) resetPlayerAnimation();
    };

    function renderTrackList() {
      const trackList = document.getElementById('trackList');
      if (filteredPosts.length === 0) {
        trackList.innerHTML = `<li class="track-item">등록된 트랙이 없습니다.</li>`;
        return;
      }
      trackList.innerHTML = filteredPosts.map((post, idx) => `
        <li class="track-item" data-idx="${idx}">
          - ${idx + 1}. ${post.title}
        </li>
      `).join('');

      trackList.querySelectorAll('.track-item').forEach(item => {
        item.onclick = () => {
          const clickedIdx = Number(item.dataset.idx);
          selectTrackAndOpenDetail(clickedIdx);
        };
      });
    }

    // 2단계: 우측 TRACK 항목 클릭 시 하단 IMAGE & COMMENT 슬라이딩 오픈
    function selectTrackAndOpenDetail(idx) {
      if (currentIndex !== idx) {
        const dir = idx > currentIndex ? 1 : -1;
        currentIndex = idx;
        updateCarouselPositions(dir);
        if (slotElements[currentIndex]) {
          slotElements[currentIndex].classList.add('on-player', 'spinning');
        }
      }

      document.querySelectorAll('.track-item').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      const post = filteredPosts[idx];
      if (!post) return;

      const detailDrawer = document.getElementById('detailDrawer');
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');
      detailDrawer.classList.add('open');

      setTimeout(() => {
        const rawBody = post.body || '';
        const mdImgMatch = rawBody.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = rawBody.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = rawBody;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        document.getElementById('activePostTitle').textContent = `— ${post.title}`;
        marked.setOptions({ breaks: true });
        document.getElementById('commentBody').innerHTML = marked.parse(textOnlyBody || '(작성된 코멘트가 없습니다.)');

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 150);
    }

    function updateCarouselPositions(direction = 0) {
      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;

        slot.classList.remove('flip-next', 'flip-prev');
        if (direction !== 0 && Math.abs(offset) <= 1) {
          void slot.offsetWidth;
          slot.classList.add(direction > 0 ? 'flip-next' : 'flip-prev');
        }

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `translateX(0px) translateZ(0px) rotateY(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else {
          slot.classList.remove('active', 'on-player', 'spinning');
          const sign = offset > 0 ? 1 : -1;
          const abs = Math.abs(offset);
          const translateX = sign * (88 + abs * 36);
          const translateZ = -70 - abs * 48;
          const rotateY = -sign * 56;

          slot.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 25 - abs);
          slot.style.opacity = abs > 3 ? 0 : Math.max(0.32, 1 - abs * 0.22);
          slot.style.pointerEvents = abs > 3 ? 'none' : 'auto';
        }
      });
    }

    function stepTrack(direction) {
      if (isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        resetPlayerAnimation();
        updateCarouselPositions(direction);
        setTimeout(() => { isScrolling = false; }, 320);
      }
    }

    const carouselStage = document.getElementById('carouselStage');

    carouselStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 10) return;
      stepTrack(delta > 0 ? 1 : -1);
    }, { passive: false });

    let touchStartX = 0;
    carouselStage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    carouselStage.addEventListener('touchend', (e) => {
      const diffX = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 30) {
        stepTrack(diffX > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') stepTrack(-1);
      if (e.key === 'ArrowRight') stepTrack(1);
    });

    fetchPosts();
  </script>
</body>
</html>
