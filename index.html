<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love the Loveless</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #555555;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Gowun Batang', serif;
      min-height: 100vh;
    }

    .page-shell {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    /* 이미지 및 커버 우클릭/드래그 차단 */
    img, .lp-jacket, .vinyl-disc, .turntable-box {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    .lp-slot, .carousel-stage, .ctrl-buttons, .player-control-right, .global-header, .writer-overlay {
      pointer-events: auto;
    }

    /* =========================================
       [상단 헤더] Love the Loveless (Monsieur La Doulaise)
       ========================================= */
    .global-header {
      width: 100%;
      text-align: center;
      padding: 40px 20px 20px;
      position: relative;
      z-index: 50;
    }
    .global-header h1 {
      font-family: 'Monsieur La Doulaise', cursive;
      font-weight: 400;
      font-size: 2.8rem;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }
    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
      font-family: 'Gowun Batang', serif;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* =========================================
       메인 컨테이너
       ========================================= */
    .main-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 20px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .showcase-row {
      width: 100%;
      min-height: 290px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .player-stage {
      position: relative;
      width: 240px;
      height: 275px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .player-active-row {
      display: none;
      width: 100%;
      max-width: 540px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 10px;
    }
    .showcase-row.is-open .player-stage {
      display: none;
    }
    .showcase-row.is-open .player-active-row {
      display: flex;
    }

    .active-turntable-stage {
      position: relative;
      width: 220px;
      height: 220px;
      flex-shrink: 0;
    }

    /* =========================================
       커버플로우(Cover Flow) 3D 스테이지
       ========================================= */
    .carousel-stage {
      position: absolute;
      top: 10px;
      left: 50%;
      margin-left: -260px;
      width: 520px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      perspective: 750px;
      touch-action: none;
      z-index: 20;
    }

    .stack-track {
      position: relative;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 210px;
      height: 210px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--line-blue);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    .lp-jacket.has-img {
      border: none;
    }
    .lp-jacket.has-img .lp-card-label,
    .lp-jacket.has-img .lp-card-title,
    .lp-jacket.has-img .lp-card-date {
      display: none;
    }

    .lp-card-label {
      font-size: 0.8rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.78rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .vinyl-disc {
      position: absolute;
      top: 9px;
      left: 9px;
      width: 192px;
      height: 192px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 13px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    .vinyl-disc.has-img {
      border: none;
      background-color: transparent;
    }
    .vinyl-disc.has-img::before,
    .vinyl-disc.has-img::after,
    .vinyl-disc.has-img .sliding-text {
      display: none;
    }

    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.55);
    }

    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange);
    }

    .sliding-text {
      font-size: 0.65rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(40px);
    }

    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(56px);
    }

    /* =========================================
       재생 모드 턴테이블 본체 및 톤암
       ========================================= */
    .turntable-box {
      position: absolute;
      inset: 0;
      width: 220px;
      height: 220px;
      border: 1.5px solid var(--line-blue);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 10;
      cursor: pointer;
    }
    .turntable-box.has-img {
      border: none;
      background-color: transparent;
    }

    .active-vinyl-disc {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 184px;
      height: 184px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      z-index: 12;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .active-vinyl-disc.has-img {
      border: none;
      background-color: transparent;
    }
    .active-vinyl-disc.spinning {
      animation: spinActiveVinyl 4s linear infinite;
    }
    @keyframes spinActiveVinyl {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .tonearm-overlay {
      position: absolute;
      inset: 0;
      width: 220px;
      height: 220px;
      z-index: 35;
      pointer-events: none;
    }
    .turntable-spindle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
    }
    .tonearm-custom-img {
      display: none;
      position: absolute;
      bottom: 22px;
      left: 18px;
      width: 55px;
      height: 130px;
      object-fit: contain;
      transform-origin: 46% 90%;
      transform: rotate(0deg);
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tonearm-overlay.has-img .turntable-spindle {
      display: none;
    }
    .tonearm-overlay.has-img .tonearm-custom-img {
      display: block;
    }
    .tonearm-overlay.playing .tonearm-custom-img {
      transform: rotate(22deg);
    }

    /* =========================================
       우측 뮤직 컨트롤 카드 (시안 일러스트 5번과 100% 일치하는 가로 슬림형 + 상시 스크롤 구조)
       ========================================= */
    .player-control-card {
      width: 320px;
      height: 215px;
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      flex-shrink: 0;
    }

    .ctrl-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .ctrl-meta {
      overflow: hidden;
      width: 100%;
    }

    .ctrl-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ctrl-progress-wrap {
      width: 100%;
      height: 4px;
      background: #e6e8ec;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .ctrl-progress-fill {
      width: 32%;
      height: 100%;
      background: #C6D5FF;
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .ctrl-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .ctrl-btn {
      background: none;
      border: 1.5px solid transparent;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #111111;
      transition: 0.2s;
    }

    .ctrl-btn:hover {
      background: #f5f6f8;
    }

    .ctrl-btn.next-ring {
      border-color: #c8ccd4;
    }

    .ctrl-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* 트랙 목록: 처음부터 항상 열려 있고, 2개 트랙이 선명하게 보이며 스크롤 제공[cite: 36] */
    .mini-track-popover {
      max-height: 52px !important;
      opacity: 1 !important;
      overflow-y: auto !important;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 1px solid #eeeeee;
      padding-top: 5px;
    }
    .mini-track-popover::-webkit-scrollbar {
      width: 4px;
    }
    .mini-track-popover::-webkit-scrollbar-thumb {
      background: #cccccc;
      border-radius: 99px;
    }
    .mini-track-row {
      font-size: 0.78rem;
      color: #222222 !important; /* 텍스트 증발 및 흐림 현상 원천 방지 */
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 1 !important;
    }
    .mini-track-row:hover, .mini-track-row.active {
      background: #f4f7ff;
      color: var(--line-blue) !important;
      font-weight: 600;
    }

    /* =========================================
       [하단 영역] IMAGE & COMMENT & THREADS
       ========================================= */
    .detail-drawer {
      width: 100%;
      max-width: 546px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transform: translateY(-14px);
      transition: max-height 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.65s ease,
                  margin-top 0.55s ease,
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .detail-drawer.open {
      max-height: 5000px;
      opacity: 1;
      margin-top: 24px;
      transform: translateY(0);
    }

    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding-top: 4px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .image-frame {
      width: 100%;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    .comment-section {
      width: 100%;
    }
    .comment-label {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-size: 1.02rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    .threads-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
      padding-top: 0;
    }

    .thread-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thread-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .thread-body {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-main);
      word-break: keep-all;
    }
    .thread-body p { margin-bottom: 1em; }
    .thread-body img { max-width: 100%; margin: 10px 0; }

    .thread-write-box {
      margin-top: 28px;
      border: 1px solid #e5e5e5;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }
    .thread-write-box textarea {
      width: 100%;
      min-height: 80px;
      border: 1px solid #dcdcdc;
      padding: 8px 10px;
      font-family: 'Gowun Batang', serif;
      font-size: 0.9rem;
      outline: none;
    }
    .thread-write-box textarea:focus { border-color: var(--line-blue); }
    .thread-write-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .thread-submit-btn {
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'Gowun Batang', serif;
    }
    .thread-submit-btn:disabled { opacity: 0.5; cursor: default; }

    /* =========================================
       전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달 UI
       ========================================= */
    .writer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .writer-overlay.open {
      display: flex;
    }
    .writer-box {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1.5px solid var(--line-blue);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .writer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    .writer-header h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .writer-close {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-sub);
    }

    .admin-tabs {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      gap: 8px;
    }
    .admin-tab {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 4px;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Gowun Batang', serif;
    }
    .admin-tab.active {
      color: var(--text-main);
      font-weight: 600;
      border-bottom-color: var(--line-blue);
    }

    .writer-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .writer-field label {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
    }
    .writer-input, .writer-textarea {
      width: 100%;
      border: 1px solid #dcdcdc;
      padding: 10px 12px;
      font-family: 'Gowun Batang', serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .writer-input:focus, .writer-textarea:focus {
      border-color: var(--line-blue);
    }
    .writer-textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }
    .cat-select-row {
      display: flex;
      gap: 8px;
    }
    .cat-option {
      flex: 1;
      padding: 8px;
      text-align: center;
      border: 1px solid #dcdcdc;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-sub);
      font-family: 'Gowun Batang', serif;
    }
    .cat-option.selected {
      border-color: var(--line-orange);
      color: var(--line-orange);
      font-weight: 600;
    }

    .edit-mode-banner {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #f4f7ff;
      border: 1px solid var(--line-blue);
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--line-blue);
    }
    .edit-mode-banner.active {
      display: flex;
    }
    .cancel-edit-btn {
      background: none;
      border: 1px solid var(--line-blue);
      color: var(--line-blue);
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: 'Gowun Batang', serif;
    }

    .existing-asset-note {
      font-size: 0.75rem;
      color: var(--line-blue);
    }

    .manage-list {
      display: none;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
    }
    .manage-list.active {
      display: flex;
    }
    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e8e8e8;
      padding: 10px 12px;
      gap: 10px;
    }
    .manage-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .manage-item-title {
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .manage-item-meta {
      font-size: 0.76rem;
      color: var(--text-sub);
    }
    .manage-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .btn-order {
      padding: 5px 7px;
      font-size: 0.75rem;
      border: 1px solid #dcdcdc;
      background: #fff;
      cursor: pointer;
      color: var(--text-sub);
      font-family: 'Gowun Batang', serif;
    }
    .btn-order:hover:not(:disabled) {
      border-color: var(--text-main);
      color: var(--text-main);
    }
    .btn-order:disabled {
      opacity: 0.3;
      cursor: default;
    }

<body>

  <div class="page-shell">

  </div>

  <!-- 전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달 -->
  <div class="writer-overlay" id="writerOverlay">
    <div class="writer-box">
      <div class="writer-header">
        <h2>TRACK MANAGER</h2>
        <button class="writer-close" id="closeWriter">✕</button>
      </div>

      <div class="writer-field">

      <div class="writer-form-body" id="writeFormPanel">

          <span id="editModeText">기존 트랙 수정 중</span>

            <div class="cat-option" data-cat="LOVE">LOVE</div>

        <div class="writer-field">
          <label>트랙 제목 (TITLE)</label>
          <input type="text" class="writer-input" id="postTitleInput" placeholder="제목을 입력하세요" />
        </div>

        <div class="writer-field">
          <label>① LP 커버 이미지 (420×420 권장)</label>
          <span class="existing-asset-note" id="existingCoverNote"></span>
          <input type="file" id="coverFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>② LP 알판 이미지 (384×384 투명 PNG 권장)</label>
          <span class="existing-asset-note" id="existingVinylNote"></span>
          <input type="file" id="vinylFileInput" accept="image/*" />
        </div>

        <div class="writer-field">
          <label>③ 본문 IMAGE 첨부</label>

        <div class="writer-field">
          <label>COMMENT (메인 코멘트 본문 — 비워두면 출력되지 않습니다)</label>
          <textarea class="writer-textarea" id="postBodyInput" placeholder="코멘트 내용을 입력하세요 (선택 사항)"></textarea>
        </div>

        <button class="writer-submit" id="publishBtn">발행하기 (PUBLISH)</button>
      </div>

      <div class="manage-list" id="manageListPanel"></div>

      <div class="writer-status" id="writerStatus"></div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    const CUSTOM_ASSETS = {
      defaultCover: "",
      vinylDisc: "",
      turntable: "./player.png",
      tonearm: "./tonearm.png"
    };

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];
    let selectedCategory = "MADE";

    let isDiscPaused = false;
    let progressTimer = null;
    let progressPercent = 28;

    let editingIssueNumber = null;
    let preservedAssets = { cover: "", vinyl: "", bodyImg: "", order: "" };

    function applyCustomPlayerAssets() {
      const turntableBox = document.getElementById('turntableBox');
      const tonearmImg = document.getElementById('tonearmImg');

      if (CUSTOM_ASSETS.turntable) {
        turntableBox.style.backgroundImage = `url("${CUSTOM_ASSETS.turntable}")`;
        turntableBox.classList.add('has-img');
      }
      if (CUSTOM_ASSETS.tonearm) {
        tonearmImg.src = CUSTOM_ASSETS.tonearm;
        document.getElementById('tonearmOverlay').classList.add('has-img');
      }
    }

    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    function extractMetaUrl(bodyText, key, fallback) {
      if (!bodyText) return fallback;
      const regex = new RegExp(`^${key}:\\s*(.+)$`, 'im');
      const match = bodyText.match(regex);
      return match ? match[1].trim() : fallback;
    }

    function matchesCategory(post, label) {
      if (label === 'ALL') return true;
      if (!Array.isArray(post.labels)) return false;
      return post.labels.some(l => {
        const name = l.name.trim().toUpperCase();
        if (label === 'LOVE') return name === 'LOVE' || name === 'AND';
        return name === label;
      });
    }

    async function fetchPosts() {
      applyCustomPlayerAssets();
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100&_t=${Date.now()}`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues.sort((a, b) => {
            const orderA = Number(extractMetaUrl(a.body, 'order', '9999'));
            const orderB = Number(extractMetaUrl(b.body, 'order', '9999'));
            if (orderA !== orderB) return orderA - orderB;
            return new Date(b.created_at) - new Date(a.created_at);
          });
        } else {
          allPosts = [
            { number: 0, title: "SAMPLE 01", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "상단 Love the Loveless 제목을 더블클릭(또는 주소 뒤에 #write 입력)하면 글쓰기·순서변경·수정·삭제 창이 열립니다." }
          ];
        }

        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.label?.trim().toUpperCase() || 'ALL';
        filteredPosts = allPosts.filter(p => matchesCategory(p, activeFilter));

        bindFilterButtons();
        rebuildAll();
        renderManageList();

        const forceSync3D = () => {
          updateCarouselPositions();
        };

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(forceSync3D);
        }
        window.addEventListener('load', forceSync3D);
        window.addEventListener('resize', forceSync3D);
        setTimeout(forceSync3D, 50);
        setTimeout(forceSync3D, 200);
        setTimeout(forceSync3D, 600);
      } catch (err) {
        console.error(err);
      }
    }

    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label.trim().toUpperCase();
          filteredPosts = allPosts.filter(p => matchesCategory(p, label));
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      resetPlayerAnimation();
      buildStackDOM();
      renderTrackList();
      updateCarouselPositions();
    }

    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
        const date = formatYYMMDD(post.created_at);
        const coverImgUrl = extractMetaUrl(post.body, 'cover', CUSTOM_ASSETS.defaultCover);
        const vinylImgUrl = extractMetaUrl(post.body, 'vinyl', CUSTOM_ASSETS.vinylDisc);

        const jacketClass = coverImgUrl ? 'lp-jacket has-img' : 'lp-jacket';
        const jacketStyle = coverImgUrl ? `style="background-image: url('${coverImgUrl}')"` : '';

        const vinylClass = vinylImgUrl ? 'vinyl-disc has-img' : 'vinyl-disc';
        const vinylStyle = vinylImgUrl ? `style="background-image: url('${vinylImgUrl}')"` : '';

        slot.innerHTML = `
          <div class="${jacketClass}" ${jacketStyle}>
            <div class="lp-card-label">${labelName}</div>
            <div class="lp-card-title">${post.title}</div>
            <div class="lp-card-date">${date}</div>
          </div>
          <div class="${vinylClass}" ${vinylStyle}>
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (isPlaying) {
            if (idx === currentIndex) resetPlayerAnimation();
            return;
          }

          if (idx === currentIndex) {
            startPlayerSequence(slot, idx);
          } else {
            currentIndex = idx;
            updateCarouselPositions();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
      
      updateCarouselPositions();
      renderTrackList(); // 데이터 로드 직후 트랙 리스트 강제 렌더링
    }

    function startPlayerSequence(slot, idx = currentIndex) {
      resetPlayerAnimation();
      isPlaying = true;

      const showcaseRow = document.getElementById('showcaseRow');
      const activeVinyl = document.getElementById('activeVinylDisc');
      const tonearm = document.getElementById('tonearmOverlay');

      const post = filteredPosts[idx];
      const vinylImgUrl = extractMetaUrl(post.body, 'vinyl', CUSTOM_ASSETS.vinylDisc);
      if (vinylImgUrl) {
        activeVinyl.style.backgroundImage = `url("${vinylImgUrl}")`;
        activeVinyl.classList.add('has-img');
      } else {
        activeVinyl.style.backgroundImage = '';
        activeVinyl.classList.remove('has-img');
      }

      showcaseRow.classList.add('is-open');
      openTrackDetail(idx);

      const t2 = setTimeout(() => {
        tonearm.classList.add('playing');
        activeVinyl.classList.add('spinning');
      }, 300);

      playTimers.push(t2);
    }

    function resetPlayerAnimation() {
      playTimers.forEach(t => clearTimeout(t));
      playTimers = [];
      clearInterval(progressTimer);
      isPlaying = false;
      isDiscPaused = false;

      document.getElementById('showcaseRow').classList.remove('is-open');
      document.getElementById('tonearmOverlay').classList.remove('playing');
      document.getElementById('activeVinylDisc').classList.remove('spinning');
      document.getElementById('detailDrawer').classList.remove('open');
      document.getElementById('imageSection').classList.remove('visible');
      document.getElementById('commentSection').classList.remove('visible');

      document.querySelectorAll('.mini-track-row').forEach(el => el.classList.remove('active'));
      slotElements.forEach(s => {
        s.classList.remove('on-player', 'spinning');
      });

      setTimeout(() => {
        updateCarouselPositions();
      }, 50);
    }

    document.getElementById('turntableTriggerBox').onclick = () => {
      if (isPlaying) resetPlayerAnimation();
    };

    function startProgressSimulation() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (isDiscPaused || !isPlaying) return;
        progressPercent = progressPercent >= 100 ? 0 : progressPercent + 0.5;
        const fill = document.getElementById('ctrlProgressFill');
        if (fill) fill.style.width = `${progressPercent}%`;
      }, 300);
    }

    function setDiscPlayState(playingState) {
      isDiscPaused = !playingState;
      const tonearm = document.getElementById('tonearmOverlay');
      const activeVinyl = document.getElementById('activeVinylDisc');
      const icon = document.getElementById('playPauseIcon');

      if (playingState) {
        tonearm.classList.add('playing');
        activeVinyl.classList.add('spinning');
        if (icon) icon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      } else {
        tonearm.classList.remove('playing');
        activeVinyl.classList.remove('spinning');
        if (icon) icon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    document.getElementById('btnPrevTrack').onclick = (e) => {
      e.stopPropagation();
      if (filteredPosts.length === 0) return;
      const prevIdx = (currentIndex - 1 + filteredPosts.length) % filteredPosts.length;
      switchTrackWhilePlaying(prevIdx);
    };

    document.getElementById('btnNextTrack').onclick = (e) => {
      e.stopPropagation();
      if (filteredPosts.length === 0) return;
      const nextIdx = (currentIndex + 1) % filteredPosts.length;
      switchTrackWhilePlaying(nextIdx);
    };

    document.getElementById('btnPlayPause').onclick = (e) => {
      e.stopPropagation();
      setDiscPlayState(isDiscPaused);
    };

    document.getElementById('ctrlProgressWrap').onclick = (e) => {
      e.stopPropagation();
      const rect = e.currentTarget.getBoundingClientRect();
      progressPercent = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      document.getElementById('ctrlProgressFill').style.width = `${progressPercent}%`;
    };

    function renderTrackList() {
      const popover = document.getElementById('miniTrackPopover');
      if (!popover) return;
      if (filteredPosts.length === 0) {
        popover.innerHTML = `<div class="mini-track-row">등록된 트랙이 없습니다.</div>`;
        return;
      }
      popover.innerHTML = filteredPosts.map((post, idx) => `
        <div class="mini-track-row" data-idx="${idx}">
          ${idx + 1}. ${post.title}
        </div>
      `).join('');

      popover.querySelectorAll('.mini-track-row').forEach(item => {
        item.onclick = (e) => {
          e.stopPropagation();
          switchTrackWhilePlaying(Number(item.dataset.idx));
        };
      });
    }

    function switchTrackWhilePlaying(idx) {
      if (currentIndex !== idx) {
        currentIndex = idx;
        updateCarouselPositions();
      }
      openTrackDetail(idx);
    }

    function openTrackDetail(idx) {
      document.querySelectorAll('.mini-track-row').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });

      const post = filteredPosts[idx];
      if (!post) return;

      document.getElementById('ctrlTitle').textContent = post.title;
      progressPercent = 18;
      document.getElementById('ctrlProgressFill').style.width = `${progressPercent}%`;
      setDiscPlayState(true);
      startProgressSimulation();

      const vinylImgUrl = extractMetaUrl(post.body, 'vinyl', CUSTOM_ASSETS.vinylDisc);
      const activeVinyl = document.getElementById('activeVinylDisc');
      if (vinylImgUrl) {
        activeVinyl.style.backgroundImage = `url("${vinylImgUrl}")`;
        activeVinyl.classList.add('has-img');
      } else {
        activeVinyl.style.backgroundImage = '';
        activeVinyl.classList.remove('has-img');
      }

      const detailDrawer = document.getElementById('detailDrawer');
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');
      detailDrawer.classList.add('open');

      setTimeout(() => {
        const fullBody = post.body || '';
        const parts = fullBody.split('---threads---');
        let commentPart = parts[0] || '';
        let threadPart = parts[1] || '';

        const cleanComment = commentPart
          .replace(/^cover:\s*.+$/gim, '')
          .replace(/^vinyl:\s*.+$/gim, '')
          .replace(/^order:\s*.+$/gim, '')
          .trim();

        const mdImgMatch = cleanComment.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = cleanComment.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = cleanComment;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = cleanComment.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = cleanComment.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        const commentLabelBox = document.getElementById('commentLabelBox');
        const commentBody = document.getElementById('commentBody');

        if (textOnlyBody.length > 0) {
          document.getElementById('activePostTitle').textContent = `— ${post.title}`;
          commentLabelBox.style.display = 'flex';
          marked.setOptions({ breaks: true });
          commentBody.innerHTML = marked.parse(textOnlyBody);
        } else {
          commentLabelBox.style.display = 'none';
          commentBody.innerHTML = '';
        }

        // 타래 렌더링 (날짜 대신 '+' 기호 출력)
        const threadsContainer = document.getElementById('threadsContainer');
        threadsContainer.innerHTML = '';

        if (threadPart.trim()) {
          const blocks = threadPart.trim().split(/^---\s*$/gm).map(b => b.trim()).filter(Boolean);
          blocks.forEach(block => {
            const cleanBlock = block.replace(/^(?:threads:)?\s*/gi, '').replace(/threads:/gi, '').trim();
            if (!cleanBlock) return;

            const itemEl = document.createElement('div');
            itemEl.className = 'thread-item';
            
            itemEl.innerHTML = `
              <div class="thread-date">+</div>
              <div class="thread-body">${marked.parse(cleanBlock)}</div>
            `;
            threadsContainer.appendChild(itemEl);
          });
        }

        document.getElementById('threadWriteBox').style.display = 'flex';

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 160);
    }

    // 하단 타래글 추가 제출 버튼 이벤트
    document.getElementById('submitThreadBtn').onclick = async () => {
      const token = ghTokenInput.value.trim();
      const statusEl = document.getElementById('threadStatus');
      const threadInput = document.getElementById('newThreadInput');
      const threadText = threadInput.value.trim();

      if (!token) {
        statusEl.textContent = '타래를 작성하려면 상단 관리창에 GitHub Token을 먼저 입력해 주세요.';
        return;
      }
      if (!threadText) {
        statusEl.textContent = '타래 내용을 입력해 주세요.';
        return;
      }

      const currentPost = filteredPosts[currentIndex];
      if (!currentPost || currentPost.number <= 0) {
        statusEl.textContent = '샘플 게시글에는 타래를 추가할 수 없습니다.';
        return;
      }

      statusEl.textContent = '타래 추가 중...';
      document.getElementById('submitThreadBtn').disabled = true;

      try {
        let existingBody = currentPost.body || '';
        if (!existingBody.includes('---threads---')) {
          existingBody += '\n\n---threads---\n';
        } else {
          existingBody += '\n---\n';
        }
        existingBody += threadText.replace(/^(?:threads:)?\s*/gi, '');

        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${currentPost.number}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ body: existingBody })
        });

        if (!res.ok) throw new Error('타래 추가 실패: 토큰 권한을 확인해 주세요.');

        statusEl.textContent = '타래가 추가되었습니다!';
        threadInput.value = '';
        document.getElementById('submitThreadBtn').disabled = false;
        await fetchPosts();
        openTrackDetail(currentIndex);
        setTimeout(() => { statusEl.textContent = ''; }, 1200);
      } catch (err) {
        statusEl.textContent = err.message;
        document.getElementById('submitThreadBtn').disabled = false;
      }
    };

    // 타래 작성란 이미지 첨부 핸들러
    document.getElementById('newThreadImgInput').onchange = async (e) => {
      const file = e.target.files[0];
      const token = ghTokenInput.value.trim();
      const statusEl = document.getElementById('threadStatus');
      if (!file) return;
      if (!token) {
        statusEl.textContent = '이미지를 업로드하려면 토큰을 입력해 주세요.';
        return;
      }
      statusEl.textContent = '타래 이미지 업로드 중...';
      try {
        const url = await uploadImageToGitHub(file, token);
        const threadTextArea = document.getElementById('newThreadInput');
        threadTextArea.value += `\n![image](${url})\n`;
        statusEl.textContent = '이미지 첨부 완료!';
        setTimeout(() => { statusEl.textContent = ''; }, 1000);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    };

    function updateCarouselPositions() {
      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `translateX(0px) translateZ(0px) rotateY(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else {
          slot.classList.remove('active', 'on-player', 'spinning');
          const sign = offset > 0 ? 1 : -1;
          const abs = Math.abs(offset);
          const translateX = sign * (112 + abs * 34);
          const translateZ = -55 - abs * 38;
          const rotateY = -sign * 58;

          slot.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 25 - abs);
          slot.style.opacity = abs > 2 ? 0 : Math.max(0.45, 1 - abs * 0.25);
          slot.style.pointerEvents = abs > 2 ? 'none' : 'auto';
        }
      });
    }

    function stepTrack(direction) {
      if (isPlaying || isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        updateCarouselPositions();
        setTimeout(() => { isScrolling = false; }, 320);
      }
    }

    const carouselStage = document.getElementById('carouselStage');

    carouselStage.addEventListener('wheel', (e) => {
      if (isPlaying) return;
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 10) return;
      stepTrack(delta > 0 ? 1 : -1);
    }, { passive: false });

    let touchStartX = 0;
    carouselStage.addEventListener('touchstart', (e) => {
      if (isPlaying) return;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    carouselStage.addEventListener('touchend', (e) => {
      if (isPlaying) return;
      const diffX = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 30) {
        stepTrack(diffX > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (isPlaying || document.getElementById('writerOverlay').classList.contains('open')) return;
      if (e.key === 'ArrowLeft') stepTrack(-1);
      if (e.key === 'ArrowRight') stepTrack(1);
    });

    /* =========================================================================
       전용 글쓰기 / 순서 변경 / 수정·삭제 관리자 모달
       ========================================= */
    const writerOverlay = document.getElementById('writerOverlay');
    const ghTokenInput = document.getElementById('ghTokenInput');

    const savedToken = localStorage.getItem('oblaat_gh_token');
    if (savedToken) ghTokenInput.value = savedToken;

    function openWriterModal() {
      renderManageList();
      writerOverlay.classList.add('open');
    }
    function closeWriterModal() {
      cancelEditMode();
      writerOverlay.classList.remove('open');
      if (window.location.hash === '#write') {
        history.replaceState(null, null, ' ');
      }
    }

    if (window.location.hash === '#write') {
      openWriterModal();
    }
    window.addEventListener('hashchange', () => {
      if (window.location.hash === '#write') openWriterModal();
    });

    const secretTrigger = document.getElementById('secretTrigger');
    secretTrigger.ondblclick = openWriterModal;
    let pressTimer = null;
    secretTrigger.addEventListener('touchstart', () => {
      pressTimer = setTimeout(openWriterModal, 1200);
    }, { passive: true });
    secretTrigger.addEventListener('touchend', () => clearTimeout(pressTimer));

    document.getElementById('closeWriter').onclick = closeWriterModal;

    const tabWrite = document.getElementById('tabWrite');
    const tabManage = document.getElementById('tabManage');
    const writeFormPanel = document.getElementById('writeFormPanel');
    const manageListPanel = document.getElementById('manageListPanel');

    function switchAdminTab(mode) {
      document.getElementById('writerStatus').textContent = '';
      if (mode === 'write') {
        tabWrite.classList.add('active');
        tabManage.classList.remove('active');
        writeFormPanel.classList.remove('hidden');
        manageListPanel.classList.remove('active');
      } else {
        tabManage.classList.add('active');
        tabWrite.classList.remove('active');
        writeFormPanel.classList.add('hidden');
        manageListPanel.classList.add('active');
        renderManageList();
      }
    }

    tabWrite.onclick = () => switchAdminTab('write');
    tabManage.onclick = () => switchAdminTab('manage');

    function setCategorySelection(catName) {
      selectedCategory = catName;
      document.querySelectorAll('.cat-option').forEach(o => {
        o.classList.toggle('selected', o.dataset.cat === catName);
      });
    }

    document.querySelectorAll('.cat-option').forEach(opt => {
      opt.onclick = () => setCategorySelection(opt.dataset.cat);
    });

    function renderManageList() {
      const realPosts = allPosts.filter(p => p.number > 0);
      if (realPosts.length === 0) {
        manageListPanel.innerHTML = `<p style="font-size:0.84rem; color:#888; text-align:center; padding:24px 0;">등록된 트랙이 없습니다.</p>`;
        return;
      }

      manageListPanel.innerHTML = realPosts.map((post, idx) => {
        const cat = post.labels[0] ? post.labels[0].name : 'NONE';
        const date = formatYYMMDD(post.created_at);
        return `
          <div class="manage-item">
            <div class="manage-item-info">
              <div class="manage-item-title">${idx + 1}. ${post.title}</div>
              <div class="manage-item-meta">[${cat}] · ${date}</div>
            </div>
            <div class="manage-actions">
              <button class="btn-order" onclick="moveTrackOrder(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
              <button class="btn-order" onclick="moveTrackOrder(${idx}, 1)" ${idx === realPosts.length - 1 ? 'disabled' : ''}>▼</button>
              <button class="btn-edit" onclick="startEditTrack(${post.number})">수정</button>
              <button class="btn-delete" onclick="deleteTrack(${post.number}, '${post.title.replace(/'/g, "\\'")}')">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.moveTrackOrder = async function(index, direction) {
      const token = ghTokenInput.value.trim();
      const statusEl = document.getElementById('writerStatus');
      if (!token) {
        statusEl.textContent = '상단 발행 비밀번호(GitHub Token)를 먼저 입력해 주세요.';
        return;
      }

      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= allPosts.length) return;

      const temp = allPosts[index];
      allPosts[index] = allPosts[targetIndex];
      allPosts[targetIndex] = temp;

      renderManageList();
      statusEl.textContent = '순서 저장 중...';

      try {
        for (let i = 0; i < allPosts.length; i++) {
          const post = allPosts[i];
          if (post.number <= 0) continue;
          const newOrder = i + 1;
          const currentOrder = Number(extractMetaUrl(post.body, 'order', '-1'));
          if (currentOrder === newOrder) continue;

          const cleanBody = (post.body || '').replace(/^order:\s*.+$/gim, '').trim();
          const updatedBody = `order: ${newOrder}\n\n${cleanBody}`;
          post.body = updatedBody;

          await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${post.number}`, {
            method: 'PATCH',
            headers: {
              'Authorization': `token ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ body: updatedBody })
          });
        }

        const activeFilter = document.querySelector('.filter-btn.active')?.dataset.label?.trim().toUpperCase() || 'ALL';
        filteredPosts = allPosts.filter(p => matchesCategory(p, activeFilter));
        rebuildAll();

        statusEl.textContent = '순서가 변경되었습니다.';
        setTimeout(() => { statusEl.textContent = ''; }, 1000);
      } catch (err) {
        statusEl.textContent = '순서 저장 실패: 토큰을 확인해 주세요.';
      }
    };

    window.startEditTrack = function(issueNumber) {
      const post = allPosts.find(p => p.number === issueNumber);
      if (!post) return;

      editingIssueNumber = issueNumber;
      const raw = post.body || '';

      const coverUrl = extractMetaUrl(raw, 'cover', '');
      const vinylUrl = extractMetaUrl(raw, 'vinyl', '');
      const orderVal = extractMetaUrl(raw, 'order', '');

      let commentPart = raw;
      const parts = raw.split('---threads---');
      if (parts[0]) commentPart = parts[0];

      const cleanWithoutMeta = commentPart
        .replace(/^cover:\s*.+$/gim, '')
        .replace(/^vinyl:\s*.+$/gim, '')
        .replace(/^order:\s*.+$/gim, '')
        .trim();

      const mdImgMatch = cleanWithoutMeta.match(/!\[.*?\]\((.*?)\)/);
      const bodyImgUrl = mdImgMatch ? mdImgMatch[1] : '';
      const pureText = mdImgMatch ? cleanWithoutMeta.replace(mdImgMatch[0], '').trim() : cleanWithoutMeta;

      preservedAssets = { cover: coverUrl, vinyl: vinylUrl, bodyImg: bodyImgUrl, order: orderVal };

      document.getElementById('existingCoverNote').textContent = coverUrl ? '※ 기존 커버 이미지 유지됨 (새 파일 선택 시 교체)' : '';
      document.getElementById('existingVinylNote').textContent = vinylUrl ? '※ 기존 LP 알판 이미지 유지됨 (새 파일 선택 시 교체)' : '';
      document.getElementById('existingBodyImgNote').textContent = bodyImgUrl ? '※ 기존 본문 이미지 유지됨 (새 파일 선택 시 교체)' : '';

      document.getElementById('postTitleInput').value = post.title;
      document.getElementById('postBodyInput').value = pureText;
      const cat = post.labels[0] ? post.labels[0].name.trim().toUpperCase() : 'MADE';
      setCategorySelection(cat === 'LOVE' || cat === 'AND' ? 'LOVE' : 'MADE');

      document.getElementById('editModeBanner').classList.add('active');
      document.getElementById('editModeText').textContent = `수정 중: ${post.title}`;
      document.getElementById('publishBtn').textContent = '수정 완료 (UPDATE)';

      switchAdminTab('write');
    };

    function cancelEditMode() {
      editingIssueNumber = null;
      preservedAssets = { cover: "", vinyl: "", bodyImg: "", order: "" };
      document.getElementById('existingCoverNote').textContent = '';
      document.getElementById('existingVinylNote').textContent = '';
      document.getElementById('existingBodyImgNote').textContent = '';
      document.getElementById('postTitleInput').value = '';
      document.getElementById('postBodyInput').value = '';
      document.getElementById('coverFileInput').value = '';
      document.getElementById('vinylFileInput').value = '';
      document.getElementById('bodyImgFileInput').value = '';
      document.getElementById('editModeBanner').classList.remove('active');
      document.getElementById('publishBtn').textContent = '발행하기 (PUBLISH)';
    }

    document.getElementById('cancelEditBtn').onclick = cancelEditMode;

    window.deleteTrack = async function(issueNumber, title) {
      const token = ghTokenInput.value.trim();
      const statusEl = document.getElementById('writerStatus');

      if (!token) {
        statusEl.textContent = '상단 발행 비밀번호(GitHub Token)를 먼저 입력해 주세요.';
        return;
      }
      if (!confirm(`"${title}" 트랙을 정말 삭제할까요?`)) return;

      localStorage.setItem('oblaat_gh_token', token);
      statusEl.textContent = '트랙 삭제 중...';

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${issueNumber}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ state: 'closed' })
        });

        if (!res.ok) throw new Error('삭제 실패: 토큰 권한을 확인해 주세요.');

        statusEl.textContent = '삭제되었습니다.';
        await fetchPosts();
        setTimeout(() => { statusEl.textContent = ''; }, 1200);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    };

    async function uploadImageToGitHub(file, token) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const base64Content = reader.result.split(',')[1];
            const ext = file.name.split('.').pop() || 'png';
            const fileName = `uploads/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${ext}`;

            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
              method: 'PUT',
              headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: `upload image: ${fileName}`,
                content: base64Content
              })
            });

            if (!res.ok) throw new Error('이미지 업로드 실패 (토큰 권한 확인)');
            const data = await res.json();
            resolve(data.content.download_url);
          } catch (err) {
            reject(err);
          }
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('publishBtn').onclick = async () => {
      const token = ghTokenInput.value.trim();
      const title = document.getElementById('postTitleInput').value.trim();
      const rawBody = document.getElementById('postBodyInput').value.trim();
      const coverFile = document.getElementById('coverFileInput').files[0];
      const vinylFile = document.getElementById('vinylFileInput').files[0];
      const bodyImgFile = document.getElementById('bodyImgFileInput').files[0];
      const statusEl = document.getElementById('writerStatus');
      const btn = document.getElementById('publishBtn');

      if (!token) {
        statusEl.textContent = '발행 비밀번호(GitHub Token)를 입력해 주세요.';
        return;
      }
      if (!title) {
        statusEl.textContent = '트랙 제목을 입력해 주세요.';
        return;
      }

      localStorage.setItem('oblaat_gh_token', token);
      btn.disabled = true;

      try {
        let finalBodyParts = [];

        if (preservedAssets.order) {
          finalBodyParts.push(`order: ${preservedAssets.order}`);
        }

        if (coverFile) {
          statusEl.textContent = 'LP 커버 이미지 업로드 중...';
          const coverUrl = await uploadImageToGitHub(coverFile, token);
          finalBodyParts.push(`cover: ${coverUrl}`);
        } else if (preservedAssets.cover) {
          finalBodyParts.push(`cover: ${preservedAssets.cover}`);
        }

        if (vinylFile) {
          statusEl.textContent = 'LP 알판 이미지 업로드 중...';
          const vinylUrl = await uploadImageToGitHub(vinylFile, token);
          finalBodyParts.push(`vinyl: ${vinylUrl}`);
        } else if (preservedAssets.vinyl) {
          finalBodyParts.push(`vinyl: ${preservedAssets.vinyl}`);
        }

        if (bodyImgFile) {
          statusEl.textContent = '본문 이미지 업로드 중...';
          const bodyImgUrl = await uploadImageToGitHub(bodyImgFile, token);
          finalBodyParts.push(`![image](${bodyImgUrl})`);
        } else if (preservedAssets.bodyImg) {
          finalBodyParts.push(`![image](${preservedAssets.bodyImg})`);
        }

        if (rawBody) {
          finalBodyParts.push(rawBody);
        }

        if (editingIssueNumber !== null) {
          const oldPost = allPosts.find(p => p.number === editingIssueNumber);
          if (oldPost && oldPost.body && oldPost.body.includes('---threads---')) {
            const threadPart = oldPost.body.split('---threads---')[1];
            if (threadPart) finalBodyParts.push(`---threads---\n${threadPart.trim()}`);
          }
        }

        const isEditing = editingIssueNumber !== null;
        statusEl.textContent = isEditing ? '트랙 수정 저장 중...' : '트랙 발행 중...';

        const endpoint = isEditing
          ? `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues/${editingIssueNumber}`
          : `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues`;

        const res = await fetch(endpoint, {
          method: isEditing ? 'PATCH' : 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title: title,
            body: finalBodyParts.join('\n\n'),
            labels: [selectedCategory]
          })
        });

        if (!res.ok) throw new Error('저장 실패: 토큰이 올바른지 확인해 주세요.');

        statusEl.textContent = isEditing ? '수정 완료!' : '발행 완료!';

        setTimeout(() => {
          closeWriterModal();
          statusEl.textContent = '';
          btn.disabled = false;
          fetchPosts();
        }, 700);

      } catch (err) {
        statusEl.textContent = err.message;
        btn.disabled = false;
      }
    };

    fetchPosts();
  </script>
</body>
