<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVES</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Pretendard:wght@300;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;     /* LP 커버 도형 선 */
      --line-orange: #ff6b4a;   /* LP 알판 도형 선 */
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding: 48px 16px 80px;
    }

    /* 1. 상단 타이틀 */
    header {
      text-align: center;
      margin-bottom: 32px;
      z-index: 30;
    }
    header h1 {
      font-weight: 300;
      font-size: 2.4rem;
      letter-spacing: 0.14em;
      color: var(--text-main);
    }

    /* 카테고리 필터 */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid #ddd;
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* 2. 3D 커버플로우 + 슬라이딩 LP 스테이지 */
    .stage {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 460px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 12px;
      perspective: 1200px;
      user-select: none;
    }

    .carousel-track {
      position: relative;
      width: 280px;
      height: 280px;
      transform-style: preserve-3d;
    }

    /* 개별 LP 커버 래퍼 (커버 + 내부 LP판을 함께 묶음) */
    .lp-slot {
      position: absolute;
      inset: 0;
      width: 280px;
      height: 280px;
      /* 부드러운 관성 이동 애니메이션 */
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    /* 실제 정사각형 LP 커버(재킷) 도형 - 앞면 */
    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff; /* 불투명 배경으로 뒤쪽 LP판을 가림 */
      border: 1.5px solid var(--line-blue);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 2; /* LP판보다 위 레이어 */
      transition: box-shadow 0.45s ease, border-color 0.45s ease;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 14px 34px rgba(107, 158, 255, 0.14);
    }

    .lp-card-label {
      font-size: 0.72rem;
      color: var(--line-blue);
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      border: 1px solid var(--line-blue);
      padding: 2px 8px;
    }

    .lp-card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 12px;
    }

    /* 3. 재킷 안쪽에서 아래로 슬라이드되어 나오는 원형 LP판 도형 */
    .vinyl-disc {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 252px;
      height: 252px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background: #ffffff;
      z-index: 1; /* 재킷(.lp-jacket) 바로 뒤쪽 레이어 */
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 24px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    /* LP 중앙 라벨 홀 도형 */
    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 76px;
      height: 76px;
      margin: -38px 0 0 -38px;
      border-radius: 50%;
      border: 1px dashed var(--line-orange);
      opacity: 0.55;
    }

    /* LP 소리골(홈) 느낌을 주는 얇은 보조 원 */
    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
    }

    /* 활성화된 중앙 카드일 때 LP판이 재킷 아래로 살짝 얼굴을 내밈 */
    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(42px);
    }

    /* 중앙 카드에 마우스를 올리면 반쯤 슬라이드 아웃 */
    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(115px) rotate(35deg);
    }

    /* 클릭해서 열 때 완전히 슬라이드 아웃 */
    .lp-slot.active.sliding-out .vinyl-disc {
      transform: translateY(165px) rotate(90deg);
    }

    .sliding-guide {
      color: var(--line-orange);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    /* 좌우 컨트롤 영역 */
    .nav-hint {
      margin-top: 48px;
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-sub);
      z-index: 20;
    }
    .nav-btn {
      background: #fff;
      border: 1px solid #ddd;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-main);
      transition: 0.2s;
    }
    .nav-btn:hover {
      border-color: var(--line-blue);
      color: var(--line-blue);
    }

    /* 4. 글 본문 모달(팝업) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 680px;
      max-height: 82vh;
      overflow-y: auto;
      padding: 36px 32px;
      border: 1.5px solid var(--line-blue);
      position: relative;
      animation: modalFade 0.3s ease;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .close-btn {
      position: sticky;
      top: 0;
      float: right;
      background: #fff;
      border: 1px solid #ccc;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }
    .modal-header {
      border-bottom: 1px dashed #ddd;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .modal-header h2 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.35rem;
      margin-bottom: 6px;
    }
    .modal-body {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.98rem;
      line-height: 1.95;
      word-break: keep-all;
    }
    .modal-body p { margin-bottom: 1.2em; }
    .modal-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }

    /* 모바일 대응 */
    @media (max-width: 600px) {
      .carousel-track, .lp-slot { width: 220px; height: 220px; }
      .vinyl-disc { top: 10px; left: 10px; width: 200px; height: 200px; padding-bottom: 18px; }
      .lp-slot.active .vinyl-disc { transform: translateY(34px); }
      .lp-slot.active:hover .vinyl-disc { transform: translateY(90px) rotate(35deg); }
      .lp-slot.active.sliding-out .vinyl-disc { transform: translateY(130px) rotate(90deg); }
      .stage { height: 390px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>ARCHIVES</h1>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-label="ALL">ALL</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="carousel-track" id="carouselTrack"></div>
  </div>

  <div class="nav-hint">
    <button class="nav-btn" id="prevBtn">←</button>
    <span id="counterText">0 / 0</span>
    <button class="nav-btn" id="nextBtn">→</button>
  </div>

  <!-- 글 본문 팝업 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">✕</button>
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <span style="font-size:0.78rem; color:#888;" id="modalDate"></span>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;

    async function fetchPosts() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];
        
        if (issues.length > 0) {
          allPosts = issues;
        } else {
          allPosts = [
            { number: 1, title: "LP 커버 01 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "썰" }], body: "깃허브 `Issues` 탭에 첫 글을 올리면 이 샘플은 자동으로 사라지고 실제 글이 표시됩니다." },
            { number: 2, title: "LP 커버 02 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "연성" }], body: "좌우 커버를 클릭하거나 방향키·스와이프로 부드럽게 회전할 수 있습니다." },
            { number: 3, title: "LP 커버 03 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "설정" }], body: "중앙 커버나 아래로 삐져나온 원형 LP를 누르면 커버 안에서 LP가 슬라이드되어 나온 뒤 본문이 열립니다." },
            { number: 4, title: "LP 커버 04 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "썰" }], body: "추후 `.lp-jacket`에 이미지를 넣으면 실제 앨범 아트처럼 바뀝니다." },
            { number: 5, title: "LP 커버 05 (샘플)", created_at: new Date().toISOString(), labels: [{ name: "연성" }], body: "다섯 번째 샘플 트랙입니다." }
          ];
        }
        filteredPosts = [...allPosts];
        renderFilters(allPosts);
        buildCarouselDOM();
        updateCarouselPositions();
      } catch (err) {
        console.error(err);
      }
    }

    function renderFilters(posts) {
      const labelSet = new Set();
      posts.forEach(p => p.labels.forEach(l => labelSet.add(l.name)));
      const filterBar = document.getElementById('filterBar');

      labelSet.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.textContent = label;
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filteredPosts = allPosts.filter(p => p.labels.some(l => l.name === label));
          currentIndex = 0;
          buildCarouselDOM();
          updateCarouselPositions();
        };
        filterBar.appendChild(btn);
      });

      filterBar.querySelector('[data-label="ALL"]').onclick = (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        filteredPosts = [...allPosts];
        currentIndex = 0;
        buildCarouselDOM();
        updateCarouselPositions();
      };
    }

    // 최초 1회만 DOM 생성 (애니메이션이 끊기지 않도록 유지)
    function buildCarouselDOM() {
      const track = document.getElementById('carouselTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name : 'ARCHIVE';
        const date = new Date(post.created_at).toLocaleDateString('ko-KR');

        slot.innerHTML = `
          <div class="lp-jacket">
            <div class="lp-card-label">${labelName}</div>
            <div class="lp-card-title">${post.title}</div>
            <div class="lp-card-date">${date}</div>
          </div>
          <div class="vinyl-disc">
            <span class="sliding-guide">↓ SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (idx === currentIndex) {
            triggerSlideAndOpen(post, slot);
          } else {
            currentIndex = idx;
            updateCarouselPositions();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
    }

    // DOM을 지우지 않고 transform 좌표만 부드럽게 갱신
    function updateCarouselPositions() {
      document.getElementById('counterText').textContent = `${filteredPosts.length ? currentIndex + 1 : 0} / ${filteredPosts.length}`;

      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;
        slot.classList.remove('sliding-out');

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `translateX(0px) translateZ(0px) rotateY(0deg)`;
          slot.style.zIndex = 20;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else {
          slot.classList.remove('active');
          const sign = offset > 0 ? 1 : -1;
          const abs = Math.abs(offset);
          const translateX = sign * (135 + abs * 52);
          const translateZ = -90 - abs * 35;
          const rotateY = -sign * 48;

          slot.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 15 - abs);
          // 멀리 떨어진 카드는 투명하게 숨겨 부드럽게 나타나고 사라지게 처리
          slot.style.opacity = abs > 3 ? 0 : Math.max(0.35, 1 - abs * 0.2);
          slot.style.pointerEvents = abs > 3 ? 'none' : 'auto';
        }
      });
    }

    // 커버 안에서 LP가 슬라이드되어 나온 뒤 본문 모달 오픈
    function triggerSlideAndOpen(post, slot) {
      slot.classList.add('sliding-out');

      setTimeout(() => {
        document.getElementById('modalTitle').textContent = post.title;
        document.getElementById('modalDate').textContent = new Date(post.created_at).toLocaleDateString('ko-KR');
        marked.setOptions({ breaks: true });
        document.getElementById('modalBody').innerHTML = marked.parse(post.body || '');
        document.getElementById('modalOverlay').classList.add('open');
      }, 450);
    }

    function goPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCarouselPositions();
      }
    }
    function goNext() {
      if (currentIndex < filteredPosts.length - 1) {
        currentIndex++;
        updateCarouselPositions();
      }
    }

    document.getElementById('prevBtn').onclick = goPrev;
    document.getElementById('nextBtn').onclick = goNext;

    // 키보드 좌우 화살표 지원
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('modalOverlay').classList.contains('open')) return;
      if (e.key === 'ArrowLeft') goPrev();
      if (e.key === 'ArrowRight') goNext();
    });

    // 모바일 터치 스와이프 지원
    let touchStartX = 0;
    const stage = document.getElementById('stage');
    stage.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    stage.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (diff > 45) goPrev();
      else if (diff < -45) goNext();
    }, { passive: true });

    // 모달 닫을 때 LP판 다시 재킷 안으로 쏙 복귀
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      if (slotElements[currentIndex]) {
        slotElements[currentIndex].classList.remove('sliding-out');
      }
    }
    document.getElementById('closeModal').onclick = closeModal;
    document.getElementById('modalOverlay').onclick = (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    };

    fetchPosts();
  </script>
</body>
</html>
