<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCHIVES</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --line-blue: #6b9eff;
      --line-orange: #ff6b4a;
      --text-main: #1a1a1a;
      --text-sub: #777777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 전체 2단 분할 레이아웃 */
    .layout-wrapper {
      display: grid;
      grid-template-columns: 440px 1fr;
      min-height: 100vh;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* =========================================
       [왼쪽 패널] 가로 스택 LP 커버 + 3단계 LP 플레이어 애니메이션
       ========================================= */
    .left-pane {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 24px 32px;
      user-select: none;
    }

    /* 상단 LP 커버 스테이지 */
    .carousel-stage {
      position: relative;
      width: 340px;
      height: 310px;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding-left: 16px;
      perspective: 1100px;
      touch-action: none;
    }

    .stack-track {
      position: relative;
      width: 230px;
      height: 230px;
      transform-style: preserve-3d;
    }

    .lp-slot {
      position: absolute;
      inset: 0;
      width: 230px;
      height: 230px;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      cursor: pointer;
    }

    /* 정사각형 LP 커버 (가로 정방향 텍스트) */
    .lp-jacket {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1.5px solid var(--line-blue);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 28px 20px;
      transition: box-shadow 0.4s ease;
    }

    .lp-slot.active .lp-jacket {
      box-shadow: 0 12px 28px rgba(107, 158, 255, 0.14);
    }

    .lp-card-label {
      font-size: 0.75rem;
      color: var(--line-blue);
      letter-spacing: 0.14em;
      font-weight: 500;
    }

    .lp-card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.08rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.45;
    }

    .lp-card-date {
      font-size: 0.72rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    /* 커버 하단으로 얼굴을 내민 원형 LP판 */
    .vinyl-disc {
      position: absolute;
      top: 11px;
      left: 11px;
      width: 208px;
      height: 208px;
      border-radius: 50%;
      border: 1.5px solid var(--line-orange);
      background: #ffffff;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }

    /* LP 중앙 라벨 실선 원 */
    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 62px;
      height: 62px;
      margin: -31px 0 0 -31px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.5);
    }

    /* LP 소리골 & 회전 각도 확인용 마커 */
    .vinyl-disc::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255, 107, 74, 0.18);
      border-top-color: var(--line-orange); /* 회전 시 돌아가는 게 보이도록 포인트 */
    }

    .sliding-text {
      font-size: 0.62rem;
      color: var(--line-orange);
      letter-spacing: 0.18em;
      font-weight: 500;
    }

    /* 대기 상태: LP판이 커버 하단으로 45px 돌출 */
    .lp-slot.active .vinyl-disc {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(45px);
    }

    .lp-slot.active:hover .vinyl-disc {
      transform: translateY(62px);
    }

    /* [1단계 & 3단계] LP가 슬라이딩되어 아래 턴테이블 위로 안착 + 회전 */
    .lp-slot.active.on-player .vinyl-disc {
      transform: translateY(336px);
    }
    .lp-slot.active.spinning .vinyl-disc {
      animation: spinVinyl 4s linear infinite;
    }

    @keyframes spinVinyl {
      from { transform: translateY(336px) rotate(0deg); }
      to   { transform: translateY(336px) rotate(360deg); }
    }

    /* =========================================
       [2단계] 하단 LP 플레이어 (턴테이블 도형)
       ========================================= */
    .turntable-box {
      position: relative;
      width: 246px;
      height: 246px;
      margin-top: 26px;
      margin-right: 78px; /* 위쪽 중앙 커버와 수직축 정렬 */
      border: 1.5px solid var(--line-blue);
      background: #ffffff;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .turntable-box.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* 턴테이블 중앙 스핀들 축 */
    .turntable-spindle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #fff;
      z-index: 3;
    }

    /* 턴테이블 좌측 하단 톤암 (스케치 반영) */
    .tonearm-base {
      position: absolute;
      bottom: 20px;
      left: 16px;
      width: 14px;
      height: 22px;
      border: 1.5px solid var(--line-blue);
      background: #fff;
      z-index: 4;
    }

    .tonearm-stick {
      position: absolute;
      bottom: 36px;
      left: 22px;
      width: 1.5px;
      height: 145px;
      background: var(--line-blue);
      transform-origin: bottom center;
      transform: rotate(12deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 4;
    }

    /* 톤암 헤드(바늘 끝 원형) */
    .tonearm-stick::after {
      content: "";
      position: absolute;
      top: -4px;
      left: -3.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--line-blue);
      background: #fff;
    }

    /* LP가 올라가면 톤암이 LP판 위로 이동 */
    .turntable-box.playing .tonearm-stick {
      transform: rotate(32deg);
    }

    /* =========================================
       [오른쪽 패널] ARCHIVES + HIDDEN TRACK + IMAGE + COMMENT
       ========================================= */
    .right-pane {
      padding: 48px 56px 120px;
      display: flex;
      flex-direction: column;
    }

    .right-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .right-header h1 {
      font-weight: 300;
      font-size: 2.3rem;
      letter-spacing: 0.18em;
      margin-bottom: 14px;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid #dcdcdc;
      padding: 4px 16px;
      border-radius: 99px;
      font-size: 0.78rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.06em;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    /* TRACK: 테두리 없음(HIDDEN FRAME) + 스크롤바 숨김(HIDDEN SCROLL) + 하단 #FFFFFF 그라데이션 */
    .track-section {
      margin-bottom: 32px;
      max-width: 520px;
    }
    .track-box-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    .track-scroll-wrapper {
      position: relative;
      height: 152px;
      border: none; /* HIDDEN FRAME */
    }
    .track-list {
      list-style: none;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 54px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      /* HIDDEN SCROLL: 모든 브라우저에서 스크롤바 시각 요소 숨김 */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .track-list::-webkit-scrollbar {
      display: none;
    }

    /* 하단 #FFFFFF 흰색 그라데이션 페이드 */
    .track-fade-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.85) 60%,
        #ffffff 100%
      );
      pointer-events: none;
    }

    .track-item {
      font-size: 0.86rem;
      color: var(--text-sub);
      cursor: pointer;
      transition: color 0.2s, transform 0.2s;
      padding: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-item:hover, .track-item.active {
      color: var(--line-orange);
      font-weight: 500;
      transform: translateX(4px);
    }

    /* 본문 컨테이너 */
    .content-stage {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* IMAGE 프레임 (테두리 없음) */
    .image-frame {
      width: 100%;
      max-width: 520px;
      min-height: 300px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #f5f5f5;
    }
    .image-frame img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-placeholder {
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      color: #a8a8a8;
    }

    /* COMMENT (본문) 영역 */
    .comment-section {
      max-width: 620px;
    }
    .comment-label {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .comment-label span {
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 400;
    }
    .comment-body {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.98rem;
      line-height: 1.95;
      color: var(--text-main);
      word-break: keep-all;
    }
    .comment-body p { margin-bottom: 1.2em; }
    .comment-body blockquote {
      border-left: 2px solid var(--line-orange);
      padding-left: 14px;
      color: var(--text-sub);
      margin: 16px 0;
    }
    .comment-body img {
      max-width: 100%;
      margin: 14px 0;
    }

    /* 모바일 및 태블릿 반응형 */
    @media (max-width: 920px) {
      .layout-wrapper {
        grid-template-columns: 1fr;
      }
      .left-pane {
        position: relative;
        height: auto;
        min-height: 620px;
        padding: 32px 16px;
      }
      .right-pane {
        padding: 24px 24px 80px;
      }
    }
  </style>
</head>
<body>

  <div class="layout-wrapper">
    <!-- [왼쪽] LP 커버 스택 + 3단계 애니메이션 LP 플레이어 -->
    <aside class="left-pane">
      <div class="carousel-stage" id="carouselStage" title="스크롤/스와이프로 LP 넘기기 · 클릭하여 재생">
        <div class="stack-track" id="stackTrack"></div>
      </div>

      <!-- 2단계: 페이드인 되는 LP 플레이어 -->
      <div class="turntable-box" id="turntableBox">
        <div class="turntable-spindle"></div>
        <div class="tonearm-base"></div>
        <div class="tonearm-stick"></div>
      </div>
    </aside>

    <!-- [오른쪽] ARCHIVES + TRACK + IMAGE + COMMENT -->
    <main class="right-pane">
      <header class="right-header">
        <h1>ARCHIVES</h1>
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" data-label="ALL">ALL</button>
          <button class="filter-btn" data-label="MADE">MADE</button>
          <button class="filter-btn" data-label="AND">AND</button>
        </div>
      </header>

      <section class="track-section">
        <div class="track-box-title">TRACK</div>
        <div class="track-scroll-wrapper">
          <ul class="track-list" id="trackList"></ul>
          <div class="track-fade-overlay"></div>
        </div>
      </section>

      <section class="content-stage">
        <div class="fade-section" id="imageSection">
          <div class="image-frame" id="imageFrame">
            <div class="image-placeholder">IMAGE</div>
          </div>
        </div>

        <div class="fade-section comment-section" id="commentSection">
          <div class="comment-label">
            COMMENT <span id="activePostTitle"></span>
          </div>
          <div class="comment-body" id="commentBody"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const GITHUB_USER = "by-Oblaat";
    const GITHUB_REPO = "by-Oblaat.github.io";

    let allPosts = [];
    let filteredPosts = [];
    let slotElements = [];
    let currentIndex = 0;
    let isScrolling = false;
    let isPlaying = false;
    let playTimers = [];

    // 날짜를 YY.MM.DD 형식으로 포맷
    function formatYYMMDD(dateStr) {
      const d = new Date(dateStr);
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}.${mm}.${dd}`;
    }

    // 1. 깃허브 이슈 로드
    async function fetchPosts() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=100`);
        const data = await res.json();
        const issues = Array.isArray(data) ? data.filter(item => !item.pull_request) : [];

        if (issues.length > 0) {
          allPosts = issues;
        } else {
          allPosts = [
            { number: 1, title: "SAMPLE 01", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "중앙 LP 커버나 아래로 나온 LP판을 클릭하면 ① LP가 아래로 슬라이딩되고 ② LP 플레이어가 페이드인되며 ③ 플레이어 위에서 LP가 회전합니다.\n\n깃허브 `Issues`에 `MADE` 또는 `AND` 라벨을 달아 글을 올리면 자동으로 반영됩니다." },
            { number: 2, title: "SAMPLE 02", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "두 번째 트랙입니다. 오른쪽 TRACK 영역은 스크롤바가 숨겨진 상태에서 마우스 휠로 부드럽게 내려볼 수 있습니다." },
            { number: 3, title: "SAMPLE 03", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "세 번째 트랙 코멘트입니다." },
            { number: 4, title: "SAMPLE 04", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "네 번째 트랙 코멘트입니다." },
            { number: 5, title: "SAMPLE 05", created_at: new Date().toISOString(), labels: [{ name: "MADE" }], body: "다섯 번째 트랙 코멘트입니다." },
            { number: 6, title: "SAMPLE 06", created_at: new Date().toISOString(), labels: [{ name: "AND" }], body: "여섯 번째 트랙 코멘트입니다." }
          ];
        }
        filteredPosts = [...allPosts];
        bindFilterButtons();
        rebuildAll();
      } catch (err) {
        console.error(err);
      }
    }

    // 2. ALL / MADE / AND 필터 연결
    function bindFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const label = btn.dataset.label;
          if (label === 'ALL') {
            filteredPosts = [...allPosts];
          } else {
            filteredPosts = allPosts.filter(p => p.labels.some(l => l.name.toUpperCase() === label));
          }
          currentIndex = 0;
          rebuildAll();
        };
      });
    }

    function rebuildAll() {
      resetPlayerAnimation();
      buildStackDOM();
      renderTrackList();
      updateActiveState();
    }

    // 3. LP 커버 스택 DOM 생성
    function buildStackDOM() {
      const track = document.getElementById('stackTrack');
      track.innerHTML = '';
      slotElements = [];

      filteredPosts.forEach((post, idx) => {
        const slot = document.createElement('div');
        slot.className = 'lp-slot';

        const labelName = post.labels[0] ? post.labels[0].name.toUpperCase() : 'ARCHIVE';
        const date = formatYYMMDD(post.created_at);

        slot.innerHTML = `
          <div class="lp-jacket">
            <div class="lp-card-label">${labelName}</div>
            <div class="lp-card-title">${post.title}</div>
            <div class="lp-card-date">${date}</div>
          </div>
          <div class="vinyl-disc">
            <span class="sliding-text">SLIDING</span>
          </div>
        `;

        slot.onclick = () => {
          if (idx === currentIndex) {
            if (isPlaying) {
              resetPlayerAnimation();
            } else {
              startPlayerSequence(slot);
            }
          } else {
            currentIndex = idx;
            updateActiveState();
          }
        };

        track.appendChild(slot);
        slotElements.push(slot);
      });
    }

    // 4. 3단계 LP 플레이어 순차 애니메이션 실행
    function startPlayerSequence(slot) {
      resetPlayerAnimation();
      isPlaying = true;

      const turntable = document.getElementById('turntableBox');

      // ① LP가 커버에서 슬라이딩되어 나옴
      slot.classList.add('on-player');

      // ② LP 플레이어가 Fade-in 되며 등장
      const t1 = setTimeout(() => {
        turntable.classList.add('visible');
      }, 220);

      // ③ LP 플레이어 위에 LP가 올라가고 톤암 이동 + 회전 시작
      const t2 = setTimeout(() => {
        turntable.classList.add('playing');
        slot.classList.add('spinning');
      }, 780);

      playTimers.push(t1, t2);
    }

    // 애니메이션 초기화 (다른 트랙으로 넘기거나 재클릭 시)
    function resetPlayerAnimation() {
      playTimers.forEach(t => clearTimeout(t));
      playTimers = [];
      isPlaying = false;

      const turntable = document.getElementById('turntableBox');
      turntable.classList.remove('visible', 'playing');

      slotElements.forEach(s => {
        s.classList.remove('on-player', 'spinning');
      });
    }

    // 5. 오른쪽 TRACK 목록 렌더링
    function renderTrackList() {
      const trackList = document.getElementById('trackList');
      if (filteredPosts.length === 0) {
        trackList.innerHTML = `<li class="track-item">등록된 트랙이 없습니다.</li>`;
        return;
      }
      trackList.innerHTML = filteredPosts.map((post, idx) => `
        <li class="track-item ${idx === currentIndex ? 'active' : ''}" data-idx="${idx}">
          - ${idx + 1}. ${post.title}
        </li>
      `).join('');

      trackList.querySelectorAll('.track-item').forEach(item => {
        item.onclick = () => {
          currentIndex = Number(item.dataset.idx);
          updateActiveState();
        };
      });
    }

    // 6. 가로 스택 LP 위치 갱신 + 오른쪽 본문 업데이트
    function updateActiveState() {
      resetPlayerAnimation();

      const trackItems = document.querySelectorAll('.track-item');
      trackItems.forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
        if (i === currentIndex) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      // 가로 스택 배치 (중앙 커버 + 우측으로 겹치는 후속 커버들)
      slotElements.forEach((slot, idx) => {
        const offset = idx - currentIndex;

        if (offset === 0) {
          slot.classList.add('active');
          slot.style.transform = `translateX(0px) translateZ(0px) rotateY(0deg)`;
          slot.style.zIndex = 30;
          slot.style.opacity = 1;
          slot.style.pointerEvents = 'auto';
        } else if (offset > 0) {
          slot.classList.remove('active');
          const translateX = offset * 28;
          const translateZ = -offset * 55;
          const rotateY = -Math.min(18, offset * 5);
          slot.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
          slot.style.zIndex = Math.max(1, 25 - offset);
          slot.style.opacity = offset > 4 ? 0 : Math.max(0.25, 1 - offset * 0.2);
          slot.style.pointerEvents = offset > 4 ? 'none' : 'auto';
        } else {
          slot.classList.remove('active');
          slot.style.transform = `translateX(-45px) translateZ(30px) rotateY(10deg)`;
          slot.style.zIndex = 35;
          slot.style.opacity = 0;
          slot.style.pointerEvents = 'none';
        }
      });

      // 오른쪽 IMAGE + COMMENT 업데이트
      const post = filteredPosts[currentIndex];
      const imageSection = document.getElementById('imageSection');
      const commentSection = document.getElementById('commentSection');

      if (!post) {
        document.getElementById('imageFrame').innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        document.getElementById('activePostTitle').textContent = '';
        document.getElementById('commentBody').innerHTML = '';
        return;
      }

      imageSection.classList.remove('visible');
      commentSection.classList.remove('visible');

      setTimeout(() => {
        const rawBody = post.body || '';
        const mdImgMatch = rawBody.match(/!\[.*?\]\((.*?)\)/);
        const htmlImgMatch = rawBody.match(/<img[^>]+src=["']([^"']+)["']/i);
        const imageFrame = document.getElementById('imageFrame');

        let textOnlyBody = rawBody;
        if (mdImgMatch) {
          imageFrame.innerHTML = `<img src="${mdImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(mdImgMatch[0], '').trim();
        } else if (htmlImgMatch) {
          imageFrame.innerHTML = `<img src="${htmlImgMatch[1]}" alt="cover" />`;
          textOnlyBody = rawBody.replace(htmlImgMatch[0], '').trim();
        } else {
          imageFrame.innerHTML = `<div class="image-placeholder">IMAGE</div>`;
        }

        document.getElementById('activePostTitle').textContent = `— ${post.title}`;
        marked.setOptions({ breaks: true });
        document.getElementById('commentBody').innerHTML = marked.parse(textOnlyBody || '(작성된 코멘트가 없습니다.)');

        imageSection.classList.add('visible');
        commentSection.classList.add('visible');
      }, 140);
    }

    // 7. LP 커버 스크롤 및 터치 스와이프 넘김
    function stepTrack(direction) {
      if (isScrolling || filteredPosts.length === 0) return;
      const nextIdx = currentIndex + direction;
      if (nextIdx >= 0 && nextIdx < filteredPosts.length) {
        isScrolling = true;
        currentIndex = nextIdx;
        updateActiveState();
        setTimeout(() => { isScrolling = false; }, 320);
      }
    }

    const carouselStage = document.getElementById('carouselStage');

    carouselStage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) < 10) return;
      stepTrack(delta > 0 ? 1 : -1);
    }, { passive: false });

    let touchStartX = 0;
    carouselStage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    carouselStage.addEventListener('touchend', (e) => {
      const diffX = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diffX) > 30) {
        stepTrack(diffX > 0 ? 1 : -1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') stepTrack(-1);
      if (e.key === 'ArrowRight') stepTrack(1);
    });

    fetchPosts();
  </script>
</body>
</html>
